<script>
    var toastTimer;
    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 2600);
    }
    var NOTI_PREVIEW_COUNT = 5; // 알림도 쌓이면 무한정 길어지지 않게 — 더보기로 펼침
    var notiExpanded = false;
    var notisCache = [];

    async function loadNotis() {
        notisCache = await API.notifications.listForMember(myMember.id);
    }

    function updateNotiDot() {
        var hasUnread = notisCache.some(function (n) { return !n.read; });
        var dot = document.getElementById('notiDot');
        if (dot) dot.classList.toggle('hidden', !hasUnread);
    }

    function renderNotiPanel() {
        var visibleNotis = notiExpanded ? notisCache : notisCache.slice(0, NOTI_PREVIEW_COUNT);
        var list = document.getElementById('notiList');
        list.innerHTML = '';

        if (!notisCache.length) {
            var empty = document.createElement('p');
            empty.className = 'font-label-sm text-label-sm text-on-surface-variant text-center py-6';
            empty.textContent = '아직 알림이 없어요';
            list.appendChild(empty);
            return;
        }

        visibleNotis.forEach(function (n) {
            var row = document.createElement('button');
            row.className = 'text-left w-full bg-surface-container-lowest rounded-xl p-4 shadow-[0px_2px_8px_rgba(120,119,119,0.06)] flex items-start gap-3';
            row.onclick = function () { showNotiDetail(n); };
            row.innerHTML =
                '<span class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 bg-tertiary-container text-on-tertiary-container"><span class="material-symbols-outlined text-[20px]">notifications</span></span>' +
                '<div class="flex-1 min-w-0">' +
                '<div class="flex items-center gap-2">' +
                '<p class="font-body-md text-body-md text-on-surface font-medium">' + n.text + '</p>' +
                (!n.read ? '<span class="w-2 h-2 rounded-full bg-primary shrink-0"></span>' : '') +
                '</div>' +
                (n.detail ? '<p class="font-label-sm text-label-sm text-on-surface-variant">' + n.detail + '</p>' : '') +
                '<p class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">' + new Date(n.created_at).toLocaleString('ko-KR') + '</p>' +
                '</div>';
            list.appendChild(row);
        });

        if (!notiExpanded && notisCache.length > NOTI_PREVIEW_COUNT) {
            var moreBtn = document.createElement('button');
            moreBtn.type = 'button';
            moreBtn.className = 'w-full text-center font-label-sm text-label-sm text-primary py-2';
            moreBtn.textContent = '+ ' + (notisCache.length - NOTI_PREVIEW_COUNT) + '개 더보기';
            moreBtn.onclick = function () { notiExpanded = true; renderNotiPanel(); };
            list.appendChild(moreBtn);
        }
    }

    async function showNotiDetail(n) {
        if (!n.read) { await API.notifications.markRead(n.id); n.read = true; updateNotiDot(); }
        var list = document.getElementById('notiList');
        var back = '<button id="notiBackBtn" class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant mb-1"><span class="material-symbols-outlined text-[18px]">arrow_back</span>목록으로</button>';
        var body = '<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0px_2px_8px_rgba(120,119,119,0.06)]">' +
            '<p class="font-body-md text-body-md text-on-surface mb-1">' + n.text + '</p>' +
            (n.detail ? '<p class="font-label-sm text-label-sm text-on-surface-variant">' + n.detail + '</p>' : '') +
            '</div>';
        var actions = '<div class="flex gap-2 mt-3">' +
            '<button id="notiAckBtn" class="flex-1 py-2.5 rounded-full bg-surface-container text-on-surface font-label-sm text-label-sm">확인했어요</button>' +
            (n.meal_id ? '<a href="../3-1. 내 식탁/code.html" class="flex-1 py-2.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm text-center">내 식탁에서 보기</a>' : '') +
            '</div>';

        list.innerHTML = back + body + actions;
        document.getElementById('notiBackBtn').onclick = renderNotiPanel;
        var ackBtn = document.getElementById('notiAckBtn');
        if (ackBtn) ackBtn.onclick = renderNotiPanel;
    }

    async function openNotiPanel() {
        await loadNotis();
        renderNotiPanel();
        document.getElementById('notiBackdrop').classList.remove('hidden');
        document.getElementById('notiPanel').classList.remove('hidden');
        requestAnimationFrame(function () { document.getElementById('notiPanel').style.transform = 'translateX(0)'; });

    function closeNotiPanel() {

    function openMenuPanel() {

        document.getElementById('menuPanel').classList.remove('hidden');
        requestAnimationFrame(function () { document.getElementById('menuPanel').style.transform = 'translateX(0)'; });
    }

    function closeMenuPanel() {
        document.getElementById('menuPanel').style.transform = 'translateX(100%)';
        document.getElementById('menuBackdrop').classList.add('hidden');
        setTimeout(function () { document.getElementById('menuPanel').classList.add('hidden'); }, 250);

    async function logoutFromMenu() {
        if (!confirm('로그아웃 할까요?')) return;
        await API.auth.signOut();
        window.location.href = '../2-1.로그인 화면/code.html';
    }

    var myMember = null;
    var householdId = null;
    var membersCache = [];

    function memberById(id) { return membersCache.find(function (m) { return m.id === id; }); }
    function todayKey() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function tomorrowKey() { var d = new Date(); d.setDate(d.getDate() + 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    // 홈 카드에서 먹어요/안먹어요를 누르면 그 자리에서 바로 결정되게(§5.1 "응답은 짧고, 탭 1~2번") —
    // 3-3(참여자 응답)의 개인 링크로 안 보내고 여기서 즉시 처리.
    async function respondToMeal(mealId, status) {
        await API.mealResponses.respondSelf(mealId, myMember.id, status);
        showToast(status === 'attending' ? '먹어요로 답했어요' : '안 먹어요로 답했어요');
        await renderAllMeals();
    }

    // 참고 이미지 기준 버킷 분류: 확정된 식사가 최우선(더 이상 할 일 없음), 그다음 내가
    // 만든 식사(응답 현황을 내가 챙겨야 함), 나머지는 전부 "내 응답이 필요한" 식사(이미 답했어도
    // 바꿀 수 있게 그대로 이 버킷에 남김 — renderMealCard의 참여자 분기가 이미 처리해줌).
    function bucketFor(meal) {
        if (meal.status === 'confirmed') return 'confirmed';
        if (meal.creator_id === myMember.profile_id) return 'hosted';
        return 'needsResponse';
    }

    // 식사 시간 알림(수업21일차_알람에서 이식) — 오늘 시간이 정해진 식사마다 실시간 카운트다운을
    // 보여주고, 시간이 되면 화면 알림 + 소리(Web Audio 오실레이터, 오디오 파일 없이 직접 생성)로 알려줌.
    var countdownTargets = []; // { el, meal, target } — renderAllMeals()가 다시 그릴 때마다 초기화
    var alertedMealIds = new Set(); // 이미 울린 식사는 페이지 열려있는 동안 다시 안 울림

    function appendCountdownIfNeeded(card, meal, when) {
        if (when !== '오늘' || !meal.time) return;
        // meal.time은 DB의 time 컬럼이라 "19:00:00"처럼 초까지 옴 — 그대로 ':00'을 더 붙이면
        // "19:00:00:00"이 되어 Date 파싱이 깨지고(NaN) 카운트다운이 "NaN분 남았어요"로 보이던 버그.
        var target = new Date(meal.date + 'T' + meal.time.slice(0, 5) + ':00');
        var span = document.createElement('p');
        span.className = 'font-label-sm text-label-sm text-on-tertiary-container -mt-1 mb-2';
        card.appendChild(span);
        var entry = { el: span, meal: meal, target: target };
        countdownTargets.push(entry);
        updateOneCountdown(entry);
    }

    function updateOneCountdown(entry) {
        var diff = entry.target.getTime() - Date.now();
        if (diff <= 0) {
            entry.el.textContent = '⏰ 식사 시간이에요';
            if (!alertedMealIds.has(entry.meal.id)) {
                alertedMealIds.add(entry.meal.id);
                ringMealAlarm(entry.meal);
            }
            return;
        }
        var totalMin = Math.floor(diff / 60000);
        var h = Math.floor(totalMin / 60), m = totalMin % 60;
        entry.el.textContent = '⏰ ' + (h > 0 ? h + '시간 ' + m + '분' : m + '분') + ' 남았어요';
    }

    setInterval(function () { countdownTargets.forEach(updateOneCountdown); }, 15000);

    var mealBeepInterval = null, mealAudioCtx = null;
    function ringMealAlarm(meal) {
        var menuLine = (meal.menu && meal.menu.length) ? meal.menu.join(', ') : '식사';
        document.getElementById('mealAlarmLabel').textContent = menuLine + ' 시간이에요!';
        document.getElementById('mealAlarmBackdrop').classList.remove('hidden');
        mealAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone() {
            var osc = mealAudioCtx.createOscillator(), gain = mealAudioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = 880; gain.gain.value = 0.2;
            osc.connect(gain).connect(mealAudioCtx.destination);
            osc.start(); osc.stop(mealAudioCtx.currentTime + 0.35);
        }
        playTone();
        mealBeepInterval = setInterval(playTone, 600);
        if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
    }
    function stopMealAlarm() {
        if (mealBeepInterval) { clearInterval(mealBeepInterval); mealBeepInterval = null; }
        if (mealAudioCtx) { mealAudioCtx.close(); mealAudioCtx = null; }
        if (navigator.vibrate) navigator.vibrate(0);
        document.getElementById('mealAlarmBackdrop').classList.add('hidden');
    }

    async function renderAllMeals() {
        countdownTargets = [];
        var sections = {
            needsResponse: { section: document.getElementById('needsResponseSection'), list: document.getElementById('needsResponseCards') },
            hosted: { section: document.getElementById('hostedSection'), list: document.getElementById('hostedCards') },
            confirmed: { section: document.getElementById('confirmedSection'), list: document.getElementById('confirmedCards') }
        };
        Object.keys(sections).forEach(function (k) { sections[k].list.innerHTML = ''; });

        var meals = await API.meals.listByHousehold(householdId);
        var today = todayKey(), tomorrow = tomorrowKey();
        var relevant = meals.filter(function (m) { return m.date === today || m.date === tomorrow; });

        for (var i = 0; i < relevant.length; i++) {
            var meal = relevant[i];
            var roster = await API.mealParticipants.getRoster(meal.id);
            var thumbHtml = await mealPhotoInnerHtml(meal);
            var bucket = bucketFor(meal);
            var card = renderMealCard(meal, roster, meal.date === today ? '오늘' : '내일', thumbHtml, bucket);
            sections[bucket].list.appendChild(card);
        }

        var anyMeals = false;
        Object.keys(sections).forEach(function (k) {
            var hasCards = sections[k].list.children.length > 0;
            sections[k].section.classList.toggle('hidden', !hasCards);
            if (hasCards) anyMeals = true;
        });
        document.getElementById('noMealsMsg').classList.toggle('hidden', anyMeals);
    }

    // 실제 사진이 있으면 사진, 없으면 메뉴 이름으로 캐시된 대표 이미지, 그것도 없으면
    // 로컬 플레이스홀더(foodPlaceholderHtml, shared/api.js) — 8-2/5-2와 동일한 폴백 순서.
    // 02_my_table.png 참고 이미지 기준(2026-08-19): 카드 오른쪽을 꽉 채우는 큰 사진 —
    // 크기/틀은 호출부에서 감싸고, 여기선 내용물(img 또는 플레이스홀더)만 w-full h-full로 반환.
    var menuImageCache = {};
    async function mealPhotoInnerHtml(meal) {
        var photo = await API.mealPhotos.getByMeal(meal.id);
        if (photo) return '<img src="' + photo.photo_url + '" class="w-full h-full object-cover scale-[2]">';
        var repName = meal.menu && meal.menu[0];
        if (!repName) return foodPlaceholderHtml(null, 'w-full h-full');
        if (menuImageCache[repName] === undefined) menuImageCache[repName] = await API.menuImages.get(repName);
        if (menuImageCache[repName]) return '<img src="' + menuImageCache[repName] + '" class="w-full h-full object-cover scale-[2]">';
        return foodPlaceholderHtml(repName, 'w-full h-full');
    }

    // TTS(수업21일차_알람에서 이식)는 02_my_table.png 리디자인으로 카드 밖(3-4)으로 옮김 — 여기 있던
    // speakRosterStatus 정의는 삭제(3-4. 확정 전 요약/code.html에 동일 기능 있음).

    function goToSummary(meal) {
        window.location.href = '../3-4. 확정 전 요약/code.html?meal=' + meal.id;
    }

    // 02_my_table.png 참고 이미지 기준(2026-08-19 재구성): 카드를 "왼쪽 텍스트(55%)/오른쪽 큰
    // 사진(45%, 카드 모서리까지 풀블리드)" 두 칸으로, 텍스트는 굵은 상태 헤더→회색 시간줄→굵은
    // 메뉴명→색 있는 상태줄 순서. 버튼은 그 아래 카드 전체 폭으로. 인원 요약/전체 로스터/TTS는
    // 참고 이미지엔 없지만 사용자가 예전에 따로 요청해서 만든 기능이라 그대로 유지(제거 여부는
    // 확인 대기 중) — 위치만 새 구조(응답 현황 보기 버튼 위)로 옮김.
    function renderMealCard(meal, roster, when, photoInner, bucket) {
        var isHost = meal.creator_id === myMember.profile_id;
        var creatorMember = membersCache.find(function (m) { return m.profile_id === meal.creator_id; });
        var card = document.createElement('article');
        card.className = 'rounded-2xl bg-surface-container-lowest shadow-[0px_4px_12px_rgba(120,119,119,0.08)] overflow-hidden mb-3';

        var timeLine = when + ' · ' + (meal.time ? meal.time.slice(0, 5) : '시간 미정');
        var hasMenu = meal.menu && meal.menu.length;

        if (!hasMenu) {
            var body = document.createElement('div');
            body.className = 'p-card-padding';
            body.innerHTML = '<p class="font-label-sm text-label-sm text-on-surface-variant mb-1">' + timeLine + '</p>' +
                '<h3 class="font-headline-lg text-headline-lg text-on-surface-variant mb-3">메뉴 정하는 중</h3>';
            card.appendChild(body);
            if (isHost) {
                var editBtn = document.createElement('button');
                editBtn.className = 'w-full text-center font-label-sm text-label-sm text-primary py-1 pb-4';
                editBtn.textContent = '메뉴 · 시간 정하기 →';
                editBtn.onclick = function () { window.location.href = '../3-2. 식사 만들기/code.html?edit=' + meal.id; };
                card.appendChild(editBtn);
            }
            return card;
        }

        var menuLine = meal.menu.slice(0, 2).join(', ');
        var attending = roster.filter(function (r) { return r.status === 'attending'; }).length;
        var pending = roster.filter(function (r) { return r.status === 'pending'; }).length;
        var mine = roster.find(function (r) { return r.memberId === myMember.id; });

        var headerText, headerIconHtml = '';
        if (bucket === 'needsResponse') {
            headerText = '응답이 필요해요';
            headerIconHtml = '<span class="material-symbols-outlined" style="color:#ba1a1a;font-size:20px;">error</span>';
        } else if (bucket === 'confirmed') {
            headerText = '확정된 식사';
        } else {
            headerText = isHost ? '내가 만든 식사' : ((creatorMember ? creatorMember.name : '가족') + '님이 만든 식사');
        }

        var statusLineHtml;
        if (bucket === 'confirmed') {
            statusLineHtml = '<span class="text-primary font-bold">' + attending + '명 확정</span>';
        } else if (bucket === 'hosted') {
            statusLineHtml = pending > 0
                ? '<span class="text-primary font-bold">' + attending + '명</span> 응답 · <span class="text-error font-semibold" style="font-size:0.9em;">' + pending + '명 확인 전</span>'
                : '<span class="text-primary font-bold">' + attending + '명</span> 응답 · 다 확인됐어요';
        } else if (mine && mine.status === 'attending') {
            statusLineHtml = '<span style="color:#6b7f5c;">이미 응답했어요 · 먹어요' + (mine.note ? ' · ' + mine.note : '') + '</span>';
        } else if (mine && mine.status === 'absent') {
            statusLineHtml = '<span class="text-on-surface-variant">이미 응답했어요 · 안 먹어요</span>';
        } else {
            statusLineHtml = '<span class="text-error font-semibold">내가 아직 응답하지 않았어요</span>';
        }

        var top = document.createElement('div');
        top.className = 'flex items-stretch';
        top.innerHTML =
            '<div class="meal-card-left w-[55%] min-w-0 flex flex-col justify-center p-card-padding" style="word-break:keep-all;">' +
                '<div class="flex items-center justify-between mb-1">' +
                    '<p class="font-headline-lg text-headline-lg font-bold text-on-surface flex items-center gap-1.5">' + headerIconHtml + headerText + '</p>' +
                    (isHost ? '<button type="button" class="edit-meal-btn w-7 h-7 flex items-center justify-center rounded-full text-on-surface-variant shrink-0" aria-label="메뉴·시간 수정"><span class="material-symbols-outlined text-[16px]">edit</span></button>' : '') +
                '</div>' +
                '<p class="font-label-sm text-label-sm text-on-surface-variant mb-1">' + timeLine + '</p>' +
                '<p class="font-headline-lg text-headline-lg font-bold text-on-surface mb-1">' + menuLine + '</p>' +
                '<p class="font-body-md text-body-md">' + statusLineHtml + '</p>' +
            '</div>' +
            '<div class="w-[45%] shrink-0 relative overflow-hidden"><div class="absolute inset-0">' + photoInner + '</div></div>';
        card.appendChild(top);

        var leftCol = top.querySelector('.meal-card-left');
        if (isHost) {
            top.querySelector('.edit-meal-btn').onclick = function () { window.location.href = '../3-2. 식사 만들기/code.html?edit=' + meal.id; };
        }
        appendCountdownIfNeeded(leftCol, meal, when);

        var actions = document.createElement('div');
        actions.className = 'px-card-padding pb-card-padding';

        if (bucket === 'confirmed') {
            // 참고 이미지처럼 확정된 식사는 버튼 없이 상태줄에서 끝남.
        } else if (bucket === 'hosted') {
            // 인원 요약/전체 로스터/TTS는 02_my_table.png엔 없어서 카드 밖으로 뺌 — "응답 현황 보기"가
            // 가는 3-4(확정 전 요약)에 이미 같은 로스터 상세 화면이 있어서 거기에 TTS 버튼을 옮겨 달았음
            // (결정 완료, 2026-08-19 — DECISIONS.md 참고).
            var detailBtn = document.createElement('button');
            detailBtn.className = 'w-full text-center font-label-sm text-label-sm text-primary border-2 border-primary rounded-full py-2.5';
            detailBtn.textContent = '응답 현황 보기 →';
            detailBtn.onclick = function () { goToSummary(meal); };
            actions.appendChild(detailBtn);
        } else if (mine && (mine.status === 'attending' || mine.status === 'absent')) {
            var changeBtn = document.createElement('button');
            changeBtn.type = 'button';
            changeBtn.className = 'font-label-sm text-label-sm text-primary underline';
            changeBtn.textContent = '바꾸기';
            changeBtn.onclick = function () { respondToMeal(meal.id, mine.status === 'attending' ? 'absent' : 'attending'); };
            actions.appendChild(changeBtn);
        } else {
            var btnRow = document.createElement('div');
            btnRow.className = 'flex gap-2';
            var yesBtn = document.createElement('button');
            yesBtn.className = 'flex-1 py-2.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm active:scale-[0.98] transition-transform';
            yesBtn.textContent = '먹어요';
            var noBtn = document.createElement('button');
            noBtn.className = 'flex-1 py-2.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm active:scale-[0.98] transition-transform';
            noBtn.textContent = '안 먹어요';
            yesBtn.onclick = function () { respondToMeal(meal.id, 'attending'); };
            noBtn.onclick = function () { respondToMeal(meal.id, 'absent'); };
            btnRow.appendChild(yesBtn);
            btnRow.appendChild(noBtn);
            actions.appendChild(btnRow);
        }

        card.appendChild(actions);
        return card;
    }

    // "매번 보내기" 안 해도 되게: 3-2에서 설정해둔 반복 규칙 중 오늘 요일에 해당하는 게 있으면
    // 오늘치를 자동으로 생성한다(하루 한 번만, last_fired_date로 중복 방지).
    async function checkRecurringMeals() {
        var rules = await API.recurringMeals.list(householdId);
        if (!rules.length) return;
        var today = todayKey();
        var todayDay = new Date().getDay();
        var firedAny = false;

        for (var i = 0; i < rules.length; i++) {
            var rule = rules[i];
            if (rule.days.indexOf(todayDay) === -1) continue;
            if (rule.last_fired_date === today) continue;
            var meal = await API.meals.create(householdId, {
                date: today, time: rule.time, kind: rule.kind, menu: rule.menu, status: 'open'
            });
            await API.mealParticipants.bulkCreateWithTokens(meal.id, rule.participant_member_ids);
            await API.recurringMeals.markFired(rule.id, today);
            firedAny = true;
        }
        if (firedAny) showToast('반복 일정이 있어서 오늘 식사를 자동으로 열었어요');
    }

    var realtimeChannel = null;

    (async function init() {
        await requireSession();
        myMember = await getMyMember();
        if (!myMember) { window.location.href = '../1-2. 온보딩-시작하기/code.html'; return; }
        householdId = myMember.household_id;
        membersCache = await API.members.list(householdId);

        var household = myMember.households_vc2608 || (await API.households.get(householdId));
        document.getElementById('greetName').textContent = myMember.name || '이름 없음';
        document.getElementById('greetSub').textContent = (household.name || '우리집') + ' · 오늘도 좋은 식사 되세요';
        document.getElementById('householdSelectorLabel').textContent = household.name || '우리집';

        var avatarBtn = document.getElementById('profileAvatarBtn');
        if (myMember.avatar_url) { avatarBtn.innerHTML = '<img src="' + myMember.avatar_url + '" class="w-full h-full object-cover">'; }
        else { avatarBtn.textContent = (myMember.name || '?').trim().charAt(0) || '?'; }

        await checkRecurringMeals();
        await renderAllMeals();
        await loadNotis();
        updateNotiDot();

        var params = new URLSearchParams(window.location.search);
        if (params.get('edited') === '1') showToast('수정됐어요 · 참여자 링크는 그대로예요');

        realtimeChannel = API.realtime.subscribeToHousehold(
            householdId, ['meals_vc2608', 'meal_responses_vc2608', 'notifications_vc2608'],
            function () { renderAllMeals(); loadNotis().then(updateNotiDot); }
        );
        window.addEventListener('beforeunload', function () { API.realtime.unsubscribe(realtimeChannel); });
    })();
</script>
