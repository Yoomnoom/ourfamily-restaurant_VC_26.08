      } } }

<style>
    body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    .active\:scale-95:active, .active\:scale-\[0\.98\]:active {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<main class="w-full max-w-[600px] flex flex-col px-safe-area-inset py-section-margin pb-16">

<header class="flex items-center gap-3 mb-6">
<button class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../3-0. 홈/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface">메뉴 대표 사진</h1>
</header>

<p class="font-label-sm text-label-sm text-on-surface-variant mb-4 px-1">여기서 등록·수정한 사진은 우리 가구뿐 아니라 이 메뉴로 식사를 만드는 모든 가구에 똑같이 보여요.</p>

<!-- 새로 등록 -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(120,119,119,0.08)] p-card-padding mb-6 flex flex-col gap-3">
<h2 class="font-body-md text-body-md text-on-surface font-medium">새 메뉴 사진 등록</h2>
<input id="newMenuName" type="text" placeholder="메뉴 이름 (예: 참치김치찌개)" class="w-full border border-outline-variant rounded-lg px-3 py-2.5 font-body-md text-body-md text-on-surface bg-surface-container-lowest">
<div class="flex items-center gap-3">
<div id="newPreviewBox" class="w-16 h-16 rounded-lg bg-surface-container flex items-center justify-center overflow-hidden shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">image</span>
</div>
<label class="flex-1 text-center py-2.5 rounded-lg border border-dashed border-outline-variant text-on-surface-variant font-label-sm text-label-sm cursor-pointer">
사진 선택
<input id="newPhotoInput" type="file" accept="image/*" class="hidden" onchange="handleNewPhotoChange(event)">
</label>
</div>
<p id="newFormError" class="hidden font-label-sm text-label-sm text-error"></p>
<button id="registerBtn" class="w-full bg-primary text-on-primary font-label-sm text-[15px] py-3 rounded-full shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2" onclick="registerNewMenu()">등록</button>
</div>

<!-- 등록된 목록 -->
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide mb-3 px-1">등록된 대표 사진</h2>
<div id="loadingList" class="flex items-center justify-center gap-2 font-label-sm text-label-sm text-on-surface-variant py-8">
<span class="spinner"></span> 불러오는 중...
</div>
<div id="menuImageList" class="flex flex-col gap-2"></div>
<p id="emptyMsg" class="hidden font-label-sm text-label-sm text-on-surface-variant text-center py-8">아직 등록된 대표 사진이 없어요.</p>

</main>

<script>
    var SOURCE_LABEL = { manual: '수동 등록', generated: 'AI 생성', user_photo: '사용자 사진' };

    function resizeImageFile(file) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onerror = reject;
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var maxSide = 1000;
                    var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    var canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(function (blob) { resolve({ blob: blob, dataUrl: e.target.result }); }, 'image/jpeg', 0.85);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    var newPhotoBlob = null;
    function handleNewPhotoChange(event) {
        var file = event.target.files[0];
        if (!file) return;
        resizeImageFile(file).then(function (result) {
            newPhotoBlob = result.blob;
            document.getElementById('newPreviewBox').innerHTML = '<img src="' + result.dataUrl + '" class="w-full h-full object-cover">';
        });
    }

    async function registerNewMenu() {
        var errorEl = document.getElementById('newFormError');
        errorEl.classList.add('hidden');
        var name = document.getElementById('newMenuName').value.trim();
        if (!name) { errorEl.textContent = '메뉴 이름을 입력해주세요.'; errorEl.classList.remove('hidden'); return; }
        if (!newPhotoBlob) { errorEl.textContent = '사진을 선택해주세요.'; errorEl.classList.remove('hidden'); return; }

        var btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.textContent = '등록 중...';
        try {
            var url = await API.storage.uploadMenuImage(name, newPhotoBlob);
            await API.menuImages.save(name, url, 'manual');
            document.getElementById('newMenuName').value = '';
            newPhotoBlob = null;
            document.getElementById('newPreviewBox').innerHTML = '<span class="material-symbols-outlined text-on-surface-variant">image</span>';
            await renderList();
        } catch (err) {
            errorEl.textContent = '등록에 실패했어요: ' + err.message;
            errorEl.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = '등록';
        }
    }

    async function replaceMenuPhoto(menuName, file) {
        try {
            var result = await resizeImageFile(file);
            var url = await API.storage.uploadMenuImage(menuName, result.blob);
            await API.menuImages.save(menuName, url, 'manual');
            await renderList();
        } catch (err) {
            alert('사진 변경에 실패했어요: ' + err.message);
            throw err;
        }
    }

    async function removeMenuPhoto(menuName) {
        if (!confirm('"' + menuName + '"의 대표 사진을 삭제할까요? 다음부터는 이모지 플레이스홀더로 보여요.')) return;
        try {
            await API.menuImages.remove(menuName);
            await renderList();
        } catch (err) {
            alert('삭제에 실패했어요: ' + err.message);
        }
    }

    async function renderList() {
        var loading = document.getElementById('loadingList');
        var list = document.getElementById('menuImageList');
        var emptyMsg = document.getElementById('emptyMsg');
        loading.classList.remove('hidden');
        list.innerHTML = '';

        var rows;
        try {
            rows = await API.menuImages.list();
        } catch (err) {
            loading.innerHTML = '<p class="font-label-sm text-label-sm text-error">목록을 불러오지 못했어요: ' + err.message + '</p>';
            return;
        }
        loading.classList.add('hidden');
        emptyMsg.classList.toggle('hidden', rows.length > 0);

        rows.forEach(function (row) {
            var item = document.createElement('div');
            item.className = 'bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(120,119,119,0.08)] p-3 flex items-center gap-3';

            var thumb = document.createElement('img');
            thumb.src = row.image_url;
            thumb.className = 'w-14 h-14 rounded-lg object-cover shrink-0 bg-surface-container';
            item.appendChild(thumb);

            var info = document.createElement('div');
            info.className = 'flex-1 min-w-0';
            var nameEl = document.createElement('p');
            nameEl.className = 'font-body-md text-body-md text-on-surface truncate';
            nameEl.textContent = row.menu_name;
            var sourceEl = document.createElement('span');
            sourceEl.className = 'font-label-sm text-label-sm bg-tertiary-container text-on-tertiary-container px-2 py-0.5 rounded-full';
            sourceEl.textContent = SOURCE_LABEL[row.source] || row.source || '-';
            info.appendChild(nameEl);
            info.appendChild(sourceEl);
            item.appendChild(info);

            var actions = document.createElement('div');
            actions.className = 'flex flex-col gap-1 shrink-0';

            var replaceLabel = document.createElement('label');
            replaceLabel.className = 'font-label-sm text-label-sm text-primary cursor-pointer text-center';
            replaceLabel.textContent = '사진 바꾸기';
            var replaceInput = document.createElement('input');
            replaceInput.type = 'file';
            replaceInput.accept = 'image/*';
            replaceInput.className = 'hidden';
            replaceInput.onchange = function (e) {
                var file = e.target.files[0];
                if (!file) return;
                replaceLabel.textContent = '변경 중...';
                replaceMenuPhoto(row.menu_name, file).catch(function (err) { alert('변경 실패: ' + err.message); });
            };
            replaceLabel.appendChild(replaceInput);
            actions.appendChild(replaceLabel);

            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'font-label-sm text-label-sm text-error';
            removeBtn.textContent = '삭제';
            removeBtn.onclick = function () { removeMenuPhoto(row.menu_name); };
            actions.appendChild(removeBtn);

            item.appendChild(actions);
            list.appendChild(item);
        });
    }

    (async function init() {
        var session = await requireSession();
        if (!session) return;
        await renderList();
    })();
</script>
</body></html>
