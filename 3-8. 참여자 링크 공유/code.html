<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>우리집식당 - 링크 공유</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
              "colors": {
                      "surface": "#fbf9f8", "surface-container-lowest": "#ffffff", "surface-container": "#f0eded",
                      "on-surface": "#1b1c1c", "on-surface-variant": "#45474a", "outline-variant": "#c6c6ca",
                      "primary": "#5d5e62", "on-primary": "#ffffff", "tertiary-container": "#fef4e9", "on-tertiary-container": "#766f66"
              },
              "spacing": { "section-margin": "2rem", "card-padding": "1.25rem", "safe-area-inset": "1rem", "stack-gap": "1rem" },
              "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
              "fontSize": {
                      "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                      "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "label-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500" }]
              }
      } } }
      </script>
<style>body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    /* 애플 디자인 원칙: 눌림 피드백은 즉시, 정지는 스프링형(임계감쇠)으로 — WWDC "Designing Fluid Interfaces" */
    .active\:scale-95:active, .active\:scale-\[0\.98\]:active, .active\:scale-\[0\.95\]:active {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 120ms !important;
    }
    .active\:scale-95, .active\:scale-\[0\.98\], .active\:scale-\[0\.95\] {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 180ms !important;
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bg-on-surface text-surface font-label-sm text-label-sm px-4 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300" style="bottom:24px; z-index:100;"></div>

<main class="w-full max-w-[600px] flex flex-col px-safe-area-inset py-section-margin">

<div class="flex items-center gap-2 bg-tertiary-container text-on-tertiary-container rounded-xl px-4 py-3 mb-6">
<span class="material-symbols-outlined">check_circle</span>
<p class="font-body-md text-body-md">식사가 생성됐어요!<br>참여자에게 링크를 보내주세요.</p>
</div>

<h1 class="font-headline-lg text-headline-lg text-on-surface mb-3">참여자별 응답 링크</h1>

<div id="linkList" class="flex flex-col gap-3 mb-8"></div>

<button class="w-full bg-primary text-on-primary font-label-sm text-[15px] py-4 rounded-full shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-[0.98] transition-transform" onclick="window.location.href='../3-1. 내 식탁/code.html'">홈으로</button>

</main>

<script>
    var toastTimer;
    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 2600);
    }

    function copyLink(url, btn) {
        var fallback = function () {
            var original = btn.textContent;
            btn.textContent = '복사됨';
            setTimeout(function () { btn.textContent = original; }, 1200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(fallback, fallback);
        } else { fallback(); }
    }

    function linkUrlFor(token) {
        // 실제 도메인이 아직 없어서(정적 파일 배포) 지금 열려있는 origin 기준 상대 경로로 링크를 만듦.
        // 폴더명에 한글·공백이 있어서 encodeURI로 감싸야 카톡 등에 붙여넣었을 때 안 깨짐.
        var base = window.location.origin + window.location.pathname.replace(/\/[^/]*\/[^/]*$/, '') + '/3-3. 참여자 응답/code.html';
        return encodeURI(base) + '?token=' + token;
    }

    function renderRow(r, freshToken) {
        var row = document.createElement('div');
        row.className = 'bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)]';

        var top = document.createElement('div');
        top.className = 'flex items-center gap-2.5 mb-2';
        top.innerHTML =
            '<span class="w-8 h-8 rounded-full flex items-center justify-center text-on-primary font-label-sm text-label-sm shrink-0" style="background-color:' + (r.color || '#8a9a7b') + ';">' + (r.name || '?').trim().charAt(0) + '</span>' +
            '<span class="font-body-md text-body-md text-on-surface flex-1">' + r.name + '</span>';
        row.appendChild(top);

        var actions = document.createElement('div');
        actions.className = 'flex flex-col gap-2';

        if (!freshToken) {
            var lostLine = document.createElement('p');
            lostLine.className = 'font-label-sm text-label-sm text-on-surface-variant mb-2';
            lostLine.textContent = '이 링크는 다시 만들어야 볼 수 있어요 (보안을 위해 원본은 저장하지 않아요)';
            row.appendChild(lostLine);
            var regenBtn = document.createElement('button');
            regenBtn.type = 'button';
            regenBtn.className = 'w-full py-2.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm';
            regenBtn.textContent = '새 링크 만들기';
            regenBtn.onclick = async function () {
                regenBtn.disabled = true;
                var token = await API.mealParticipants.regenerateToken(r.participantId);
                row.replaceWith(renderRow(r, token));
            };
            row.appendChild(regenBtn);
            return row;
        }

        var url = linkUrlFor(freshToken); // 실제 복사·공유에 쓰는 값 — 카톡 등에 안전하게 붙여넣히려면 인코딩된 상태여야 함
        var linkLine = document.createElement('p');
        linkLine.className = 'font-label-sm text-label-sm text-on-surface-variant mb-3 break-all';
        // 화면엔 %EC%B0%B8 같은 퍼센트 인코딩 범벅 대신 사람이 읽기 좋은 원문으로 보여줌(복사 값은 그대로 url 유지).
        linkLine.textContent = decodeURI(url);
        row.appendChild(linkLine);

        var topRow = document.createElement('div');
        topRow.className = 'flex gap-2';

        var copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'flex-1 py-2.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm';
        copyBtn.textContent = '복사';
        copyBtn.onclick = function () { copyLink(url, copyBtn); };
        topRow.appendChild(copyBtn);

        var shareBtn = document.createElement('button');
        shareBtn.type = 'button';
        shareBtn.className = 'flex-1 py-2.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm whitespace-nowrap';
        shareBtn.textContent = '카카오톡';
        shareBtn.onclick = function () { showToast('카카오톡 공유는 실제 서비스에서 연동돼요.'); };
        topRow.appendChild(shareBtn);
        actions.appendChild(topRow);

        var previewBtn = document.createElement('button');
        previewBtn.type = 'button';
        previewBtn.className = 'w-full py-2.5 rounded-full border border-outline-variant text-on-surface-variant font-label-sm text-label-sm';
        previewBtn.textContent = '미리보기';
        previewBtn.onclick = function () { window.location.href = '../3-3. 참여자 응답/code.html?token=' + freshToken; };
        actions.appendChild(previewBtn);

        row.appendChild(actions);
        return row;
    }

    (async function init() {
        await requireSession();
        var params = new URLSearchParams(window.location.search);
        var mealId = params.get('meal');
        if (!mealId) { showToast('식사 정보를 찾을 수 없어요'); return; }

        var roster = await API.mealParticipants.getRoster(mealId);
        var freshLinks = {};
        try { freshLinks = {}; (JSON.parse(localStorage.getItem('fresh_links_' + mealId) || '[]')).forEach(function (x) { freshLinks[x.memberId] = x.token; }); } catch (err) {}

        var list = document.getElementById('linkList');
        list.innerHTML = '';
        roster.forEach(function (r) {
            list.appendChild(renderRow(r, freshLinks[r.memberId]));
        });

        // 한 번 보여줬으면 이 임시 저장은 정리 — 새로고침해도 다시 안 보이는 게 맞음(원본은 해시로만 저장되므로).
        try { localStorage.removeItem('fresh_links_' + mealId); } catch (err) {}
    })();
</script>
</body></html>
