<!-- 이미지 조정(크롭) 모달 -->
<div id="crop-modal" class="crop-modal" hidden="">
<div class="crop-modal-content">
<h3 class="font-headline-lg text-headline-lg text-on-surface mb-1">프로필 이미지 조정</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-4">이미지를 드래그해서 위치를 옮기고, 슬라이더로 확대/축소하세요.</p>
<div class="crop-stage" id="crop-stage">
<img id="crop-image" class="crop-image" alt="크롭할 이미지" draggable="false">
</div>
<input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1">
<div class="flex gap-3">
<button type="button" class="flex-1 py-3 rounded-full bg-surface-container-high text-on-surface font-label-sm text-label-sm" id="crop-cancel-btn">취소</button>
<button type="button" class="flex-1 py-3 rounded-full bg-primary text-on-primary font-label-sm text-label-sm" id="crop-confirm-btn">적용</button>
</div>

<script>
    var nameInput = document.getElementById('name');
    var emailInput = document.getElementById('email');
    var passwordInput = document.getElementById('password');
    var passwordConfirmInput = document.getElementById('password-confirm');
    var phoneInput = document.getElementById('phone');
    var addressInput = document.getElementById('address');
    var profileImageInput = document.getElementById('profile-image');
    var profilePreview = document.getElementById('profile-preview');

    var nameError = document.getElementById('name-error');
    var emailError = document.getElementById('email-error');
    var passwordError = document.getElementById('password-error');
    var passwordConfirmError = document.getElementById('password-confirm-error');
    var phoneError = document.getElementById('phone-error');

    var formMessage = document.getElementById('form-message');
    var loading = document.getElementById('loading');
    var signupBtn = document.getElementById('signup-btn');
    var resetBtn = document.getElementById('reset-btn');
    var loginBtn = document.getElementById('login-btn');

    var cropModal = document.getElementById('crop-modal');
    var cropStage = document.getElementById('crop-stage');
    var cropImage = document.getElementById('crop-image');
    var cropZoom = document.getElementById('crop-zoom');
    var cropCancelBtn = document.getElementById('crop-cancel-btn');
    var cropConfirmBtn = document.getElementById('crop-confirm-btn');

    var selectedProfileDataUrl = null;

    var STAGE_SIZE = 220;
    var OUTPUT_SIZE = 300;

    var cropState = { naturalWidth: 0, naturalHeight: 0, baseScale: 1, zoom: 1, offsetX: 0, offsetY: 0 };
    var isDragging = false, dragStartX = 0, dragStartY = 0, dragStartOffsetX = 0, dragStartOffsetY = 0;

    profileImageInput.addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            cropImage.onload = function () { openCropModal(); };
            cropImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });

    function openCropModal() {
        cropState.naturalWidth = cropImage.naturalWidth;
        cropState.naturalHeight = cropImage.naturalHeight;
        cropState.baseScale = Math.max(STAGE_SIZE / cropState.naturalWidth, STAGE_SIZE / cropState.naturalHeight);
        cropState.zoom = 1;
        var displayWidth = cropState.naturalWidth * getTotalScale();
        var displayHeight = cropState.naturalHeight * getTotalScale();
        cropState.offsetX = (STAGE_SIZE - displayWidth) / 2;
        cropState.offsetY = (STAGE_SIZE - displayHeight) / 2;
        cropZoom.value = '1';
        applyCropTransform();
        cropModal.hidden = false;
    }

    function getTotalScale() { return cropState.baseScale * cropState.zoom; }

    function clampOffset() {
        var totalScale = getTotalScale();
        var displayWidth = cropState.naturalWidth * totalScale;
        var displayHeight = cropState.naturalHeight * totalScale;
        var minX = STAGE_SIZE - displayWidth;
        var minY = STAGE_SIZE - displayHeight;
        cropState.offsetX = Math.min(0, Math.max(minX, cropState.offsetX));
        cropState.offsetY = Math.min(0, Math.max(minY, cropState.offsetY));
    }

    function applyCropTransform() {
        clampOffset();
        var totalScale = getTotalScale();
        cropImage.style.width = (cropState.naturalWidth * totalScale) + 'px';
        cropImage.style.height = (cropState.naturalHeight * totalScale) + 'px';
        cropImage.style.left = cropState.offsetX + 'px';
        cropImage.style.top = cropState.offsetY + 'px';
    }

    cropStage.addEventListener('pointerdown', function (event) {
        isDragging = true;
        cropStage.classList.add('dragging');
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        dragStartOffsetX = cropState.offsetX;
        dragStartOffsetY = cropState.offsetY;
        cropStage.setPointerCapture(event.pointerId);
    });
    cropStage.addEventListener('pointermove', function (event) {
        if (!isDragging) return;
        var deltaX = event.clientX - dragStartX;
        var deltaY = event.clientY - dragStartY;
        cropState.offsetX = dragStartOffsetX + deltaX;
        cropState.offsetY = dragStartOffsetY + deltaY;
        applyCropTransform();
    });
    function stopDragging() { isDragging = false; cropStage.classList.remove('dragging'); }
    cropStage.addEventListener('pointerup', stopDragging);
    cropStage.addEventListener('pointercancel', stopDragging);

    cropZoom.addEventListener('input', function () {
        cropState.zoom = Number(cropZoom.value);
        applyCropTransform();
    });

    cropCancelBtn.addEventListener('click', function () {
        cropModal.hidden = true;
        profileImageInput.value = '';
    });

    cropConfirmBtn.addEventListener('click', function () {
        var totalScale = getTotalScale();
        var sourceX = (0 - cropState.offsetX) / totalScale;
        var sourceY = (0 - cropState.offsetY) / totalScale;
        var sourceSize = STAGE_SIZE / totalScale;

        var canvas = document.createElement('canvas');
        canvas.width = OUTPUT_SIZE;
        canvas.height = OUTPUT_SIZE;
        var ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(OUTPUT_SIZE / 2, OUTPUT_SIZE / 2, OUTPUT_SIZE / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(cropImage, sourceX, sourceY, sourceSize, sourceSize, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

        selectedProfileDataUrl = canvas.toDataURL('image/png');
        profilePreview.src = selectedProfileDataUrl;
        cropModal.hidden = true;
        profileImageInput.value = '';
    });

    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var targetId = btn.getAttribute('data-target');
            var targetInput = document.getElementById(targetId);
            if (targetInput.type === 'password') {
                targetInput.type = 'text';
                btn.textContent = '🙈';
            } else {
                targetInput.type = 'password';
                btn.textContent = '👁';
            }
        });
    });

    resetBtn.addEventListener('click', function () {
        setTimeout(function () {
            profilePreview.src = 'https://placehold.co/120x120?text=Profile';
            selectedProfileDataUrl = null;
            clearAllErrors();
            formMessage.textContent = '';
        }, 0);
    });

    loginBtn.addEventListener('click', function () {
        window.location.href = '../2-2. 로그인/code.html';
    });

    var EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var PHONE_REGEX = /^01[0-9]-?\d{3,4}-?\d{4}$/;

    function clearAllErrors() {
        [nameError, emailError, passwordError, passwordConfirmError, phoneError].forEach(function (el) { el.textContent = ''; });
    }

    function validateForm() {
        clearAllErrors();
        var isValid = true;

        if (!nameInput.value.trim()) { nameError.textContent = '이름을 입력해주세요.'; isValid = false; }

        var email = emailInput.value.trim();
        if (!email) { emailError.textContent = '이메일을 입력해주세요.'; isValid = false; }
        else if (!EMAIL_REGEX.test(email)) { emailError.textContent = '이메일 형식이 올바르지 않습니다.'; isValid = false; }

        var password = passwordInput.value;
        if (!password) { passwordError.textContent = '비밀번호를 입력해주세요.'; isValid = false; }
        else if (password.length < 8) { passwordError.textContent = '비밀번호는 8자 이상이어야 합니다.'; isValid = false; }

        var passwordConfirm = passwordConfirmInput.value;
        if (!passwordConfirm) { passwordConfirmError.textContent = '비밀번호 확인을 입력해주세요.'; isValid = false; }
        else if (password !== passwordConfirm) { passwordConfirmError.textContent = '비밀번호가 일치하지 않습니다.'; isValid = false; }

        var phone = phoneInput.value.trim();
        if (phone && !PHONE_REGEX.test(phone)) { phoneError.textContent = '전화번호 형식이 올바르지 않습니다. (예: 010-1234-5678)'; isValid = false; }

        return isValid;
    }

    function setLoading(isLoading) {
        loading.classList.toggle('hidden', !isLoading);
        loading.classList.toggle('flex', isLoading);
        signupBtn.disabled = isLoading;
        resetBtn.disabled = isLoading;
    }

    document.getElementById('signup-form').addEventListener('submit', function (event) {
        event.preventDefault();
        formMessage.textContent = '';
        formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px]';

        if (!validateForm()) return;

        setLoading(true);

        signUpAndProceed().catch(function (err) {
            setLoading(false);
            if (err.message === 'User already registered') {
                formMessage.innerHTML = '이미 가입된 이메일이에요.<br>로그인해주세요.';
            } else {
                formMessage.textContent = '회원가입에 실패했어요: ' + err.message;
            }
            formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-error';
        });
    });

    async function signUpAndProceed() {
        var name = nameInput.value.trim();
        var email = emailInput.value.trim();

        await API.auth.signUp(email, passwordInput.value, name);

        // onboarding_nickname/onboarding_profile_photo는 1-3/1-4가 여전히 참조하므로
        // 실제 세션 기반 전환 전까지 화면 간 임시 전달용으로 남겨둠.
        localStorage.setItem('onboarding_nickname', name);

        var profileFields = {};
        if (phoneInput.value.trim()) profileFields.phone = phoneInput.value.trim();
        if (addressInput.value.trim()) profileFields.address = addressInput.value.trim();

        if (selectedProfileDataUrl) {
            var blob = await (await fetch(selectedProfileDataUrl)).blob();
            var session = await getSession();
            var avatarUrl = await API.storage.uploadAvatar(session.user.id, blob);
            profileFields.avatar_url = avatarUrl;
            localStorage.setItem('onboarding_profile_photo', selectedProfileDataUrl);
        }
        if (Object.keys(profileFields).length) {
            await API.auth.updateMyProfile(profileFields);
        }

        setLoading(false);
        formMessage.innerHTML = '회원가입이 완료되었어요!<br>다음 단계로 이동합니다.';
        formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-primary';

        // 3-9(무가입 응답 연결)에서 넘어온 가입이면, 새 가구를 만드는 온보딩(1-2)이 아니라
        // 원래 초대받은 가구에 이 계정을 연결하는 3-9로 돌아가야 함(§7.6 B방식).
        var linkToken = new URLSearchParams(window.location.search).get('linkToken');
        var nextUrl = linkToken
            ? '../3-9. 무가입 응답 연결/code.html?token=' + linkToken + '&afterSignup=1'
            : '../1-2. 온보딩-시작하기/code.html';
        setTimeout(function () {
            window.location.href = nextUrl;
        }, 800);
    }
</script>
</body></html>
