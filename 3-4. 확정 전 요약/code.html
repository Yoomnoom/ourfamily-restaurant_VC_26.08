<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>우리집식당 - 확정 전 요약</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: { extend: {
              "colors": {
                      "surface-container-low": "#f6f3f3", "on-error-container": "#93000a", "on-secondary": "#ffffff",
                      "surface-variant": "#e4e2e2", "surface-container-lowest": "#ffffff", "secondary-container": "#e3e2e3",
                      "surface-container": "#f0eded", "on-secondary-fixed-variant": "#464748", "on-error": "#ffffff",
                      "outline-variant": "#c6c6ca", "on-tertiary-fixed-variant": "#4b463e", "on-surface-variant": "#45474a",
                      "tertiary-fixed-dim": "#cec5bb", "outline": "#76777b", "on-primary-container": "#6f7074",
                      "on-secondary-fixed": "#1b1c1d", "error-container": "#ffdad6", "on-primary-fixed": "#1a1c1f",
                      "inverse-surface": "#303030", "on-surface": "#1b1c1c", "secondary-fixed-dim": "#c7c6c7",
                      "inverse-primary": "#5d5e62", "secondary-fixed": "#e3e2e3", "tertiary-fixed": "#ebe1d6",
                      "error": "#ba1a1a", "inverse-on-surface": "#f3f0f0", "surface": "#fbf9f8", "on-tertiary": "#ffffff",
                      "on-primary": "#ffffff", "surface-container-high": "#eae7e7", "tertiary": "#645d55", "primary": "#5d5e62",
                      "on-tertiary-container": "#766f66", "primary-fixed": "#e2e2e6", "tertiary-container": "#fef4e9",
                      "primary-container": "#f5f5f9", "surface-dim": "#dcd9d9", "surface-container-highest": "#e4e2e2",
                      "on-secondary-container": "#646465", "primary-fixed-dim": "#c6c6ca", "surface-tint": "#5d5e62",
                      "background": "#fbf9f8", "secondary": "#5e5e5f", "on-primary-fixed-variant": "#45474a",
                      "surface-bright": "#fbf9f8", "on-background": "#1b1c1c", "on-tertiary-fixed": "#1f1b15"
              },
              "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
              "spacing": { "section-margin": "2rem", "card-padding": "1.25rem", "safe-area-inset": "1rem", "stack-gap": "1rem" },
              "fontFamily": { "body-md": ["Plus Jakarta Sans"], "display-serif": ["Noto Serif"], "emotional-quote": ["Noto Serif"], "headline-lg": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
              "fontSize": {
                      "body-md": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                      "display-serif": ["26px", { "lineHeight": "34px", "fontWeight": "700" }],
                      "emotional-quote": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                      "headline-lg": ["23px", { "lineHeight": "30px", "fontWeight": "600" }],
                      "label-sm": ["15px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }]
              }
      } },
        }
      </script>
<style>body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    /* 애플 디자인 원칙: 눌림 피드백은 즉시, 정지는 스프링형(임계감쇠)으로 — WWDC "Designing Fluid Interfaces" */
    .active\:scale-95:active, .active\:scale-\[0\.98\]:active, .active\:scale-\[0\.95\]:active {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 120ms !important;
    }
    .active\:scale-95, .active\:scale-\[0\.98\], .active\:scale-\[0\.95\] {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 180ms !important;
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bg-on-surface text-surface font-label-sm text-label-sm px-4 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300" style="bottom:calc(120px + env(safe-area-inset-bottom)); z-index:100;"></div>

<main class="w-full max-w-[600px] flex flex-col px-safe-area-inset py-section-margin pb-32">

<header class="flex items-center gap-3 mb-6">
<button class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../3-1. 내 식탁/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 id="pageTitle" class="font-headline-lg text-headline-lg text-on-surface">오늘의 식탁, 확정할까요?</h1>
</header>

<div class="flex items-center gap-2 bg-surface-container rounded-lg px-4 py-3 mb-5">
<span class="material-symbols-outlined text-on-surface-variant">groups</span>
<p class="font-body-md text-body-md text-on-surface-variant flex-1">예상 준비 <b id="expectedCount" class="text-on-surface">2명</b> · 확인 안 됨 <b id="unconfirmedCount" class="text-on-surface">1명</b></p>
<button type="button" id="speakRosterBtn" class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant shrink-0 active:scale-95 transition-transform" aria-label="응답 현황 읽어주기">
<span class="material-symbols-outlined text-[18px]">volume_up</span>
</button>
</div>

<div id="groupsContainer" class="flex flex-col gap-4 mb-6"></div>

<div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] flex items-center justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant">최종 준비 인원</span>
<div class="flex items-center gap-3">
<button type="button" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center" onclick="stepCount(-1)">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span id="finalCount" class="font-headline-lg text-headline-lg text-on-surface w-6 text-center">2</span>
<button type="button" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center" onclick="stepCount(1)">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>

</main>

<div class="fixed bottom-0 left-0 right-0 bg-surface/90 backdrop-blur-md border-t border-outline-variant" style="padding-bottom: env(safe-area-inset-bottom);">
<div class="max-w-[600px] mx-auto px-safe-area-inset py-3">
<button class="w-full bg-primary text-on-primary font-label-sm text-[15px] py-4 rounded-full shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-[0.98] transition-transform mb-1.5" onclick="confirmMeal()">오늘의 식탁 확정하기</button>
<p id="confirmCaption" class="text-center font-label-sm text-label-sm text-on-surface-variant">확인 안 된 1명 있어요 · 그래도 확정할 수 있어요</p>
</div>
</div>

<script>
    var toastTimer;
    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 2600);
    }

    var mealId = null;
    var meal = { title: '오늘의 식탁, 확정할까요?', menu: '', attending: [], late: [], pending: [] };
    var count = 0;

    // TTS(수업21일차_알람에서 이식, 원래 3-1 카드 안에 있던 기능) — 02_my_table.png 참고 이미지에
    // 맞춰 3-1 카드에선 뺐고, 실제 로스터 상세가 있는 이 화면(응답 현황 보기의 목적지)으로 옮김.
    function speakRosterStatus() {
        if (!('speechSynthesis' in window)) { showToast('이 브라우저는 음성 읽기를 지원하지 않아요'); return; }
        var parts = [];
        meal.attending.forEach(function (p) { parts.push(p.name + '님 먹어요'); });
        meal.late.forEach(function (p) { parts.push(p.name + '님 늦게 와요'); });
        meal.pending.forEach(function (p) { parts.push(p.name + '님 확인 전'); });
        var text = (meal.menu || '메뉴 미정') + ' 응답 현황. ' + (parts.length ? parts.join(', ') + '.' : '아직 아무도 응답 안 했어요.');
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
    }
    document.getElementById('speakRosterBtn').onclick = speakRosterStatus;

    function buildGroupsFromRoster(rosterRows) {
        var attending = [], late = [], pending = [];
        rosterRows.forEach(function (r) {
            if (r.status === 'attending') {
                if (r.note && r.note.indexOf('좀 늦어요') !== -1) late.push({ memberId: r.memberId, name: r.name, color: r.color, note: r.note });
                else attending.push({ memberId: r.memberId, name: r.name, color: r.color, note: r.note });
            } else if (r.status === 'pending') {
                pending.push({ memberId: r.memberId, name: r.name, color: r.color, reason: '아직 확인 전' });
            }
            // absent(안 먹어요)는 준비 인원에서 이미 빠진 사람이라 이 화면엔 표시 안 함.
        });
        return { attending: attending, late: late, pending: pending };
    }

    function renderGroups() {
        var container = document.getElementById('groupsContainer');
        container.innerHTML = '';

        function personRow(p, extra) {
            var initial = (p.name || '?').trim().charAt(0);
            var color = p.color || '#8a9a7b';
            return '<span class="w-7 h-7 rounded-full flex items-center justify-center text-on-primary font-label-sm text-label-sm shrink-0" style="background-color:' + color + ';">' + initial + '</span>' +
                '<span class="font-body-md text-body-md text-on-surface flex-1">' + p.name + '</span>' +
                (extra || '');
        }

        if (meal.attending.length) {
            var g1 = document.createElement('div');
            g1.innerHTML = '<h2 class="font-label-sm text-label-sm text-on-surface-variant mb-2">함께 먹어요 (' + meal.attending.length + '명)</h2>';
            meal.attending.forEach(function (p) {
                var row = document.createElement('div');
                row.className = 'bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] flex items-center gap-2.5 mb-2';
                row.innerHTML = personRow(p, '<span class="font-label-sm text-label-sm text-on-surface-variant">' + (p.note || '') + '</span>');
                g1.appendChild(row);
            });
            container.appendChild(g1);
        }

        if (meal.late.length) {
            var g2 = document.createElement('div');
            g2.innerHTML = '<h2 class="font-label-sm text-label-sm text-on-surface-variant mb-2">늦게 와요 (' + meal.late.length + '명)</h2>';
            meal.late.forEach(function (p) {
                var card = document.createElement('div');
                card.className = 'bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] mb-2';
                card.innerHTML = '<div class="flex items-center gap-2.5">' + personRow(p) + '</div>';
                g2.appendChild(card);
            });
            container.appendChild(g2);
        }

        if (meal.pending.length) {
            var g3 = document.createElement('div');
            g3.innerHTML = '<h2 class="font-label-sm text-label-sm text-on-surface-variant mb-2">확인 안 됨 (' + meal.pending.length + '명)</h2>';
            meal.pending.forEach(function (p, idx) {
                var card = document.createElement('div');
                card.className = 'bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)]';
                card.innerHTML =
                    '<div class="flex items-center gap-2.5 mb-3">' + personRow(p, '<span class="font-label-sm text-label-sm text-on-surface-variant">' + (p.reason || '아직 확인 전') + '</span>') + '</div>' +
                    '<div class="pending-actions flex gap-2">' +
                    '<button type="button" class="flex-1 py-2 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm resend-btn">링크 다시 보내기</button>' +
                    '<button type="button" class="flex-1 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-sm text-label-sm proxy-toggle-btn">대리로 응답 입력</button>' +
                    '</div>' +
                    '<div class="proxy-form hidden mt-3 pt-3 border-t border-outline-variant">' +
                    '<p class="font-label-sm text-label-sm text-on-surface-variant mb-2">' + p.name + ' 님 대신 응답을 입력해요</p>' +
                    '<div class="flex gap-2 mb-2">' +
                    '<button type="button" class="flex-1 py-2 rounded-full bg-primary text-on-primary font-label-sm text-label-sm proxy-yes-btn">먹어요</button>' +
                    '<button type="button" class="flex-1 py-2 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm proxy-no-btn">안 먹어요</button>' +
                    '</div></div>' +
                    '<p class="proxy-result hidden font-label-sm text-label-sm text-on-surface-variant mt-2 pt-2 border-t border-outline-variant"></p>';

                // 실제 링크 재발급은 3-8(참여자 링크 공유)에서 처리 — 거기서 "새 링크 만들기"로 이어짐.
                card.querySelector('.resend-btn').onclick = function () { window.location.href = '../3-8. 참여자 링크 공유/code.html?meal=' + mealId; };
                card.querySelector('.proxy-toggle-btn').onclick = function () { card.querySelector('.proxy-form').classList.toggle('hidden'); };
                card.querySelector('.proxy-yes-btn').onclick = function () { submitProxy(card, p, 'attending'); };
                card.querySelector('.proxy-no-btn').onclick = function () { submitProxy(card, p, 'absent'); };
                g3.appendChild(card);
            });
            container.appendChild(g3);
        }
    }

    async function submitProxy(card, person, status) {
        await API.mealResponses.respondSelf(mealId, person.memberId, status);
        card.querySelector('.proxy-form').classList.add('hidden');
        card.querySelector('.pending-actions').classList.add('hidden');
        var result = card.querySelector('.proxy-result');
        result.textContent = '대리 응답 완료 · ' + (status === 'attending' ? '먹어요' : '안 먹어요') + ' (호스트가 대신 입력함)';
        result.classList.remove('hidden');
        if (status === 'attending') { stepCount(1); }
    }

    function stepCount(delta) {
        count = Math.max(0, count + delta);
        document.getElementById('finalCount').textContent = count;
    }

    async function confirmMeal() {
        await API.meals.update(mealId, { status: 'confirmed' });
        window.location.href = '../3-5. 오늘의 식탁 완성/code.html?meal=' + mealId;
    }

    (async function init() {
        await requireSession();
        var params = new URLSearchParams(window.location.search);
        mealId = params.get('meal');
        if (!mealId) { window.location.href = '../3-1. 내 식탁/code.html'; return; }

        var mealRow = await API.meals.get(mealId);
        var roster = await API.mealParticipants.getRoster(mealId);
        var groups = buildGroupsFromRoster(roster);

        meal.title = (mealRow.date === new Date().toISOString().slice(0, 10) ? '오늘' : '이') + '의 식탁, 확정할까요?';
        meal.menu = (mealRow.menu && mealRow.menu.length) ? mealRow.menu.join(' · ') : '메뉴 미정';
        meal.attending = groups.attending;
        meal.late = groups.late;
        meal.pending = groups.pending;
        count = meal.attending.length + meal.late.length;

        document.getElementById('pageTitle').textContent = meal.title;
        document.getElementById('expectedCount').textContent = count + '명';
        document.getElementById('unconfirmedCount').textContent = meal.pending.length + '명';
        document.getElementById('finalCount').textContent = count;
        document.getElementById('confirmCaption').textContent = meal.pending.length
            ? ('확인 안 된 ' + meal.pending.length + '명 있어요 · 그래도 확정할 수 있어요')
            : '모두 응답을 완료했어요';
        renderGroups();
    })();
</script>
</body></html>
