<style>body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }

      transition-duration: 120ms !important;
    }
    .active\:scale-95, .active\:scale-\[0\.98\], .active\:scale-\[0\.95\] {

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<main class="w-full max-w-[600px] flex flex-col px-safe-area-inset py-section-margin">

<header class="flex items-center gap-3 mb-6">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../3-0. 홈/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface">식비 예산</h1>
</header>

<div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] mb-4">
<div class="flex items-center justify-between mb-1">
<p class="font-label-sm text-label-sm text-on-surface-variant">이번 달 사용액</p>
<button class="font-label-sm text-label-sm text-primary" onclick="editBudget()">예산 수정</button>
</div>
<p id="spentAmount" class="font-display-serif text-display-serif text-on-surface mb-1">0원</p>
<p id="budgetLine" class="font-label-sm text-label-sm text-on-surface-variant mb-3">예산 0원 중</p>

<div class="w-full h-3 rounded-full overflow-hidden bg-surface-container mb-1">
<div id="budgetBar" class="h-full bg-primary" style="width:0%;"></div>
</div>
<p id="remainingLine" class="font-label-sm text-label-sm text-on-surface-variant"></p>
</div>

<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide mb-3 px-1">기록별 지출</h2>
<div id="costList" class="flex flex-col gap-2"></div>

</main>

<script>
    var RECORD_DATES = ['2024-08-16', '2024-08-13', '2024-08-09', '2024-08-03'];
    var RECORD_LABELS = { '2024-08-16': '8월 16일 (오늘)', '2024-08-13': '8월 13일 (화)', '2024-08-09': '8월 9일 (금)', '2024-08-03': '8월 3일 (토)' };

    function getBudget() {
        var v = null;
        try { v = parseInt(localStorage.getItem('monthly_budget') || '', 10); } catch (err) {}
        return isNaN(v) ? 600000 : v;
    }

    function editBudget() {
        var input = prompt('이번 달 식비 예산을 입력해주세요 (원)', getBudget());
        if (input === null) return;
        var value = parseInt(input.replace(/[^0-9]/g, ''), 10);
        if (isNaN(value)) return;
        try { localStorage.setItem('monthly_budget', String(value)); } catch (err) {}
        render();
    }

    function render() {
        var costs = {};
        try { costs = JSON.parse(localStorage.getItem('meal_costs') || '{}'); } catch (err) {}

        var spent = 0;
        var list = document.getElementById('costList');
        list.innerHTML = '';
        RECORD_DATES.forEach(function (dateKey) {
            var cost = costs[dateKey];
            spent += cost || 0;
            var row = document.createElement('div');
            row.className = 'bg-surface-container-lowest rounded-xl px-4 py-3 shadow-[0px_2px_8px_rgba(120,119,119,0.06)] flex items-center justify-between';
            row.innerHTML =
                '<span class="font-body-md text-body-md text-on-surface">' + RECORD_LABELS[dateKey] + '</span>' +
                '<span class="font-label-sm text-label-sm ' + (cost ? 'text-on-surface' : 'text-on-surface-variant') + '">' + (cost ? cost.toLocaleString() + '원' : '기록 없음') + '</span>';
            list.appendChild(row);
        });

        var budget = getBudget();
        var pct = budget > 0 ? Math.min(100, Math.round((spent / budget) * 100)) : 0;
        var remaining = budget - spent;

        document.getElementById('spentAmount').textContent = spent.toLocaleString() + '원';
        document.getElementById('budgetLine').textContent = '예산 ' + budget.toLocaleString() + '원 중';
        document.getElementById('budgetBar').style.width = pct + '%';
        document.getElementById('budgetBar').classList.toggle('bg-error', pct >= 100);
        document.getElementById('remainingLine').textContent = remaining >= 0
            ? '남은 예산 ' + remaining.toLocaleString() + '원 (' + pct + '%)'
            : '예산을 ' + Math.abs(remaining).toLocaleString() + '원 초과했어요';
    }

    render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js');
