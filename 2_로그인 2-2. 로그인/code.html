<span class="spinner-lg"></span>

<button class="absolute top-4 left-4 z-20 w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../2_로그인 2-1.로그인 화면/code.html'" aria-label="뒤로">

<div class="z-10">

<p class="font-emotional-quote text-emotional-quote text-on-surface-variant italic">"묻지 않아도 아는 집"</p>

<form id="login-form" class="flex flex-col gap-3" novalidate onsubmit="event.preventDefault();">
<h2 class="font-headline-lg text-headline-lg text-on-surface text-center mb-1">로그인</h2>

<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">이메일 <span class="text-error">*</span></label>
<input class="w-full bg-transparent border-0 border-b border-surface-container-high focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors" id="email" placeholder="example@email.com" type="email">
<p class="font-label-sm text-label-sm text-error" id="email-error"></p>
</div>

<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">비밀번호 <span class="text-error">*</span></label>
<div class="flex items-center gap-2 border-b border-surface-container-high focus-within:border-primary transition-colors">
<input class="flex-1 bg-transparent border-0 focus:ring-0 px-0 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="password" placeholder="비밀번호를 입력하세요" type="password">
<button type="button" class="toggle-password w-12 h-12 flex items-center justify-center text-on-surface-variant text-lg shrink-0" data-target="password">👁</button>
</div>
<p class="font-label-sm text-label-sm text-error" id="password-error"></p>
</div>

<button type="button" class="text-right font-label-sm text-label-sm text-primary" onclick="sendPasswordReset()">비밀번호를 잊으셨나요?</button>

<p class="text-center font-label-sm text-label-sm min-h-[18px]" id="form-message"></p>

<div class="hidden items-center justify-center gap-2 font-label-sm text-label-sm text-primary" id="loading">
<span class="spinner"></span> 로그인 중입니다...
</div>

<button class="w-full bg-primary text-on-primary font-label-sm text-[15px] py-4 rounded-full shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2 mt-1" id="login-btn" type="submit">
<span>로그인</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full py-2 font-label-sm text-label-sm text-on-surface-variant underline active:opacity-70" id="signup-btn" type="button">계정이 없으신가요? 회원가입</button>
</form>

<div class="flex items-center gap-3 my-3">
<div class="flex-1 h-px bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">또는</span>
<div class="flex-1 h-px bg-surface-container-high"></div>
</div>

<div class="flex gap-3">
<button type="button" id="kakao-btn" class="flex-1 min-w-0 py-4 rounded-full bg-[#FEE500] text-[#191919] font-label-sm text-[15px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">chat_bubble</span>
<span>카카오</span>
</button>
<button type="button" id="google-btn" class="flex-1 min-w-0 py-4 rounded-full bg-surface-container-lowest border border-outline-variant text-on-surface font-label-sm text-[15px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"></path><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"></path><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"></path><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"></path></svg>
<span>Google</span>
</button>

<p class="text-center font-label-sm text-label-sm text-error mt-1" id="kakao-message"></p>
<p class="text-center font-label-sm text-label-sm text-error mt-1" id="google-message"></p>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-4">처음 가입할 때 쓴 방법으로 계속 로그인해주세요.<br>연결된 이메일이 다르면 다른 계정으로 인식돼요.</p>

</main>

<script>
    var emailInput = document.getElementById('email');
    var passwordInput = document.getElementById('password');
    var emailError = document.getElementById('email-error');
    var passwordError = document.getElementById('password-error');
    var formMessage = document.getElementById('form-message');
    var loading = document.getElementById('loading');
    var loginBtn = document.getElementById('login-btn');
    var signupBtn = document.getElementById('signup-btn');
    var kakaoBtn = document.getElementById('kakao-btn');
    var kakaoMessage = document.getElementById('kakao-message');
    var googleBtn = document.getElementById('google-btn');
    var googleMessage = document.getElementById('google-message');

    // 지난번과 다른 방법으로 로그인하면 다른 계정으로 인식될 수 있어 미리 물어봄(§헷갈리기 전에 미리 확인).
    var LOGIN_METHOD_LABELS = { email: '이메일', kakao: '카카오', google: 'Google' };
    function confirmMethodSwitch(method) {
        var last = null;
        try { last = localStorage.getItem('last_login_method'); } catch (e) {}
        if (!last || last === method) return true;
        return confirm('지난번엔 ' + (LOGIN_METHOD_LABELS[last] || last) + '로 로그인하셨어요.\n지금 ' + (LOGIN_METHOD_LABELS[method] || method) + '로 로그인하면 다른 계정으로 인식될 수 있어요.\n계속할까요?');
    }
    function rememberLoginMethod(session) {
        try {
            var provider = session.user.app_metadata && session.user.app_metadata.provider;
            if (provider) localStorage.setItem('last_login_method', provider);
        } catch (e) {}
    }

    async function goAfterLogin() {
        var session = await getSession();
        if (session) rememberLoginMethod(session);
        var member = await getMyMember();
        if (member) { window.location.href = '../3_핵심조율 3-0. 홈/code.html'; return; }
        // 1-1(프로필 입력)을 아직 안 거쳤으면 1-2(가구 생성)로 바로 보내지 않음 — 2-1의 checkAutoLogin과 동일 기준.
        var profile = await API.auth.getMyProfile();
        window.location.href = (profile && profile.profile_setup_done)
            ? '../1_온보딩 1-2. 온보딩-시작하기/code.html'
            : '../1_온보딩 1-1. 온보딩-회원가입/code.html';
    }

    (async function checkAutoLogin() {
        var session = await getSession();
        if (session) {
            await goAfterLogin();
            return;
        }
        document.getElementById('auth-check-loading').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
    })();

    kakaoBtn.addEventListener('click', function () {
        if (!confirmMethodSwitch('kakao')) return;
        kakaoBtn.disabled = true;
        kakaoMessage.textContent = '';
        API.auth.signInKakao().catch(function (err) {
            kakaoBtn.disabled = false;
            kakaoMessage.textContent = '카카오 로그인에 실패했어요: ' + err.message;
        });
        // 성공 시 Supabase가 카카오 인증 페이지로 리다이렉트했다가 돌아오므로, 복귀 후 처리는
        // 2-1(로그인 화면)의 checkAutoLogin이 세션을 감지해 이어서 진행함.
    });

    googleBtn.addEventListener('click', function () {
        if (!confirmMethodSwitch('google')) return;
        googleBtn.disabled = true;
        googleMessage.textContent = '';
        API.auth.signInGoogle().catch(function (err) {
            googleBtn.disabled = false;
            googleMessage.textContent = 'Google 로그인에 실패했어요: ' + err.message;
        });
        // 카카오와 동일하게 리다이렉트 후 2-1의 checkAutoLogin이 이어서 처리.
    });

    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var targetId = btn.getAttribute('data-target');
            var targetInput = document.getElementById(targetId);
            if (targetInput.type === 'password') {
                targetInput.type = 'text';
                btn.textContent = '🙈';
            } else {
                targetInput.type = 'password';
                btn.textContent = '👁';
            }
        });
    });

    signupBtn.addEventListener('click', function () {
        window.location.href = '../1_온보딩 1-1. 온보딩-회원가입/code.html';
    });

    function clearAllErrors() {
        emailError.textContent = '';
        passwordError.textContent = '';
    }

    function validateForm() {
        clearAllErrors();
        var isValid = true;
        if (!emailInput.value.trim()) { emailError.textContent = '이메일을 입력해주세요.'; isValid = false; }
        if (!passwordInput.value) { passwordError.textContent = '비밀번호를 입력해주세요.'; isValid = false; }
        return isValid;
    }

    function setLoading(isLoading) {
        loading.classList.toggle('hidden', !isLoading);
        loading.classList.toggle('flex', isLoading);
        loginBtn.disabled = isLoading;
        signupBtn.disabled = isLoading;
    }

    async function sendPasswordReset() {
  var email = emailInput.value.trim();
  if (!email) { formMessage.textContent = '이메일을 먼저 입력해주세요'; formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-error'; return; }
  try {
    await API.auth.resetPasswordRequest(email);
    formMessage.textContent = email + '로 비밀번호 재설정 링크를 보냈어요. 메일함을 확인해주세요.';
    formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-primary';
  } catch (err) {
    formMessage.textContent = '실패했어요: ' + err.message;
    formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-error';
  }
}

document.getElementById('login-form').addEventListener('submit', function (event) {
        event.preventDefault();
        formMessage.textContent = '';
        formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px]';

        if (!validateForm()) return;
        if (!confirmMethodSwitch('email')) return;

        setLoading(true);

        API.auth.signInPassword(emailInput.value.trim(), passwordInput.value)
            .then(function () {
                formMessage.textContent = '로그인 성공! 이동 중입니다...';
                formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-primary';
                return goAfterLogin();
            })
            .catch(function (err) {
                setLoading(false);
                formMessage.textContent = '로그인에 실패했어요: 이메일 또는 비밀번호를 확인해주세요.';
                formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-error';
            });
    });
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js');
