<style>
    body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    .identity-line { border-left-width: 4px; border-left-style: solid; }

    /* 애플 디자인 원칙: 눌림 피드백은 즉시, 정지는 스프링형(임계감쇠)으로 — WWDC "Designing Fluid Interfaces" */
    .active\:scale-95:active, .active\:scale-\[0\.98\]:active, .active\:scale-\[0\.95\]:active {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 120ms !important;
    }
    .active\:scale-95, .active\:scale-\[0\.98\], .active\:scale-\[0\.95\] {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 180ms !important;
    }

    /* 날씨 배경(수업21일차_알람에서 이식) */
    /* 원래 body 전체 배경(position:fixed)이었는데 햄버거 메뉴 패널 안으로 옮기면서
       패널(position:fixed)의 안쪽을 absolute로 꽉 채우는 레이어로 변경. */
    .weather-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(160deg, #cfd9e0 0%, #eef2f5 100%); transition: background 0.8s ease; }
    .weather-bg.clear { background: linear-gradient(160deg, #a9ddff 0%, #ffe9b3 100%); }
    .weather-bg.clouds { background: linear-gradient(160deg, #cfd9e0 0%, #eef2f5 100%); }
    /* 원본(수업21일차_알람)은 비/눈/천둥/안개를 어두운 톤으로 표현했는데, 그 앱은 텍스트가 밝은색
       기준이라 괜찮았음 — 우리집식당은 텍스트가 카드 밖(헤더 제목 등)에도 어두운 색(on-surface)으로
       배경에 바로 얹혀서, 그대로 가져오면 어두운 배경 위 어두운 글씨로 안 보이는 문제가 생김.
       그래서 전부 밝은 톤으로 맞추고 색상만 날씨별로 다르게(가독성 우선, 분위기는 유지). */
    .weather-bg.rain { background: linear-gradient(160deg, #b9c7d1 0%, #8fa2ae 100%); }
    .weather-bg.drizzle { background: linear-gradient(160deg, #9db3c2 0%, #c7d5de 100%); }
    .weather-bg.thunderstorm { background: linear-gradient(160deg, #b7bcc7 0%, #8b90a0 100%); }
    .weather-bg.snow { background: linear-gradient(160deg, #eef2f6 0%, #cfd9e2 100%); }
    .weather-bg.mist { background: linear-gradient(160deg, #d3d8dd 0%, #b3bac1 100%); }
    .sun { position: absolute; top: 8%; right: 12%; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #fff3c4 0%, #ffd76a 70%); animation: pulse-sun 3s ease-in-out infinite; }
    .cloud { position: absolute; left: -180px; width: 140px; height: 50px; background: #fff; border-radius: 999px; filter: blur(1px); animation-name: drift-cloud; animation-timing-function: linear; animation-iteration-count: infinite; }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 60px; height: 60px; top: -25px; left: 15px; }
    .cloud::after { width: 80px; height: 70px; top: -35px; left: 60px; }
    .raindrop { position: absolute; top: -10vh; width: 2px; height: 16px; background: rgba(255,255,255,0.55); border-radius: 2px; animation-name: fall-rain; animation-timing-function: linear; animation-iteration-count: infinite; }
    .snowflake { position: absolute; top: -10vh; background: #fff; border-radius: 50%; opacity: 0.95; box-shadow: 0 0 4px 1px rgba(255,255,255,0.6); animation-name: fall-snow; animation-timing-function: linear; animation-iteration-count: infinite; }
    .fog-veil { position: absolute; inset: -20%; background: radial-gradient(ellipse 40% 30% at 20% 30%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 70%), radial-gradient(ellipse 50% 35% at 75% 20%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 70%), radial-gradient(ellipse 45% 30% at 40% 65%, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%), radial-gradient(ellipse 55% 35% at 85% 75%, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 70%), radial-gradient(ellipse 35% 25% at 10% 85%, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%); filter: blur(18px); animation: drift-fog-veil 8.5s ease-in-out infinite alternate; }
    .fog-band { position: absolute; bottom: -10%; width: 220px; height: 200px; background: radial-gradient(ellipse at center, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 72%); filter: blur(14px); animation-name: rise-fog; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .thunder-flash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: flash-thunder 6s infinite; }
    .lightning-bolt { position: absolute; top: 0; width: 60px; height: 55%; background: linear-gradient(180deg, #fff8d6 0%, rgba(255,248,214,0) 100%); clip-path: polygon(55% 0%, 30% 42%, 48% 42%, 20% 100%, 42% 50%, 26% 50%, 55% 0%); opacity: 0; animation: flash-bolt 6s infinite; }
    @keyframes flash-bolt { 0%, 93%, 100% { opacity: 0; } 94% { opacity: 1; } 95% { opacity: 0.2; } 96% { opacity: 0.9; } 98% { opacity: 0; } }
    @keyframes fall-rain { to { transform: translateY(120vh); } }
    @keyframes fall-snow { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(20px,60vh) rotate(180deg); } 100% { transform: translate(-15px,120vh) rotate(360deg); } }
    @keyframes drift-cloud { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 200px)); } }
    @keyframes pulse-sun { 0%, 100% { box-shadow: 0 0 50px 15px rgba(255,214,110,0.55); } 50% { box-shadow: 0 0 80px 30px rgba(255,214,110,0.85); } }
    @keyframes drift-fog-veil { 0% { transform: translate(0%,4%) scale(1); } 50% { transform: translate(-3%,-2%) scale(1.05); } 100% { transform: translate(2%,-6%) scale(1.08); } }
    @keyframes rise-fog { 0% { transform: translate(0,0) scale(0.8); opacity: 0; } 15% { opacity: 0.8; } 50% { transform: translate(4%,-60%) scale(1.05); } 85% { opacity: 0.35; } 100% { transform: translate(-4%,-130%) scale(1.25); opacity: 0; } }
    @keyframes flash-thunder { 0%, 93%, 100% { opacity: 0; } 94% { opacity: 0.85; } 95% { opacity: 0.05; } 97% { opacity: 0.6; } 98% { opacity: 0; } }
  </style>

     "로그아웃"은 화면이 아니라 실제 동작이라 5-3과 동일한 로직으로 여기서도 바로 실행. -->

<script>
    // 날씨 배경(수업21일차_알람에서 이식) — 사용자 위치 권한이 있으면 실제 위치, 없으면
    // 서울 좌표로 대체(API.weather, shared/api.js). API 키는 원본 프로젝트와 동일(OpenWeatherMap 무료 티어, 낮은 위험도).
    var weatherBg = document.getElementById('weatherBg');

    function clearWeatherBg() { weatherBg.className = 'weather-bg'; weatherBg.innerHTML = ''; }

    function renderRain(count, dropHeight) {
        for (var i = 0; i < count; i++) {
            var drop = document.createElement('div');
            drop.className = 'raindrop';
            var duration = 0.5 + Math.random() * 0.5;
            drop.style.left = Math.random() * 100 + '%';
            drop.style.height = (dropHeight || 16) + 'px';
            drop.style.animationDuration = duration + 's';
            drop.style.animationDelay = -Math.random() * duration + 's';
            weatherBg.appendChild(drop);
        }
    }
    function renderSnow(count) {
        for (var i = 0; i < count; i++) {
            var flake = document.createElement('div');
            flake.className = 'snowflake';
            var duration = 4 + Math.random() * 4;
            var size = 4 + Math.random() * 4;
            flake.style.left = Math.random() * 100 + '%';
            flake.style.width = size + 'px';
            flake.style.height = size + 'px';
            flake.style.animationDuration = duration + 's';
            flake.style.animationDelay = -Math.random() * duration + 's';
            weatherBg.appendChild(flake);
        }
    }
    function renderClouds(count) {
        for (var i = 0; i < count; i++) {
            var cloud = document.createElement('div');
            cloud.className = 'cloud';
            var duration = 40 + Math.random() * 30;
            var scale = 0.7 + Math.random() * 0.8;
            cloud.style.top = 5 + Math.random() * 30 + '%';
            cloud.style.transform = 'scale(' + scale + ')';
            cloud.style.animationDuration = duration + 's';
            cloud.style.animationDelay = -Math.random() * duration + 's';
            weatherBg.appendChild(cloud);
        }
    }
    function renderSun() { var sun = document.createElement('div'); sun.className = 'sun'; weatherBg.appendChild(sun); }
    function renderFog(count) {
        var veil = document.createElement('div'); veil.className = 'fog-veil'; weatherBg.appendChild(veil);
        for (var i = 0; i < count; i++) {
            var band = document.createElement('div');
            band.className = 'fog-band';
            var duration = (10 + Math.random() * 8) / 3;
            var size = 160 + Math.random() * 140;
            band.style.left = Math.random() * 90 + '%';
            band.style.width = size + 'px';
            band.style.height = size * (0.7 + Math.random() * 0.3) + 'px';
            band.style.animationDuration = duration + 's';
            band.style.animationDelay = -Math.random() * duration + 's';
            weatherBg.appendChild(band);
        }
    }
    function renderThunderFlash(delay) { var flash = document.createElement('div'); flash.className = 'thunder-flash'; flash.style.animationDelay = delay + 's'; weatherBg.appendChild(flash); }
    function renderLightning(count, delay) {
        for (var i = 0; i < count; i++) {
            var bolt = document.createElement('div');
            bolt.className = 'lightning-bolt';
            bolt.style.left = 15 + Math.random() * 60 + '%';
            bolt.style.animationDelay = delay + 's';
            weatherBg.appendChild(bolt);
        }
    }
    function setWeatherBackground(condition) {
        clearWeatherBg();
        switch (condition) {
            case 'Clear': weatherBg.classList.add('clear'); renderSun(); break;
            case 'Clouds': weatherBg.classList.add('clouds'); renderClouds(4); break;
            case 'Rain': weatherBg.classList.add('rain'); renderClouds(2); renderRain(60); break;
            case 'Drizzle': weatherBg.classList.add('drizzle'); renderClouds(2); renderRain(30, 10); break;
            case 'Thunderstorm':
                weatherBg.classList.add('thunderstorm'); renderRain(60);
                var delay = -Math.random() * 6; renderThunderFlash(delay); renderLightning(1, delay);
                break;
            case 'Snow': weatherBg.classList.add('snow'); renderSnow(50); break;
            case 'Mist': case 'Fog': case 'Haze': case 'Smoke': case 'Dust': case 'Sand': case 'Ash':
                weatherBg.classList.add('mist'); renderFog(8); break;
            default: weatherBg.classList.add('clouds'); renderClouds(2);
        }
    }
    var lastWeather = null;
    var WEATHER_LABEL = {
        Clear: ['맑음', 'clear_day'], Clouds: ['흐림', 'cloud'], Rain: ['비', 'rainy'],
        Drizzle: ['약한 비', 'rainy_light'], Thunderstorm: ['뇌우', 'thunderstorm'],
        Snow: ['눈', 'weather_snowy'], Mist: ['옅은 안개', 'foggy'], Fog: ['안개', 'foggy'], Haze: ['옅은 안개', 'foggy']
    };

    async function loadWeather() {
        var weather = await API.weather.getCurrent();
        lastWeather = weather;
        if (weather && weather.condition) setWeatherBackground(weather.condition);
        // 실패해도 .weather-bg의 기본 그라데이션이 이미 있어 화면은 자연스러움
        renderWeatherInfoBox();
    }
    loadWeather();

    // 전체 메뉴 패널 상단의 지역·시간·날씨 박스 — 날씨는 loadWeather()가 채워둔 캐시를 쓰고,
    // 시간은 패널을 열 때마다 그 순간으로 다시 계산.
    function renderWeatherInfoBox() {
        var now = new Date();
        document.getElementById('weatherInfoTime').textContent =
            now.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });

        if (lastWeather && lastWeather.condition) {
            var meta = WEATHER_LABEL[lastWeather.condition] || [lastWeather.condition, 'thermostat'];
            document.getElementById('weatherInfoLocation').textContent = lastWeather.cityName || '현재 위치';
            var tempText = typeof lastWeather.temp === 'number' ? Math.round(lastWeather.temp) + '°C · ' : '';
            document.getElementById('weatherInfoDetail').textContent = tempText + meta[0];
            document.getElementById('weatherInfoIcon').textContent = meta[1];
        } else {
            document.getElementById('weatherInfoLocation').textContent = '날씨 정보를 가져올 수 없어요';
            document.getElementById('weatherInfoDetail').textContent = '';
        }
    }

    var toastTimer;
    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 2600);
    }

    var NOTI_PREVIEW_COUNT = 5; // 알림도 쌓이면 무한정 길어지지 않게 — 더보기로 펼침
    var notiExpanded = false;
    var notisCache = [];

    async function loadNotis() {
        notisCache = await API.notifications.listForMember(myMember.id);
    }

    function updateNotiDot() {
        var hasUnread = notisCache.some(function (n) { return !n.read; });
        var dot = document.getElementById('notiDot');
        if (dot) dot.classList.toggle('hidden', !hasUnread);
    }

    // 06_notifications.png 기준: "모두 읽음" 일괄 처리.
    async function markAllNotisRead() {
        await API.notifications.markAllRead(myMember.id);
        notisCache.forEach(function (n) { n.read = true; });
        renderNotiPanel();
        updateNotiDot();
    }

    function renderNotiPanel() {
        var visibleNotis = notiExpanded ? notisCache : notisCache.slice(0, NOTI_PREVIEW_COUNT);
        var list = document.getElementById('notiList');
        list.innerHTML = '';

        if (!notisCache.length) {
            var empty = document.createElement('p');
            empty.className = 'font-label-sm text-label-sm text-on-surface-variant text-center py-6';
            empty.textContent = '아직 알림이 없어요';
            list.appendChild(empty);
            return;
        }

        visibleNotis.forEach(function (n) {
            var row = document.createElement('button');
            row.className = 'text-left w-full bg-surface-container-lowest rounded-xl p-4 shadow-[0px_2px_8px_rgba(120,119,119,0.06)] flex items-start gap-3';
            row.onclick = function () { showNotiDetail(n); };
            row.innerHTML =
                '<span class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 bg-tertiary-container text-on-tertiary-container"><span class="material-symbols-outlined text-[20px]">notifications</span></span>' +
                '<div class="flex-1 min-w-0">' +
                '<div class="flex items-center gap-2">' +
                '<p class="font-body-md text-body-md text-on-surface font-medium">' + n.text + '</p>' +
                (!n.read ? '<span class="w-2 h-2 rounded-full bg-primary shrink-0"></span>' : '') +
                '</div>' +
                (n.detail ? '<p class="font-label-sm text-label-sm text-on-surface-variant">' + n.detail + '</p>' : '') +
                '<p class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">' + new Date(n.created_at).toLocaleString('ko-KR') + '</p>' +
                '</div>';
            list.appendChild(row);
        });

        if (!notiExpanded && notisCache.length > NOTI_PREVIEW_COUNT) {
            var moreBtn = document.createElement('button');
            moreBtn.type = 'button';
            moreBtn.className = 'w-full text-center font-label-sm text-label-sm text-primary py-2';
            moreBtn.textContent = '+ ' + (notisCache.length - NOTI_PREVIEW_COUNT) + '개 더보기';
            moreBtn.onclick = function () { notiExpanded = true; renderNotiPanel(); };
            list.appendChild(moreBtn);
        }
    }

    async function showNotiDetail(n) {
        if (!n.read) { await API.notifications.markRead(n.id); n.read = true; updateNotiDot(); }
        var list = document.getElementById('notiList');
        var back = '<button id="notiBackBtn" class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant mb-1"><span class="material-symbols-outlined text-[18px]">arrow_back</span>목록으로</button>';
        var body = '<div class="bg-surface-container-lowest rounded-xl p-4 shadow-[0px_2px_8px_rgba(120,119,119,0.06)]">' +
            '<p class="font-body-md text-body-md text-on-surface mb-1">' + n.text + '</p>' +
            (n.detail ? '<p class="font-label-sm text-label-sm text-on-surface-variant">' + n.detail + '</p>' : '') +
            '</div>';
        var actions = '<div class="flex gap-2 mt-3">' +
            '<button id="notiAckBtn" class="flex-1 py-2.5 rounded-full bg-surface-container text-on-surface font-label-sm text-label-sm">확인했어요</button>' +
            (n.meal_id ? '<a href="../3-1. 내 식탁/code.html" class="flex-1 py-2.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm text-center">내 식탁에서 보기</a>' : '') +

        list.innerHTML = back + body + actions;
        document.getElementById('notiBackBtn').onclick = renderNotiPanel;
        var ackBtn = document.getElementById('notiAckBtn');
        if (ackBtn) ackBtn.onclick = renderNotiPanel;
    }

        renderNotiPanel();
        document.getElementById('notiBackdrop').classList.remove('hidden');
        document.getElementById('notiPanel').classList.remove('hidden');

    function closeMenuPanel() {
        document.getElementById('menuPanel').style.transform = 'translateX(100%)';
        document.getElementById('menuBackdrop').classList.add('hidden');
        setTimeout(function () { document.getElementById('menuPanel').classList.add('hidden'); }, 250);
    }

    // 05_hamburger_menu.png의 "로그아웃"은 화면이 아니라 실제 동작 — 5-3. 설정과 동일한 로직.
    async function logoutFromMenu() {
        if (!confirm('로그아웃 할까요?')) return;
        await API.auth.signOut();
        window.location.href = '../2-1.로그인 화면/code.html';
    }

    var householdId = null;
    var myMember = null;
    var membersCache = []; // household_members_vc2608 rows (가족+즉석손님) — 색상·이름 조회용
    var pendingMembersForRemind = []; // "미응답자에게 다시 보내기" 버튼이 쓸 대상(응답 안 한 사람 + 어느 식사인지)

    function memberById(id) { return membersCache.find(function (m) { return m.id === id; }); }

    // 3-2/4-1과 같은 형식(YYYY-MM-DD)으로 맞춰서 달력이 날짜만 보고 그날의 한마디를 찾을 수 있게.
    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    // 방명록(싸이월드에서 착안): 지우지 않고 계속 쌓아서 달력에서 그날 것을 다시 볼 수 있게(가족 기록장).
    var guestbookCache = [];
    async function loadGuestbook() { guestbookCache = await API.guestbook.list(householdId); }
    function todaysNoteFor(memberId) {
        var todays = guestbookCache.filter(function (n) { return n.member_id === memberId && n.day === todayKey(); });
        return todays.length ? todays[todays.length - 1] : null;
    }
    async function addGuestbookNote() {
        var message = prompt('한마디 남길까요? (예: 오늘 좀 늦어요, 잘 먹었어요)');
        if (!message || !message.trim()) return;
        await API.guestbook.add(householdId, myMember.id, message.trim(), todayKey());
        await loadGuestbook();
        await renderTableHero();
        renderMyNoteRow();
        showToast('한마디 남겼어요 · 달력에서 다시 볼 수 있어요');
    }

    async function removeGuestbookNote(id) {
        // 잘못 눌렀을 수도, 수정하려던 걸 수도 있으니 지우기 전에 한 번 확인.
        if (!confirm('이 한마디를 지울까요?\n되돌릴 수 없어요.')) return;
        await API.guestbook.remove(id);
        await loadGuestbook();
        await renderTableHero();
        renderMyNoteRow();
        showToast('한마디를 지웠어요');
    }

    // 내가 오늘 남긴 한마디가 있으면 지우기 링크와 함께 보여주고, 없으면 남기기 버튼만.
    function renderMyNoteRow() {
        var row = document.getElementById('myNoteRow');
        var mine = todaysNoteFor(myMember.id);
        if (!mine) {
            row.innerHTML = '<button type="button" class="font-label-sm text-label-sm text-primary" onclick="addGuestbookNote()">+ 한마디 남기기</button>';
            return;
        }
        // 좌석 위 말풍선·달력의 그날 한마디와 같은 포스트잇 톤으로 통일 — 줄글로 뭉쳐 보이던 것을 카드로.
        row.innerHTML =
            '<div class="inline-block text-left px-3 py-2 rounded-sm" style="background:#fff6d6;border:1px solid #ecdc9c;box-shadow:2px 2px 4px rgba(120,119,119,0.15);">' +
            '<div class="flex items-center justify-between gap-3 mb-0.5">' +
            '<span class="font-label-sm text-label-sm font-semibold" style="color:#5c4a1a;">내 한마디</span>' +
            '<button type="button" id="removeMyNoteBtn" class="font-label-sm text-label-sm" style="color:#8a7530;">×</button>' +
            '</div>' +
            '<p class="font-label-sm text-label-sm" style="color:#6b5a2a;">' + mine.message + '</p>' +
            '</div>';
        document.getElementById('removeMyNoteBtn').onclick = function () { removeGuestbookNote(mine.id); };
    }

    // 대표 카드 하나만 보여서 오늘의 다른 식사가 묻히지 않게 — 있으면 안내.
    function renderMoreMealsLine(extraCount) {
        var line = document.getElementById('moreMealsLine');
        if (!extraCount) { line.classList.add('hidden'); return; }
        line.classList.remove('hidden');
        line.textContent = '오늘 식사가 ' + extraCount + '개 더 있어요 →';
    }

    var REQUEST_PREVIEW_COUNT = 3; // 홈은 훑어보는 자리라 몇 개까지만 — 늘어나면 "+N개 더보기"로 펼침(전체 이동 없이)
    var requestsExpanded = false;
    var requestsCache = [];

    async function loadMenuRequests() { requestsCache = await API.menuRequests.list(householdId); }

    function renderMenuRequests() {
        var list = document.getElementById('requestList');
        list.innerHTML = '';
        if (!requestsCache.length) {
            var empty = document.createElement('p');
            empty.className = 'font-label-sm text-label-sm text-on-surface-variant px-1';
            empty.textContent = '아직 요청이 없어요';
            list.appendChild(empty);
            return;
        }
        var visible = requestsExpanded ? requestsCache : requestsCache.slice(0, REQUEST_PREVIEW_COUNT);
        visible.forEach(function (r) {
            var isMe = r.member_id === myMember.id;
            var name = r.household_members_vc2608 ? r.household_members_vc2608.name : '?';
            var color = (memberById(r.member_id) || {}).color || '#8a9a7b';
            var row = document.createElement('div');
            row.className = 'flex items-center gap-3 bg-surface-container-lowest rounded-xl px-4 py-3 shadow-[0px_2px_8px_rgba(120,119,119,0.06)]';
            row.innerHTML =
                '<span class="w-8 h-8 rounded-full flex items-center justify-center text-on-primary font-label-sm text-label-sm shrink-0" style="background-color:' + color + ';">' + name.charAt(0) + '</span>' +
                '<span class="font-body-md text-body-md text-on-surface flex-1">' + name + (isMe ? ' (나)' : '') + ' · ' + r.menu + '</span>' +
                '<button type="button" class="use-request-btn font-label-sm text-label-sm text-primary shrink-0">이걸로 만들기 →</button>';
            row.querySelector('.use-request-btn').onclick = function () {
                try { localStorage.setItem('recipe_pick', JSON.stringify({ name: r.menu })); } catch (err) {}
                window.location.href = '../3-2. 식사 만들기/code.html';
            };
            list.appendChild(row);
        });

        if (!requestsExpanded && requestsCache.length > REQUEST_PREVIEW_COUNT) {
            var moreBtn = document.createElement('button');
            moreBtn.type = 'button';
            moreBtn.className = 'w-full text-center font-label-sm text-label-sm text-primary py-1.5';
            moreBtn.textContent = '+ ' + (requestsCache.length - REQUEST_PREVIEW_COUNT) + '개 더보기';
            moreBtn.onclick = function () { requestsExpanded = true; renderMenuRequests(); };
            list.appendChild(moreBtn);
        } else if (requestsExpanded && requestsCache.length > REQUEST_PREVIEW_COUNT) {
            var lessBtn = document.createElement('button');
            lessBtn.type = 'button';
            lessBtn.className = 'w-full text-center font-label-sm text-label-sm text-on-surface-variant py-1.5';
            lessBtn.textContent = '접기';
            lessBtn.onclick = function () { requestsExpanded = false; renderMenuRequests(); };
            list.appendChild(lessBtn);
        }
    }

    async function addMenuRequest() {
        var menu = prompt('오늘 뭐 먹고 싶어요?');
        if (!menu || !menu.trim()) return;
        await API.menuRequests.add(householdId, myMember.id, menu.trim());
        await loadMenuRequests();
        renderMenuRequests();
        showToast('먹고 싶은 메뉴를 알렸어요');
    }

    // 정하는 사람이 고민될 때 3-2에서 보낸 메뉴 투표 — 가족 누구나 골라줄 수 있게.
    var pollCache = null;
    async function loadPoll() { pollCache = await API.menuPoll.get(householdId); }

    async function voteMenuPoll(name) {
        if (!pollCache) return;
        await API.menuPoll.vote(pollCache.id, myMember.id, name);
        await loadPoll();
        renderPollSection();
        showToast('골랐어요 · ' + name);
    }

    function renderPollSection() {
        var section = document.getElementById('pollSection');
        if (!pollCache) { section.classList.add('hidden'); return; }
        section.classList.remove('hidden');

        var votes = pollCache.votes || {};
        var myVote = votes[myMember.id];
        var voteValues = Object.keys(votes).map(function (voter) { return votes[voter]; });
        var list = document.getElementById('pollOptionsList');
        list.innerHTML = '';
        pollCache.options.forEach(function (name) {
            var count = voteValues.filter(function (v) { return v === name; }).length;
            var isMine = myVote === name;
            var row = document.createElement('button');
            row.type = 'button';
            row.className = 'w-full flex items-center gap-3 rounded-lg px-3 py-2.5 text-left ' + (isMine ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface');
            row.innerHTML = '<span class="flex-1 font-body-md text-body-md">' + name + '</span>' +
                '<span class="font-label-sm text-label-sm ' + (isMine ? 'text-on-primary' : 'text-on-surface-variant') + '">' + count + '표' + (isMine ? ' · 내 선택' : '') + '</span>';
            row.onclick = function () { voteMenuPoll(name); };
            list.appendChild(row);
        });
    }

    // 오늘의 식탁 카드의 인원 현황 줄 = 이 앱을 왜 쓰는지 한 줄 요약(오늘 몇 명 먹는지 · 몇 명 아직 확인 안 됐는지).
    // "오늘 저녁 ·" 같은 때 정보는 별도로 tableHeroWhen에서 보여주므로 여기선 인원 현황만.
    // 참고 이미지처럼 확정 인원은 강조색, 대기 인원은 주의색으로 눈에 띄게.
    function computeSubtitle(rows) {
        if (!rows.length) { return '아직 오늘 식사가 없어요<br>매번 묻지 않아도, 여기서 한눈에 확인해요'; }
        var attending = 0, pending = 0;
        rows.forEach(function (r) {
            if (r.status === 'attending') attending++;
            else if (r.status === 'pending') pending++;
        });
        // 확인 전 인원은 "아직 확정 안 된, 덜 중요한 정보"라 확정 인원보다 작은 글씨로(사용자 요청).
        var attendingPart = '<span class="text-primary font-bold">' + attending + '명</span> 먹어요';
        if (pending === 0) return attendingPart + ' · 다 확인됐어요';
        return attendingPart + ' · <span class="text-error font-semibold" style="font-size:0.8em;">' + pending + '명 확인 전</span>';
    }

    // "오늘 저녁 · 19:00" 같은 시간대+시각 표시. 시간 미정이면 아예 숨김(참고 이미지엔 없는 상태라 억지로 안 만듦).
    function mealTimeOfDayLabel(hhmm) {
        var h = parseInt(hhmm.slice(0, 2), 10);
        if (h < 11) return '아침';
        if (h < 17) return '점심';
        return '저녁';
    }

    // 01_home_corrected.png/09_empty_home.png 공통: "좋은 OO이에요, 이름 님" 인사말 — 현재 시각 기준.
    function greetingText(name) {
        var h = new Date().getHours();
        var period = h < 5 ? '새벽' : h < 11 ? '아침' : h < 17 ? '점심' : h < 20 ? '저녁' : '밤';
        return '좋은 ' + period + '이에요, ' + (name || '') + ' 님';
    }

    // 원형 식탁 둘레에 가족 아바타를 좌석처럼 배치 — 참여(체크 배지)/대기(점선 테두리)/불참(흐리게)을 한 그림으로.
    // rows 배열(오늘 여러 식사를 member_id 기준으로 합친 최신 상태)을 반환해서 부제 계산에도 재사용.
    async function renderTableHero() {
        var meals = await API.meals.listByHousehold(householdId);
        var today = todayKey();
        var todayMeals = meals.filter(function (m) { return m.date === today; });

        var menuEl = document.getElementById('tableHeroMenu');
        var photoEl = document.getElementById('tableHeroPhoto');
        var rosterEl = document.getElementById('tableHeroRoster');
        rosterEl.innerHTML = '';

        var whenEl = document.getElementById('tableHeroWhen');
        if (!todayMeals.length) {
            document.getElementById('tableHeroPopulated').classList.add('hidden');
            document.getElementById('tableHeroEmpty').classList.remove('hidden');
            pendingMembersForRemind = [];
            document.getElementById('remindPendingBtn').classList.add('hidden');
            document.getElementById('moreMealsLine').classList.add('hidden');
            return [];
        }
        document.getElementById('tableHeroEmpty').classList.add('hidden');
        document.getElementById('tableHeroPopulated').classList.remove('hidden');
        renderMoreMealsLine(todayMeals.length - 1);

        // 시간이 지난 식사 대신 다음(아직 안 지난) 식사를 보여줌 — "시간이 지났으면 홈에서는
        // 그다음 음식으로 넘어가야함" 사용자 요청. 시간 미정은 하루 종일 유효하다고 취급.
        // 오늘 남은 게 하나도 없으면(전부 지남) 마지막 식사를 그대로 보여줌(빈 카드보다 나음).
        var now = new Date();
        var upcomingToday = todayMeals.filter(function (m) {
            if (!m.time) return true;
            return new Date(m.date + 'T' + m.time) >= now;
        });
        var activeMeal = upcomingToday.length ? upcomingToday[0] : todayMeals[todayMeals.length - 1];

        // 대표 메뉴는 3-2에서 정한 순서 그대로 최대 2개까지 이름을 보여줌("외 N개"로 뭉개지 않음).
        var firstMenu = activeMeal.menu || [];
        var repName = firstMenu[0];
        menuEl.textContent = firstMenu.length ? firstMenu.slice(0, 2).join(', ') : '메뉴 미정';

        whenEl.textContent = activeMeal.time
            ? ('오늘 ' + mealTimeOfDayLabel(activeMeal.time) + ' · ' + activeMeal.time.slice(0, 5))
            : '오늘 · 시간 미정';
        whenEl.classList.remove('hidden');

        // 식탁 사진 우선순위(8-2/3-1과 동일): 실제 식사 사진 → 메뉴 이름으로 등록된 대표 사진 → 이모지 플레이스홀더.
        var mealPhoto = await API.mealPhotos.getByMeal(activeMeal.id);
        if (mealPhoto) {
            photoEl.innerHTML = '<img src="' + mealPhoto.photo_url + '" class="w-full h-full object-cover scale-150">';
        } else if (repName) {
            var cachedUrl = await API.menuImages.get(repName);
            photoEl.innerHTML = cachedUrl ? '<img src="' + cachedUrl + '" class="w-full h-full object-cover scale-150">' : foodPlaceholderHtml(repName, 'w-full h-full');
        } else {
            photoEl.innerHTML = foodPlaceholderHtml(null, 'w-full h-full');
        }

        // '오늘' 식사가 여러 개면(점심+저녁 등) 같은 사람이 두 번 앉지 않게 member_id 기준으로 합침(마지막 상태 우선).
        // mealId도 같이 들고 있어야 "미응답자에게 다시 보내기"가 어느 식사에 대한 알림인지 알 수 있음.
        var rowByMember = {};
        for (var i = 0; i < todayMeals.length; i++) {
            var roster = await API.mealParticipants.getRoster(todayMeals[i].id);
            roster.forEach(function (r) { r.mealId = todayMeals[i].id; rowByMember[r.memberId] = r; });
        }
        var rows = Object.keys(rowByMember).map(function (id) { return rowByMember[id]; });

        // 참고 이미지 구조(재수정, 2026-08-19): 사진 주변 이름표가 아니라 왼쪽 텍스트 칸 맨 아래에
        // 이름이 그대로 적힌 뱃지 한 줄로 — 짧은 이름(1자)은 동그랗게, 긴 이름은 알약 모양으로
        // 자연스럽게(rounded-full + 내용에 맞는 너비). 확인된 사람은 색이 채워짐, 대기는 점선.
        rows.forEach(function (r) {
            var status = r.status;
            var tag = document.createElement('div');
            tag.className = 'flex flex-col items-center';
            if (status === 'attending') {
                tag.innerHTML =
                    '<span class="min-w-[1.75rem] h-7 px-1.5 rounded-full flex items-center justify-center text-on-primary font-semibold whitespace-nowrap" style="background-color:' + (r.color || '#8a9a7b') + ';font-size:11px;">' + r.name + '</span>' +
                    '<span class="text-on-surface-variant mt-0.5" style="font-size:9px;">확인 완료</span>';
            } else {
                tag.innerHTML =
                    '<span class="min-w-[1.75rem] h-7 px-1.5 rounded-full border-2 border-dashed border-outline flex items-center justify-center text-on-surface-variant font-semibold whitespace-nowrap" style="font-size:11px;">' + r.name + '</span>' +
                    '<span class="text-on-surface-variant mt-0.5" style="font-size:9px;">' + (status === 'absent' ? '안 먹어요' : '응답 대기') + '</span>';
            }
            rosterEl.appendChild(tag);
        });

        pendingMembersForRemind = rows.filter(function (r) { return r.status === 'pending'; });
        document.getElementById('remindPendingBtn').classList.toggle('hidden', pendingMembersForRemind.length === 0);

        return rows;
    }

    // "미응답자에게 다시 보내기" — 실제로 응답 안 한 사람에게 알림을 새로 하나씩 남김(눌러도 아무 일도
    // 안 일어나는 가짜 버튼 금지 — API.notifications.create는 실제 DB insert).
    async function remindPending() {
        if (!pendingMembersForRemind.length) return;
        for (var i = 0; i < pendingMembersForRemind.length; i++) {
            var r = pendingMembersForRemind[i];
            await API.notifications.create(householdId, r.memberId, r.mealId, '오늘 식사 응답을 아직 안 하셨어요', '확인하고 답해주세요');
        }
        showToast(pendingMembersForRemind.length + '명에게 다시 알렸어요');
    }

    var realtimeChannel = null;

    async function refreshAll() {
        var rows = await renderTableHero();
        document.getElementById('householdSubtitle').innerHTML = computeSubtitle(rows);
        renderMyNoteRow();
        await loadNotis();
        updateNotiDot();
        await loadMenuRequests();
        renderMenuRequests();
        await loadPoll();
        renderPollSection();
    }

    (async function init() {
        await requireSession();
        myMember = await getMyMember();
        if (!myMember) { window.location.href = '../1-2. 온보딩-시작하기/code.html'; return; }
        householdId = myMember.household_id;

        membersCache = await API.members.list(householdId);
        await loadGuestbook();

        var household = myMember.households_vc2608 || (await API.households.get(householdId));
        document.getElementById('householdTitle').textContent = greetingText(myMember.name);
        document.getElementById('householdSelectorLabel').textContent = household.name || '우리집';

        await refreshAll();

        realtimeChannel = API.realtime.subscribeToHousehold(
            householdId,
            ['meals_vc2608', 'meal_responses_vc2608', 'notifications_vc2608', 'guestbook_notes_vc2608', 'menu_poll_vc2608'],
            function () { loadGuestbook().then(refreshAll); }
        );
        window.addEventListener('beforeunload', function () { API.realtime.unsubscribe(realtimeChannel); });
    })();
</script>
</body></html>
