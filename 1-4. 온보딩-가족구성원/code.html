<!-- 이미지 조정(크롭) 모달 -->
<div id="crop-modal" class="crop-modal" hidden="">
<div class="crop-modal-content">
<h3 class="font-headline-lg text-headline-lg text-on-surface mb-1">사진 조정</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-4">이미지를 드래그해서 위치를 옮기고, 슬라이더로 확대/축소하세요.</p>

<button type="button" class="w-full py-2 mb-3 font-label-sm text-label-sm text-on-surface-variant underline" id="crop-choose-new-btn">다른 사진 선택</button>
<div class="flex gap-3">
<button type="button" class="flex-1 py-3 rounded-full bg-surface-container-high text-on-surface font-label-sm text-label-sm" id="crop-cancel-btn">취소</button>

<script>
    var AVATAR_COLORS = ['#8a9a7b', '#9b8ab5', '#c98a5a', '#5f8fa3', '#b57a7a', '#a3945f'];
    var members = [];
    var colorIndex = 0;

    function nextColor() {
        var color = AVATAR_COLORS[colorIndex % AVATAR_COLORS.length];
        colorIndex++;
        return color;
    }

    function initials(name) {
        return (name || '?').trim().charAt(0) || '?';
    }

    function addMember(name, photo, isMe, rawPhoto) {
        var member = {
            id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
            name: name || '',
            photo: photo || null,
            rawPhoto: rawPhoto || null,
            color: nextColor(),
            defaultResponse: 'attending',
            isMe: !!isMe
        };
        members.push(member);
        renderMembers();
    }

    function toggleResponse(id) {
        var member = members.find(function (m) { return m.id === id; });
        if (!member) return;
        member.defaultResponse = member.defaultResponse === 'attending' ? 'absent' : 'attending';
        renderMembers();
    }

    function updateName(id, value) {
        var member = members.find(function (m) { return m.id === id; });
        if (member) member.name = value;
    }

    function removeMember(id) {
        members = members.filter(function (m) { return m.id !== id; });
        renderMembers();
    }

    var currentCropMemberId = null;
    var cropModal = document.getElementById('crop-modal');
    var cropStage = document.getElementById('crop-stage');
    var cropImage = document.getElementById('crop-image');
    var cropZoom = document.getElementById('crop-zoom');
    var cropCancelBtn = document.getElementById('crop-cancel-btn');
    var cropConfirmBtn = document.getElementById('crop-confirm-btn');
    var cropChooseNewBtn = document.getElementById('crop-choose-new-btn');
    var currentCropFileInput = null;

    var STAGE_SIZE = 220;
    var OUTPUT_SIZE = 300;
    var cropState = { naturalWidth: 0, naturalHeight: 0, baseScale: 1, zoom: 1, offsetX: 0, offsetY: 0 };
    var isDragging = false, dragStartX = 0, dragStartY = 0, dragStartOffsetX = 0, dragStartOffsetY = 0;

    function handleMemberPhotoAreaClick(id, fileInput) {
        var member = members.find(function (m) { return m.id === id; });
        currentCropMemberId = id;
        currentCropFileInput = fileInput;
        if (member && member.rawPhoto) {
            cropImage.onload = function () { openCropModal(); };
            cropImage.src = member.rawPhoto;
        } else {
            fileInput.click();
        }
    }

    cropChooseNewBtn.addEventListener('click', function () {
        if (currentCropFileInput) currentCropFileInput.click();
    });

    function handleMemberPhotoChange(id, event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            currentCropMemberId = id;
            cropImage.onload = function () { openCropModal(); };
            cropImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = '';
    }

    function openCropModal() {
        cropState.naturalWidth = cropImage.naturalWidth;
        cropState.naturalHeight = cropImage.naturalHeight;
        cropState.baseScale = Math.max(STAGE_SIZE / cropState.naturalWidth, STAGE_SIZE / cropState.naturalHeight);
        cropState.zoom = 1;
        var displayWidth = cropState.naturalWidth * getTotalScale();
        var displayHeight = cropState.naturalHeight * getTotalScale();
        cropState.offsetX = (STAGE_SIZE - displayWidth) / 2;
        cropState.offsetY = (STAGE_SIZE - displayHeight) / 2;
        cropZoom.value = '1';
        applyCropTransform();
        cropModal.hidden = false;
    }

    function getTotalScale() { return cropState.baseScale * cropState.zoom; }

    function clampOffset() {
        var totalScale = getTotalScale();
        var displayWidth = cropState.naturalWidth * totalScale;
        var displayHeight = cropState.naturalHeight * totalScale;
        var minX = STAGE_SIZE - displayWidth;
        var minY = STAGE_SIZE - displayHeight;
        cropState.offsetX = Math.min(0, Math.max(minX, cropState.offsetX));
        cropState.offsetY = Math.min(0, Math.max(minY, cropState.offsetY));
    }

    function applyCropTransform() {
        clampOffset();
        var totalScale = getTotalScale();
        cropImage.style.width = (cropState.naturalWidth * totalScale) + 'px';
        cropImage.style.height = (cropState.naturalHeight * totalScale) + 'px';
        cropImage.style.left = cropState.offsetX + 'px';
        cropImage.style.top = cropState.offsetY + 'px';
    }

    cropStage.addEventListener('pointerdown', function (event) {
        isDragging = true;
        cropStage.classList.add('dragging');
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        dragStartOffsetX = cropState.offsetX;
        dragStartOffsetY = cropState.offsetY;
        cropStage.setPointerCapture(event.pointerId);
    });
    cropStage.addEventListener('pointermove', function (event) {
        if (!isDragging) return;
        var deltaX = event.clientX - dragStartX;
        var deltaY = event.clientY - dragStartY;
        cropState.offsetX = dragStartOffsetX + deltaX;
        cropState.offsetY = dragStartOffsetY + deltaY;
        applyCropTransform();
    });
    function stopDragging() { isDragging = false; cropStage.classList.remove('dragging'); }
    cropStage.addEventListener('pointerup', stopDragging);
    cropStage.addEventListener('pointercancel', stopDragging);

    cropZoom.addEventListener('input', function () {
        cropState.zoom = Number(cropZoom.value);
        applyCropTransform();
    });

    cropCancelBtn.addEventListener('click', function () {
        cropModal.hidden = true;
        currentCropMemberId = null;
    });

    cropConfirmBtn.addEventListener('click', function () {
        var totalScale = getTotalScale();
        var sourceX = (0 - cropState.offsetX) / totalScale;
        var sourceY = (0 - cropState.offsetY) / totalScale;
        var sourceSize = STAGE_SIZE / totalScale;

        var canvas = document.createElement('canvas');
        canvas.width = OUTPUT_SIZE;
        canvas.height = OUTPUT_SIZE;
        var ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(OUTPUT_SIZE / 2, OUTPUT_SIZE / 2, OUTPUT_SIZE / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(cropImage, sourceX, sourceY, sourceSize, sourceSize, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

        var dataUrl = canvas.toDataURL('image/png');
        var rawDataUrl = cropImage.src;
        var member = members.find(function (m) { return m.id === currentCropMemberId; });
        if (member) {
            member.photo = dataUrl;
            member.rawPhoto = rawDataUrl;
            if (member.isMe) {
                try {
                    localStorage.setItem('onboarding_profile_photo', dataUrl);
                    localStorage.setItem('onboarding_profile_photo_raw', rawDataUrl);
                } catch (err) {}
            }
            renderMembers();
        }

        cropModal.hidden = true;
        currentCropMemberId = null;
    });

    function renderMembers() {
        var list = document.getElementById('memberList');
        list.innerHTML = '';
        members.forEach(function (member) {
            var row = document.createElement('div');
            row.className = 'bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] flex items-center gap-3';

            var avatarWrap = document.createElement('div');
            avatarWrap.className = 'relative w-10 h-10 shrink-0';

            var avatar = document.createElement('div');
            avatar.className = 'w-10 h-10 rounded-full flex items-center justify-center text-on-primary font-headline-lg text-headline-lg overflow-hidden';
            avatar.style.backgroundColor = member.color;
            avatar.style.cursor = 'pointer';
            avatar.onclick = function () { handleMemberPhotoAreaClick(member.id, photoInput); };
            if (member.photo) {
                var img = document.createElement('img');
                img.src = member.photo;
                img.className = 'w-full h-full object-cover';
                avatar.appendChild(img);
            } else {
                avatar.textContent = initials(member.name);
            }
            avatarWrap.appendChild(avatar);

            var photoInput = document.createElement('input');
            photoInput.type = 'file';
            photoInput.accept = 'image/*';
            photoInput.className = 'hidden';
            photoInput.addEventListener('change', function (e) { handleMemberPhotoChange(member.id, e); });
            avatarWrap.appendChild(photoInput);

            var photoBtn = document.createElement('button');
            photoBtn.type = 'button';
            photoBtn.className = 'absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0px_1px_4px_rgba(0,0,0,0.25)]';
            photoBtn.setAttribute('aria-label', (member.isMe ? '내' : member.name || '구성원') + ' 사진 추가');
            photoBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size:12px">photo_camera</span>';
            photoBtn.onclick = function () { handleMemberPhotoAreaClick(member.id, photoInput); };
            avatarWrap.appendChild(photoBtn);

            var nameInput = document.createElement('input');
            nameInput.className = 'flex-1 min-w-0 bg-transparent border-0 focus:ring-0 px-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant';
            nameInput.placeholder = '이름';
            nameInput.value = member.name;
            nameInput.disabled = member.isMe;
            nameInput.addEventListener('input', function (e) {
                updateName(member.id, e.target.value);
                // 사진이 있으면 아바타를 건드리지 않음 — textContent를 ''로 덮어쓰면 안에 들어있는
                // <img>까지 같이 지워져서 사진이 사라지는 버그가 있었음.
                if (!member.photo) avatar.textContent = initials(e.target.value);
            });

            var tag = document.createElement('button');
            tag.type = 'button';
            var attending = member.defaultResponse === 'attending';
            tag.className = 'font-label-sm text-label-sm px-3 py-1.5 rounded-full shrink-0 transition-colors ' + (attending ? 'bg-tertiary-container text-on-tertiary-container' : 'bg-surface-container-high text-on-surface-variant');
            tag.textContent = attending ? '평소 먹음' : '평소 안 먹음';
            tag.onclick = function () { toggleResponse(member.id); };

            row.appendChild(avatarWrap);
            row.appendChild(nameInput);
            row.appendChild(tag);

            if (!member.isMe) {
                var removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'w-9 h-9 flex items-center justify-center text-on-surface-variant shrink-0';
                removeBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">close</span>';
                removeBtn.onclick = function () { removeMember(member.id); };
                row.appendChild(removeBtn);
            }

            list.appendChild(row);
        });
    }

    var completeBtn = document.querySelector('button[onclick="completeOnboarding()"]');

    async function completeOnboarding() {
        var emptyName = members.find(function (m) { return !m.name.trim(); });
        if (emptyName) { alert('모든 구성원의 이름을 입력해주세요.'); return; }

        var householdId = localStorage.getItem('onboarding_household_id');
        if (!householdId) { alert('가구 정보를 찾을 수 없어요.\n이전 단계부터 다시 진행해주세요.'); return; }

        completeBtn.disabled = true;
        try {
            var session = await getSession();
            var uploaded = [];
            for (var i = 0; i < members.length; i++) {
                var m = members[i];
                var avatarUrl = null;
                if (m.photo) {
                    var blob = await (await fetch(m.photo)).blob();
                    avatarUrl = await API.storage.uploadAvatar(session.user.id, blob, (m.isMe ? 'me' : m.id));
                }
                uploaded.push({
                    name: m.name.trim(),
                    avatar_url: avatarUrl,
                    color: m.color,
                    defaultResponse: m.defaultResponse,
                    isMe: m.isMe
                });
            }

            await API.members.bulkCreate(householdId, uploaded);

            // 온보딩 단계 간 임시 전달용 키 정리(더 이상 필요 없음)
            ['onboarding_household_id', 'onboarding_household_name', 'onboarding_nickname',
             'onboarding_profile_photo', 'onboarding_profile_photo_raw'].forEach(function (k) {
                localStorage.removeItem(k);
            });
        } catch (err) {
            completeBtn.disabled = false;
            alert('가족 구성원 등록에 실패했어요: ' + err.message);
            return;
        }
        window.location.href = '../3-0. 홈/code.html';
    }

    (async function init() {
        await requireSession();
        var nickname = '';
        var photo = null;
        var rawPhoto = null;
        try {
            nickname = localStorage.getItem('onboarding_nickname') || '나';
            photo = localStorage.getItem('onboarding_profile_photo');
            rawPhoto = localStorage.getItem('onboarding_profile_photo_raw');
        } catch (err) {}
        addMember(nickname || '나', photo, true, rawPhoto);
    })();
</script>
