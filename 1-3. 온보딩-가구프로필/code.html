<style>

</div>

<!-- 가족 외 그룹 유형(회사 등)도 지원(6가지 예정 작업 3번) — 나중에 5-1 가구 설정에서 변경 가능. -->

<label class="font-label-sm text-label-sm text-on-surface-variant">모임 유형</label>

<button type="button" class="group-type-chip flex-1 py-2.5 flex flex-col items-center gap-1 font-label-sm text-label-sm transition-colors border-r border-outline-variant" data-type="company" onclick="selectGroupType('company')"><span class="material-symbols-outlined text-[18px]">apartment</span>회사</button>

<!-- 이미지 조정(크롭) 모달 -->
<div id="crop-modal" class="crop-modal" hidden="">
<div class="crop-modal-content">
<h3 class="font-headline-lg text-headline-lg text-on-surface mb-1">프로필 이미지 조정</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-4">이미지를 드래그해서 위치를 옮기고, 슬라이더로 확대/축소하세요.</p>
<div class="crop-stage" id="crop-stage">
<img id="crop-image" class="crop-image" alt="크롭할 이미지" draggable="false">
</div>
<input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1">
<button type="button" class="w-full py-2 mb-3 font-label-sm text-label-sm text-on-surface-variant underline" id="crop-choose-new-btn">다른 사진 선택</button>
<div class="flex gap-3">
<button type="button" class="flex-1 py-3 rounded-full bg-surface-container-high text-on-surface font-label-sm text-label-sm" id="crop-cancel-btn">취소</button>
<button type="button" class="flex-1 py-3 rounded-full bg-primary text-on-primary font-label-sm text-label-sm" id="crop-confirm-btn">적용</button>
</div>
</div>
</div>

<script>
    // 가족 외 그룹 유형(회사 등) — 기본 '가족' 선택 상태로 시작.
    var selectedGroupType = 'family';
    function selectGroupType(type) {
        selectedGroupType = type;
        document.querySelectorAll('.group-type-chip').forEach(function (chip) {
            var active = chip.getAttribute('data-type') === type;
            chip.classList.toggle('bg-surface-container', active);
            chip.classList.toggle('text-primary', active);
            chip.classList.toggle('font-semibold', active);
            chip.classList.toggle('text-on-surface-variant', !active);
        });
    }
    selectGroupType('family');

    var profilePhotoInput = document.getElementById('profilePhotoInput');
    var profilePhotoPreview = document.getElementById('profilePhotoPreview');
    var profilePhotoPlaceholder = document.getElementById('profilePhotoPlaceholder');
    var profilePhotoBox = document.getElementById('profilePhotoBox');

    var cropModal = document.getElementById('crop-modal');
    var cropStage = document.getElementById('crop-stage');
    var cropImage = document.getElementById('crop-image');
    var cropZoom = document.getElementById('crop-zoom');
    var cropCancelBtn = document.getElementById('crop-cancel-btn');
    var cropConfirmBtn = document.getElementById('crop-confirm-btn');
    var cropChooseNewBtn = document.getElementById('crop-choose-new-btn');

    var STAGE_SIZE = 220;
    var OUTPUT_SIZE = 300;
    var cropState = { naturalWidth: 0, naturalHeight: 0, baseScale: 1, zoom: 1, offsetX: 0, offsetY: 0 };
    var isDragging = false, dragStartX = 0, dragStartY = 0, dragStartOffsetX = 0, dragStartOffsetY = 0;
    var rawProfilePhoto = null;

    function handlePhotoAreaClick() {
        if (rawProfilePhoto) {
            cropImage.onload = function () { openCropModal(); };
            cropImage.src = rawProfilePhoto;
        } else {
            profilePhotoInput.click();
        }
    }

    cropChooseNewBtn.addEventListener('click', function () {
        profilePhotoInput.click();
    });

    profilePhotoInput.addEventListener('change', function (event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            rawProfilePhoto = e.target.result;
            cropImage.onload = function () { openCropModal(); };
            cropImage.src = rawProfilePhoto;
        };
        reader.readAsDataURL(file);
        event.target.value = '';
    });

    function openCropModal() {
        cropState.naturalWidth = cropImage.naturalWidth;
        cropState.naturalHeight = cropImage.naturalHeight;
        cropState.baseScale = Math.max(STAGE_SIZE / cropState.naturalWidth, STAGE_SIZE / cropState.naturalHeight);
        cropState.zoom = 1;
        var displayWidth = cropState.naturalWidth * getTotalScale();
        var displayHeight = cropState.naturalHeight * getTotalScale();
        cropState.offsetX = (STAGE_SIZE - displayWidth) / 2;
        cropState.offsetY = (STAGE_SIZE - displayHeight) / 2;
        cropZoom.value = '1';
        applyCropTransform();
        cropModal.hidden = false;
    }

    function getTotalScale() { return cropState.baseScale * cropState.zoom; }

    function clampOffset() {
        var totalScale = getTotalScale();
        var displayWidth = cropState.naturalWidth * totalScale;
        var displayHeight = cropState.naturalHeight * totalScale;
        var minX = STAGE_SIZE - displayWidth;
        var minY = STAGE_SIZE - displayHeight;
        cropState.offsetX = Math.min(0, Math.max(minX, cropState.offsetX));
        cropState.offsetY = Math.min(0, Math.max(minY, cropState.offsetY));
    }

    function applyCropTransform() {
        clampOffset();
        var totalScale = getTotalScale();
        cropImage.style.width = (cropState.naturalWidth * totalScale) + 'px';
        cropImage.style.height = (cropState.naturalHeight * totalScale) + 'px';
        cropImage.style.left = cropState.offsetX + 'px';
        cropImage.style.top = cropState.offsetY + 'px';
    }

    cropStage.addEventListener('pointerdown', function (event) {
        isDragging = true;
        cropStage.classList.add('dragging');
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        dragStartOffsetX = cropState.offsetX;
        dragStartOffsetY = cropState.offsetY;
        cropStage.setPointerCapture(event.pointerId);
    });
    cropStage.addEventListener('pointermove', function (event) {
        if (!isDragging) return;
        var deltaX = event.clientX - dragStartX;
        var deltaY = event.clientY - dragStartY;
        cropState.offsetX = dragStartOffsetX + deltaX;
        cropState.offsetY = dragStartOffsetY + deltaY;
        applyCropTransform();
    });
    function stopDragging() { isDragging = false; cropStage.classList.remove('dragging'); }
    cropStage.addEventListener('pointerup', stopDragging);
    cropStage.addEventListener('pointercancel', stopDragging);

    cropZoom.addEventListener('input', function () {
        cropState.zoom = Number(cropZoom.value);
        applyCropTransform();
    });

    cropCancelBtn.addEventListener('click', function () {
        cropModal.hidden = true;
    });

    cropConfirmBtn.addEventListener('click', function () {
        var totalScale = getTotalScale();
        var sourceX = (0 - cropState.offsetX) / totalScale;
        var sourceY = (0 - cropState.offsetY) / totalScale;
        var sourceSize = STAGE_SIZE / totalScale;

        var canvas = document.createElement('canvas');
        canvas.width = OUTPUT_SIZE;
        canvas.height = OUTPUT_SIZE;
        var ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(OUTPUT_SIZE / 2, OUTPUT_SIZE / 2, OUTPUT_SIZE / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(cropImage, sourceX, sourceY, sourceSize, sourceSize, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

        var dataUrl = canvas.toDataURL('image/png');
        applyProfilePhoto(dataUrl);
        try {
            localStorage.setItem('onboarding_profile_photo', dataUrl);
            localStorage.setItem('onboarding_profile_photo_raw', rawProfilePhoto);
        } catch (err) {}

        cropModal.hidden = true;
    });

    function applyProfilePhoto(dataUrl) {
        profilePhotoPreview.src = dataUrl;
        profilePhotoPreview.classList.remove('hidden');
        profilePhotoPlaceholder.classList.add('hidden');
        profilePhotoBox.classList.remove('border-dashed');
    }

    var nextStepBtn = document.querySelector('button[type="submit"]');

    async function goToNextStep() {
        var householdName = document.getElementById('householdName').value.trim();
        var nickname = document.getElementById('nickname').value.trim();
        if (!householdName) { alert('가구명을 입력해주세요.'); return; }

        nextStepBtn.disabled = true;
        try {
            // household는 여기서 실제로 생성. 구성원(1-4)은 이 id를 이어받아 등록됨.
            var household = await API.households.create(householdName, selectedGroupType);
            localStorage.setItem('onboarding_household_id', household.id);
            localStorage.setItem('onboarding_household_name', householdName);
            localStorage.setItem('onboarding_nickname', nickname);
        } catch (err) {
            nextStepBtn.disabled = false;
            alert('가구 생성에 실패했어요: ' + err.message);
            return;
        }
        window.location.href = '../1-4. 온보딩-가족구성원/code.html';
    }

    (async function restoreSavedInputs() {
        await requireSession();
        try {
            var savedName = localStorage.getItem('onboarding_household_name');
            var savedNickname = localStorage.getItem('onboarding_nickname');
            var savedPhoto = localStorage.getItem('onboarding_profile_photo');
            var savedRawPhoto = localStorage.getItem('onboarding_profile_photo_raw');
            if (savedName) document.getElementById('householdName').value = savedName;
            if (savedNickname) document.getElementById('nickname').value = savedNickname;
            if (savedRawPhoto) rawProfilePhoto = savedRawPhoto;
            if (savedPhoto) applyProfilePhoto(savedPhoto);
        } catch (err) {}
    })();
</script>
