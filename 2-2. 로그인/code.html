<style>
    body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    .spinner { width: 14px; height: 14px; border: 2px solid #ded3ef; border-top-color: #6d5a92; border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .organic-blob-sm {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        animation: blobAnimSm 8s ease-in-out infinite alternate;
    }
    @keyframes blobAnimSm {
        0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    }
    .spinner-lg {
        width: 22px; height: 22px; border: 3px solid #ded3ef; border-top-color: #6d5a92;
        border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite;
    }
  </style>

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center">
<div id="auth-check-loading" class="w-full max-w-[600px] flex flex-col items-center justify-center gap-3 text-on-surface-variant py-24">
<span class="spinner-lg"></span>
<p class="font-label-sm text-label-sm">로그인 확인 중...</p>
</div>
<main id="main-content" class="hidden w-full max-w-[600px] flex flex-col px-safe-area-inset py-6 relative">

<button class="absolute top-4 left-4 z-20 w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../2-1.로그인 화면/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>

<div class="z-10">
<div class="mb-3 flex flex-col items-center text-center">
<img alt="우리집식당" class="w-20 h-20 object-contain mb-1 shrink-0" src="../참고문서/로고.png"/>
<h1 class="font-display-serif text-display-serif text-primary mb-1">우리집식당</h1>
<p class="font-emotional-quote text-emotional-quote text-on-surface-variant italic">"묻지 않아도 아는 집"</p>
</div>

<form id="login-form" class="flex flex-col gap-3" novalidate onsubmit="event.preventDefault();">
<h2 class="font-headline-lg text-headline-lg text-on-surface text-center mb-1">로그인</h2>

<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">이메일 <span class="text-error">*</span></label>
<input class="w-full bg-transparent border-0 border-b border-surface-container-high focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors" id="email" placeholder="example@email.com" type="email">
<p class="font-label-sm text-label-sm text-error" id="email-error"></p>
</div>

<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">비밀번호 <span class="text-error">*</span></label>
<div class="flex items-center gap-2 border-b border-surface-container-high focus-within:border-primary transition-colors">
<input class="flex-1 bg-transparent border-0 focus:ring-0 px-0 py-2 font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="password" placeholder="비밀번호를 입력하세요" type="password">
<button type="button" class="toggle-password w-11 h-11 flex items-center justify-center text-on-surface-variant text-lg shrink-0" data-target="password">👁</button>
</div>
<p class="font-label-sm text-label-sm text-error" id="password-error"></p>
</div>

<p class="text-center font-label-sm text-label-sm min-h-[18px]" id="form-message"></p>

<div class="hidden items-center justify-center gap-2 font-label-sm text-label-sm text-primary" id="loading">
<span class="spinner"></span> 로그인 중입니다...
</div>

<div class="flex gap-2 mt-1">
<button class="flex-1 bg-primary text-on-primary font-label-sm text-[15px] py-4 rounded-full shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2" id="login-btn" type="submit">
<span>로그인</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="flex-1 py-4 rounded-full bg-surface-container-high text-on-surface font-label-sm text-[15px] active:scale-95 transition-transform" id="signup-btn" type="button">회원가입</button>
</div>
</form>

<div class="flex items-center gap-3 my-3">
<div class="flex-1 h-px bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">또는</span>
<div class="flex-1 h-px bg-surface-container-high"></div>
</div>

<button type="button" id="kakao-btn" class="w-full py-4 rounded-full bg-[#FEE500] text-[#191919] font-label-sm text-[15px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">chat_bubble</span>
<span>카카오로 로그인</span>
</button>
<p class="text-center font-label-sm text-label-sm text-error mt-1" id="kakao-message"></p>
</div>
</main>

<script>
    var emailInput = document.getElementById('email');
    var passwordInput = document.getElementById('password');
    var emailError = document.getElementById('email-error');
    var passwordError = document.getElementById('password-error');
    var formMessage = document.getElementById('form-message');
    var loading = document.getElementById('loading');
    var loginBtn = document.getElementById('login-btn');
    var signupBtn = document.getElementById('signup-btn');
    var kakaoBtn = document.getElementById('kakao-btn');
    var kakaoMessage = document.getElementById('kakao-message');

    async function goAfterLogin() {
        var member = await getMyMember();
        window.location.href = member ? '../3-0. 홈/code.html' : '../1-2. 온보딩-시작하기/code.html';
    }

    (async function checkAutoLogin() {
        var session = await getSession();
        if (session) {
            await goAfterLogin();
            return;
        }
        document.getElementById('auth-check-loading').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
    })();

    kakaoBtn.addEventListener('click', function () {
        kakaoBtn.disabled = true;
        kakaoMessage.textContent = '';
        API.auth.signInKakao().catch(function (err) {
            kakaoBtn.disabled = false;
            kakaoMessage.textContent = '카카오 로그인에 실패했어요: ' + err.message;
        });
        // 성공 시 Supabase가 카카오 인증 페이지로 리다이렉트했다가 돌아오므로, 복귀 후 처리는
        // 2-1(로그인 화면)의 checkAutoLogin이 세션을 감지해 이어서 진행함.
    });

    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var targetId = btn.getAttribute('data-target');
            var targetInput = document.getElementById(targetId);
            if (targetInput.type === 'password') {
                targetInput.type = 'text';
                btn.textContent = '🙈';
            } else {
                targetInput.type = 'password';
                btn.textContent = '👁';
            }
        });
    });

    signupBtn.addEventListener('click', function () {
        window.location.href = '../1-1. 온보딩-회원가입/code.html';
    });

    function clearAllErrors() {
        emailError.textContent = '';
        passwordError.textContent = '';
    }

    function validateForm() {
        clearAllErrors();
        var isValid = true;
        if (!emailInput.value.trim()) { emailError.textContent = '이메일을 입력해주세요.'; isValid = false; }
        if (!passwordInput.value) { passwordError.textContent = '비밀번호를 입력해주세요.'; isValid = false; }
        return isValid;
    }

    function setLoading(isLoading) {
        loading.classList.toggle('hidden', !isLoading);
        loading.classList.toggle('flex', isLoading);
        loginBtn.disabled = isLoading;
        signupBtn.disabled = isLoading;
    }

    document.getElementById('login-form').addEventListener('submit', function (event) {
        event.preventDefault();
        formMessage.textContent = '';
        formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px]';

        if (!validateForm()) return;

        setLoading(true);

        API.auth.signInPassword(emailInput.value.trim(), passwordInput.value)
            .then(function () {
                formMessage.textContent = '로그인 성공! 이동 중입니다...';
                formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-primary';
                return goAfterLogin();
            })
            .catch(function (err) {
                setLoading(false);
                formMessage.textContent = '로그인에 실패했어요: 이메일 또는 비밀번호를 확인해주세요.';
                formMessage.className = 'text-center font-label-sm text-label-sm min-h-[18px] text-error';
            });
    });
</script>
</body></html>
