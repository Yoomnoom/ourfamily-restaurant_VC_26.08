     주 그리드 사이에 끼워질 때 눈에 띄게 bg-surface-container로 배경을 줘서 "펼쳐진 줄"처럼 보이게 함. -->

<script>
    var householdId = null;
    var myMember = null;
    var membersCache = []; // household_members_vc2608 — 색상·이름, creator_id → color 매핑용

    var today = new Date();
    var viewYear = today.getFullYear();
    var viewMonth = today.getMonth(); // 0-11

    function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function isSameDate(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

    var mealsCache = []; // meals_vc2608 rows + _color/_statusLine 계산 결과
    var mealsByDate = {}; // dateKey -> mealsCache 항목들

    function colorForCreator(creatorId) {
        var member = membersCache.find(function (m) { return m.profile_id === creatorId; });
        return (member && member.color) || '#8a9a7b';
    }

    async function loadMeals() {
        var meals = await API.meals.listByHousehold(householdId);
        for (var i = 0; i < meals.length; i++) {
            var roster = await API.mealParticipants.getRoster(meals[i].id);
            var attending = roster.filter(function (r) { return r.status === 'attending'; }).length;
            var pending = roster.filter(function (r) { return r.status === 'pending'; }).length;
            meals[i]._statusLine = '함께 ' + attending + '명' + (pending ? ' · 확인 안 됨 ' + pending + '명' : '');
            meals[i]._color = colorForCreator(meals[i].creator_id);
        }
        mealsCache = meals;
        mealsByDate = {};
        meals.forEach(function (m) {
            if (!mealsByDate[m.date]) mealsByDate[m.date] = [];
            mealsByDate[m.date].push(m);
        });
    }

    function mealSummary(dKey) {
        var meals = mealsByDate[dKey];
        if (!meals || !meals.length) return null;
        var first = meals[0];
        var firstMenuWord = (first.menu && first.menu[0]) || '메뉴 미정';
        var label = meals.length > 1 ? firstMenuWord + ' 외 ' + (meals.length - 1) + '건' : firstMenuWord;
        return { color: first._color, menu: label };
    }

    function renderMemberLegend() {
        var legend = document.getElementById('memberLegend');
        legend.innerHTML = '';
        membersCache.filter(function (m) { return m.role !== 'guest' && m.color; }).forEach(function (m) {
            var span = document.createElement('span');
            span.className = 'flex items-center gap-1';
            span.innerHTML = '<span class="w-2 h-2 rounded-full inline-block" style="background:' + m.color + ';"></span>' + m.name;
            legend.appendChild(span);
        });
    }

    // 앞뒤 달 날짜는 흐리게 표시(그 달 실제 날짜, muted 표시만). week: 그 날짜가 속한 주(일~토)를 표시.
    function buildMonthCells(year, month) {
        var firstWeekday = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var daysInPrevMonth = new Date(year, month, 0).getDate();
        var totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
        var cells = [];
        for (var i = 0; i < totalCells; i++) {
            var dayNum = i - firstWeekday + 1;
            if (dayNum < 1) {
                cells.push({ date: new Date(year, month - 1, daysInPrevMonth + dayNum), muted: true });
            } else if (dayNum > daysInMonth) {
                cells.push({ date: new Date(year, month + 1, dayNum - daysInMonth), muted: true });
            } else {
                cells.push({ date: new Date(year, month, dayNum), muted: false });
            }
        }
        return cells;
    }

    function buildWeekOfTodayCells() {
        var startOfWeek = new Date(today);
        startOfWeek.setDate(today.getDate() - today.getDay());
        var cells = [];
        for (var i = 0; i < 7; i++) {
            var d = new Date(startOfWeek);
            d.setDate(startOfWeek.getDate() + i);
            cells.push({ date: d, muted: false });
        }
        return cells;
    }

    var currentView = 'month';
    var selectedDate = today;
    var dayDetailOpen = true; // 이미 펼쳐진 날짜를 다시 누르면 접히게(아코디언처럼)

    function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        else if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        document.getElementById('monthTitle').textContent = viewYear + '년 ' + (viewMonth + 1) + '월';
        renderAll();
    }

    function renderDayCell(cell, big) {
        var el = document.createElement('button');
        el.type = 'button';
        var dKey = dateKey(cell.date);
        var summary = cell.muted ? null : mealSummary(dKey);
        el.className = (big ? 'week-cell' : 'day-cell') + ' rounded-lg flex flex-col items-center justify-start pt-1.5 gap-1 ' +
            (cell.muted ? 'text-outline' : 'text-on-surface bg-surface-container-lowest shadow-[0px_2px_6px_rgba(120,119,119,0.06)]') +
            (!cell.muted && isSameDate(cell.date, today) ? ' ring-2 ring-primary' : '') +
            (!cell.muted && isSameDate(cell.date, selectedDate) ? ' bg-surface-container-high' : '');
        el.innerHTML = '<span class="font-label-sm text-label-sm">' + cell.date.getDate() + '</span>';
        if (summary) {
            var dot = document.createElement('span');
            dot.className = 'w-1.5 h-1.5 rounded-full';
            dot.style.background = summary.color;
            el.appendChild(dot);
            var menu = document.createElement('span');
            menu.className = 'cell-menu font-label-sm text-on-surface-variant leading-tight text-center px-0.5';
            menu.style.fontSize = big ? '10px' : '8px';
            menu.textContent = summary.menu;
            el.appendChild(menu);
        }
        if (!cell.muted) {
            el.onclick = function () {
                if (isSameDate(cell.date, selectedDate)) { dayDetailOpen = !dayDetailOpen; }
                else { selectedDate = cell.date; dayDetailOpen = true; }
                renderAll();
            };
        }
        return el;
    }

    // dayDetail은 DOM에 하나만 존재 — 내용을 복제하는 대신 이 노드를 필요한 자리로 옮겨서(re-parent)
    // "선택한 날짜 바로 아래"에 보이게 한다(달력 전체 맨 아래가 아니라).
    function placeDayDetail(afterEl) {
        var detail = document.getElementById('dayDetail');
        afterEl.parentNode.insertBefore(detail, afterEl.nextSibling);
    }

    function renderMonthGrid() {
        // container.innerHTML='' 직전에 dayDetail을 안전한 자리(anchor)로 먼저 빼둠 —
        // 지난 렌더에서 dayDetail이 이 container 안으로 옮겨져 있었다면, innerHTML=''가 그 노드 자체를 지워버리는 버그가 있었음.
        placeDayDetail(document.getElementById('dayDetailAnchor'));
        var container = document.getElementById('calGrid');
        container.innerHTML = '';
        var cells = buildMonthCells(viewYear, viewMonth);
        var selectedWeekRow = null;
        for (var i = 0; i < cells.length; i += 7) {
            var week = cells.slice(i, i + 7);
            var weekRow = document.createElement('div');
            weekRow.className = 'grid grid-cols-7 gap-1';
            week.forEach(function (cell) { weekRow.appendChild(renderDayCell(cell, false)); });
            container.appendChild(weekRow);
            if (week.some(function (cell) { return !cell.muted && isSameDate(cell.date, selectedDate); })) { selectedWeekRow = weekRow; }
        }
        placeDayDetail(selectedWeekRow || container);
    }

    function renderWeekGrid() {
        placeDayDetail(document.getElementById('dayDetailAnchor'));
        var grid = document.getElementById('weekGrid');
        grid.innerHTML = '';
        buildWeekOfTodayCells().forEach(function (cell) { grid.appendChild(renderDayCell(cell, true)); });
        placeDayDetail(grid);
    }

    // 미리 답해두기: 원래 홈 화면에 5일치를 한 줄로 늘어놓고 체크/X 아이콘만 보여줬더니
    // "협박같고 보기 안 좋다"는 지적 + "이건 날짜 기능이니 달력에 있어야 하지 않냐"는 지적을 받아 이곳으로 옮김.
    // 달력에서 날짜 하나씩, 문장으로 묻는 방식이라 다섯 개를 한꺼번에 들이미는 느낌이 없음.
    var advanceAnswersCache = [];
    var guestbookCache = [];
    var weekdayDefaultsCache = [];

    async function loadAdvanceAnswers() { advanceAnswersCache = await API.advanceAnswers.list(householdId); }
    async function loadGuestbook() { guestbookCache = await API.guestbook.list(householdId); }
    async function loadWeekdayDefaults() { weekdayDefaultsCache = await API.weekdayDefaults.list(householdId); }

    // 지난 날짜에도 한마디를 남길 수 있게 — 달력이 "그날의 한마디"를 보여주기만 하고 남기는 건 홈(오늘만)에서만 되던 빈틈을 메움.
    async function addNoteForSelectedDay() {
        var message = prompt('이 날에 대해 한마디 남길까요?');
        if (!message || !message.trim()) return;
        await API.guestbook.add(householdId, myMember.id, message.trim(), dateKey(selectedDate));
        await loadGuestbook();
        renderDayDetail();
    }

    async function removeNote(id) {
        // 잘못 눌렀을 수도, 수정하려던 걸 수도 있으니 지우기 전에 한 번 확인.
        if (!confirm('이 한마디를 지울까요?\n되돌릴 수 없어요.')) return;
        await API.guestbook.remove(id);
        await loadGuestbook();
        renderDayDetail();
    }

    // 이 날의 "요일별 기본 응답"(5-4)이 있으면 그걸 기준으로 보여주고, 여긴 그 요일 기본값에 대한 "예외"만 물어봄 —
    // 두 기능이 따로 놀지 않게(요일별 기본이 없으면 null 반환해서 기존처럼 처음부터 물어봄).
    function weekdayDefaultForSelected() {
        var idx = (selectedDate.getDay() + 6) % 7; // 0=월 ... 6=일, 5-4의 day_index와 동일
        var row = weekdayDefaultsCache.find(function (w) { return w.member_id === myMember.id && w.day_index === idx; });
        return row ? row.status : null; // 'attending' | 'absent' | null
    }

    async function setAdvanceAnswer(status) {
        await API.advanceAnswers.upsert(householdId, myMember.id, dateKey(selectedDate), status);
        await loadAdvanceAnswers();
        renderDayDetail();
    }

    function renderAdvancePrompt() {
        var dKey = dateKey(selectedDate);
        var existing = advanceAnswersCache.find(function (a) { return a.member_id === myMember.id && a.date === dKey; });
        var wrap = document.createElement('div');
        wrap.className = 'text-center';

        if (existing) {
            var statusLabel = existing.status === 'attending' ? '먹어요' : '안 먹어요';
            wrap.innerHTML =
                '<p class="font-label-sm text-label-sm text-on-surface-variant">✓ 미리 답해뒀어요 · <b class="text-on-surface">' + statusLabel + '</b></p>';
            var changeBtn = document.createElement('button');
            changeBtn.type = 'button';
            changeBtn.className = 'font-label-sm text-label-sm text-primary mt-1';
            changeBtn.textContent = '바꾸기';
            changeBtn.onclick = function () { setAdvanceAnswer(existing.status === 'attending' ? 'absent' : 'attending'); };
            wrap.appendChild(changeBtn);
        } else {
            var wd = weekdayDefaultForSelected(); // 'attending' | 'absent' | null
            var btnRow = document.createElement('div');
            btnRow.className = 'flex gap-2 justify-center';

            if (wd) {
                // 요일별 기본 응답(5-4)이 이미 있는 요일 — 여긴 새로 묻지 않고 "이 날만 예외인지"만 확인.
                var wdLabel = wd === 'attending' ? '참여' : '안 먹음';
                var wdStatus = wd;
                var msg = document.createElement('p');
                msg.className = 'font-body-md text-body-md text-on-surface mb-2';
                msg.innerHTML = '이 요일은 평소 <b>' + wdLabel + '</b>로 답해뒀어요.<br>이 날은 다른가요?';
                wrap.appendChild(msg);

                var sameBtn = document.createElement('button');
                sameBtn.type = 'button';
                sameBtn.className = 'px-4 py-2 rounded-full bg-primary text-on-primary font-label-sm text-label-sm';
                sameBtn.textContent = '네, 평소대로';
                sameBtn.onclick = function () { setAdvanceAnswer(wdStatus); };

                var diffBtn = document.createElement('button');
                diffBtn.type = 'button';
                diffBtn.className = 'px-4 py-2 rounded-full bg-surface-container text-on-surface font-label-sm text-label-sm';
                diffBtn.textContent = '이 날은 다르게';
                diffBtn.onclick = function () { setAdvanceAnswer(wdStatus === 'attending' ? 'absent' : 'attending'); };

                btnRow.appendChild(sameBtn);
                btnRow.appendChild(diffBtn);
            } else {
                // 요일별 기본 응답이 없는 요일 — 처음부터 직접 물어봄.
                var msg2 = document.createElement('p');
                msg2.className = 'font-body-md text-body-md text-on-surface mb-2';
                msg2.innerHTML = '이 날 식사에 참여하시나요?<br>지금 답해두면 나중에 식사를 만들 때 자동으로 반영돼요.';
                wrap.appendChild(msg2);

                var noBtn = document.createElement('button');
                noBtn.type = 'button';
                noBtn.className = 'px-4 py-2 rounded-full bg-surface-container text-on-surface font-label-sm text-label-sm';
                noBtn.textContent = '안 먹어요';
                noBtn.onclick = function () { setAdvanceAnswer('absent'); };
                var yesBtn = document.createElement('button');
                yesBtn.type = 'button';
                yesBtn.className = 'px-4 py-2 rounded-full bg-primary text-on-primary font-label-sm text-label-sm';
                yesBtn.textContent = '네, 먹어요';
                yesBtn.onclick = function () { setAdvanceAnswer('attending'); };
                btnRow.appendChild(noBtn);
                btnRow.appendChild(yesBtn);
            }
            wrap.appendChild(btnRow);
        }
        return wrap;
    }

    function renderDayDetail() {
        var isToday = isSameDate(selectedDate, today);
        document.getElementById('dayDetailTitle').textContent = (selectedDate.getMonth() + 1) + '월 ' + selectedDate.getDate() + '일' + (isToday ? ' (오늘)' : '');

        var body = document.getElementById('dayDetailBody');
        body.innerHTML = '';
        var meals = mealsByDate[dateKey(selectedDate)];

        if (!meals || !meals.length) {
            var emptyCard = document.createElement('div');
            emptyCard.className = 'rounded-xl bg-surface-container-lowest shadow-[0px_2px_8px_rgba(120,119,119,0.06)] p-4 flex flex-col gap-3';
            var empty = document.createElement('p');
            empty.className = 'font-label-sm text-label-sm text-on-surface-variant text-center';
            empty.textContent = '이 날은 계획된 식사가 없어요.';
            emptyCard.appendChild(empty);
            if (selectedDate >= today || isToday) { emptyCard.appendChild(renderAdvancePrompt()); }
            body.appendChild(emptyCard);
        } else {
            meals.forEach(function (m) {
                var card = document.createElement('article');
                card.className = 'rounded-xl bg-surface-container-lowest shadow-[0px_2px_8px_rgba(120,119,119,0.06)] p-4';
                card.style.borderLeft = '4px solid ' + m._color;
                card.innerHTML =
                    '<div class="flex items-center gap-2 mb-1.5">' +
                    '<span class="font-label-sm text-label-sm text-on-surface-variant">' + (m.time ? m.time.slice(0, 5) : '시간 미정') + '</span>' +
                    '<span class="font-label-sm text-label-sm bg-surface-container text-on-surface-variant px-2 py-0.5 rounded-full">' + m.kind + '</span>' +
                    '</div>' +
                    '<h3 class="font-headline-lg text-headline-lg text-on-surface mb-1">' + ((m.menu && m.menu.length) ? m.menu.join(' · ') : '메뉴 미정') + '</h3>' +
                    '<p class="font-label-sm text-label-sm text-on-surface-variant">' + m._statusLine + '</p>';
                body.appendChild(card);
            });
        }

        // 그날의 한마디(방명록) — 홈에서 남긴 메시지가 그날 지나면 사라지지 않고 여기서 계속 다시 보임(가족 기록장).
        var dKey = dateKey(selectedDate);
        var dayNotes = guestbookCache.filter(function (n) { return n.day === dKey; });
        if (dayNotes.length) {
            var notesWrap = document.createElement('div');
            var notesTitle = document.createElement('p');
            notesTitle.className = 'font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wide mb-2';
            notesTitle.textContent = '그날의 한마디';
            notesWrap.appendChild(notesTitle);

            var notesRow = document.createElement('div');
            notesRow.className = 'flex flex-wrap gap-2';
            // 엑셀 셀 메모처럼 — 옅은 노란 포스트잇 느낌(살짝 기울여서 진짜 붙여둔 쪽지처럼).
            dayNotes.forEach(function (n, i) {
                var authorName = (n.household_members_vc2608 && n.household_members_vc2608.name) || '?';
                var note = document.createElement('div');
                note.className = 'px-3 py-2 rounded-sm';
                note.style.background = '#fff6d6';
                note.style.border = '1px solid #ecdc9c';
                note.style.boxShadow = '2px 2px 4px rgba(120,119,119,0.15)';
                note.style.maxWidth = '150px';
                note.style.transform = 'rotate(' + (i % 2 === 0 ? '-1.5deg' : '1.5deg') + ')';
                note.innerHTML =
                    '<div class="flex items-start justify-between gap-1">' +
                    '<p class="font-label-sm text-label-sm font-semibold mb-0.5" style="color:#5c4a1a;">' + authorName + '</p>' +
                    (n.member_id === myMember.id ? '<button type="button" class="remove-note-btn font-label-sm text-label-sm shrink-0" style="color:#8a7530;">×</button>' : '') +
                    '</div>' +
                    '<p class="font-label-sm text-label-sm" style="color:#6b5a2a;">' + n.message + '</p>';
                var removeBtn = note.querySelector('.remove-note-btn');
                if (removeBtn) { removeBtn.onclick = function () { removeNote(n.id); }; }
                notesRow.appendChild(note);
            });
            notesWrap.appendChild(notesRow);
            body.appendChild(notesWrap);
        }

        var addNoteBtn = document.createElement('button');
        addNoteBtn.type = 'button';
        addNoteBtn.className = 'w-full py-2.5 rounded-xl border border-dashed border-outline-variant text-on-surface-variant font-label-sm text-label-sm flex items-center justify-center gap-2';
        addNoteBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">add_comment</span>이 날 한마디 남기기';
        addNoteBtn.onclick = function () { addNoteForSelectedDay(); };
        body.appendChild(addNoteBtn);

        var addBtn = document.createElement('button');
        addBtn.className = 'w-full py-3 rounded-xl border border-dashed border-outline-variant text-on-surface-variant font-label-sm text-label-sm flex items-center justify-center gap-2';
        addBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">add</span>이 날 식사 추가';
        addBtn.onclick = function () { window.location.href = '../3-2. 식사 만들기/code.html'; };
        body.appendChild(addBtn);
    }

    function setView(view) {
        currentView = view;
        if (view === 'week' || view === 'today') { selectedDate = today; }
        dayDetailOpen = true;

        document.querySelectorAll('.view-tab').forEach(function (btn) { btn.classList.remove('bg-primary', 'text-on-primary'); btn.classList.add('text-on-surface-variant'); });
        document.getElementById(view === 'month' ? 'tabMonth' : view === 'week' ? 'tabWeek' : 'tabToday').classList.add('bg-primary', 'text-on-primary');
        document.getElementById(view === 'month' ? 'tabMonth' : view === 'week' ? 'tabWeek' : 'tabToday').classList.remove('text-on-surface-variant');

        document.getElementById('monthView').classList.toggle('hidden', view !== 'month');
        document.getElementById('weekView').classList.toggle('hidden', view !== 'week');
        document.getElementById('hintLine').classList.toggle('hidden', view === 'today');

        renderAll();
    }

    function renderAll() {
        if (currentView === 'month') renderMonthGrid();
        else if (currentView === 'week') renderWeekGrid();
        else placeDayDetail(document.getElementById('dayDetailAnchor'));
        renderDayDetail();
        document.getElementById('dayDetail').classList.toggle('hidden', !dayDetailOpen);
    }

    var realtimeChannel = null;

    (async function init() {
        await requireSession();
        myMember = await getMyMember();
        if (!myMember) { window.location.href = '../1-2. 온보딩-시작하기/code.html'; return; }
        householdId = myMember.household_id;

        document.getElementById('monthTitle').textContent = viewYear + '년 ' + (viewMonth + 1) + '월';

        membersCache = await API.members.list(householdId);
        renderMemberLegend();
        await Promise.all([loadMeals(), loadGuestbook(), loadAdvanceAnswers(), loadWeekdayDefaults()]);
        setView('month');

        realtimeChannel = API.realtime.subscribeToHousehold(
            householdId,
            ['meals_vc2608', 'meal_responses_vc2608', 'guestbook_notes_vc2608', 'advance_answers_vc2608'],
            function () {
                Promise.all([loadMeals(), loadGuestbook(), loadAdvanceAnswers()]).then(renderAll);
            }
        );
        window.addEventListener('beforeunload', function () { API.realtime.unsubscribe(realtimeChannel); });
    })();
</script>
</body></html>
