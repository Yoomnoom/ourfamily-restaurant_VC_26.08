<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>우리집식당 - 식사 기록</title>

<script src="../shared/api.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
              "colors": {
                      "surface": "#fbf9f8", "surface-container-lowest": "#ffffff", "surface-container": "#f0eded",
                      "on-surface": "#1b1c1c", "on-surface-variant": "#45474a", "outline-variant": "#c6c6ca",
                      "primary": "#5d5e62", "on-primary": "#ffffff"
              },
              "spacing": { "section-margin": "2rem", "card-padding": "1.25rem", "safe-area-inset": "1rem", "stack-gap": "1rem" },
              "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
              "fontSize": {
                      "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                      "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "label-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500" }]
              }
      } } }
      </script>
<style>body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }</style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<main class="w-full max-w-[600px] flex flex-col px-safe-area-inset pt-section-margin pb-28">

<header class="flex items-center gap-3 mb-6">
<button class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../3-0. 홈/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface">식사 기록</h1>
</header>

<div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] mb-4">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-1">이번 달 총 식사</p>
<p class="font-headline-lg text-headline-lg text-on-surface mb-3"><span id="monthTotalCount">-</span><span class="font-body-md text-body-md text-on-surface-variant">회</span></p>
<div id="monthKindBar" class="w-full h-3 rounded-full overflow-hidden flex bg-surface-container mb-3"></div>
<div id="monthKindLegend" class="flex flex-wrap gap-x-4 gap-y-1 mb-3"></div>
<button type="button" class="w-full text-center font-label-sm text-label-sm text-primary py-1 border-t border-outline-variant pt-3" onclick="window.location.href='../8-3. 식비 예산/code.html'">이번 달 식비 예산 보기 →</button>
</div>

<div class="relative mb-4">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
<input id="searchInput" type="text" placeholder="메뉴로 검색 (예: 삼겹살)" class="w-full pl-10 pr-3 py-2.5 rounded-full border border-outline-variant font-body-md text-body-md bg-surface-container-lowest" oninput="renderRecords()">
</div>

<div id="recordList" class="flex flex-col gap-3"></div>

</main>

<!-- Bottom Tab Nav — 홈/내식탁/+(식사 만들기)/달력/기록. 냉장고·설정은 햄버거 메뉴로 이동(§리디자인 2026-08-19). -->
<nav class="fixed bottom-0 left-0 right-0 z-10 bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant" style="padding-bottom: env(safe-area-inset-bottom);">
<div class="max-w-[600px] mx-auto flex items-stretch">
<button class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-on-surface-variant" onclick="window.location.href='../3-0. 홈/code.html'">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">홈</span>
</button>
<button class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-on-surface-variant" onclick="window.location.href='../3-1. 내 식탁/code.html'">
<span class="material-symbols-outlined">table_restaurant</span>
<span class="font-label-sm text-label-sm">내 식탁</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-2.5" onclick="window.location.href='../3-2. 식사 만들기/code.html'" aria-label="식사 만들기">
<span class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined" style="font-size:20px;">add</span>
</span>
</button>
<button class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-on-surface-variant" onclick="window.location.href='../4-1. 홈 달력뷰/code.html'">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-sm text-label-sm">달력</span>
</button>
<button class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-label-sm text-label-sm">기록</span>
</button>
</div>
</nav>

<script>
    var householdId = null;
    var myMember = null;
    var RECORDS = []; // meals_vc2608 + 계산된 표시용 필드(date, dateKey, menus, count)

    var KIND_COLORS = { '집밥': '#7a6300', '외식': '#4a7a63', '배달': '#b8621f' };
    var WEEKDAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function formatRecordDate(dateStr) {
        var d = new Date(dateStr + 'T00:00:00');
        var label = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + (dateStr === todayKey() ? '오늘' : WEEKDAY_NAMES[d.getDay()]) + ')';
        return label;
    }

    var photosCache = [];
    async function loadPhotos() { photosCache = await API.mealPhotos.listByHousehold(householdId); }

    async function loadRecords() {
        var meals = await API.meals.listByHousehold(householdId);
        RECORDS = [];
        for (var i = 0; i < meals.length; i++) {
            var m = meals[i];
            var roster = await API.mealParticipants.getRoster(m.id);
            var attending = roster.filter(function (r) { return r.status === 'attending'; }).length;
            RECORDS.push({
                mealId: m.id, dateKey: m.date, date: formatRecordDate(m.date),
                menus: m.menu || [], kind: m.kind, count: attending
            });
        }
    }

    function renderMonthStats() {
        var thisMonth = todayKey().slice(0, 7); // YYYY-MM
        var monthRecords = RECORDS.filter(function (r) { return r.dateKey.slice(0, 7) === thisMonth; });
        document.getElementById('monthTotalCount').textContent = monthRecords.length;

        var countByKind = {};
        monthRecords.forEach(function (r) { countByKind[r.kind] = (countByKind[r.kind] || 0) + 1; });

        var bar = document.getElementById('monthKindBar');
        var legend = document.getElementById('monthKindLegend');
        bar.innerHTML = '';
        legend.innerHTML = '';
        var total = monthRecords.length;
        Object.keys(countByKind).forEach(function (kind) {
            var color = KIND_COLORS[kind] || '#8a8a8a';
            var seg = document.createElement('div');
            seg.className = 'h-full';
            seg.style.width = (total ? (countByKind[kind] / total * 100) : 0) + '%';
            seg.style.background = color;
            bar.appendChild(seg);

            var item = document.createElement('div');
            item.className = 'flex items-center gap-2';
            item.innerHTML = '<span class="w-2.5 h-2.5 rounded-full inline-block" style="background:' + color + ';"></span>' +
                '<span class="font-body-md text-body-md text-on-surface-variant">' + kind + ' <b class="text-on-surface">' + countByKind[kind] + '회</b></span>';
            legend.appendChild(item);
        });
        if (!total) {
            legend.innerHTML = '<p class="font-label-sm text-label-sm text-on-surface-variant">이번 달 기록이 아직 없어요</p>';
        }
    }

    function reuse(index) {
        var record = RECORDS[index];
        try {
            localStorage.setItem('reuse_meal', JSON.stringify({ menus: record.menus }));
        } catch (err) {}
        window.location.href = '../3-2. 식사 만들기/code.html';
    }

    function editCost(dateKey) {
        var costs = {};
        try { costs = JSON.parse(localStorage.getItem('meal_costs') || '{}'); } catch (err) {}
        var input = prompt('이 식사에 쓴 금액을 입력해주세요 (원)', costs[dateKey] || '');
        if (input === null) return;
        var value = parseInt(input.replace(/[^0-9]/g, ''), 10);
        if (isNaN(value)) return;
        costs[dateKey] = value;
        try { localStorage.setItem('meal_costs', JSON.stringify(costs)); } catch (err) {}
        renderRecords();
    }

    var RECORD_PREVIEW_COUNT = 5; // 기록이 쌓일수록 무한정 길어지지 않게 — 홈의 "더보기" 패턴과 동일
    var recordsExpanded = false;

    function renderRecords() {
        var query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        var costs = {};
        try { costs = JSON.parse(localStorage.getItem('meal_costs') || '{}'); } catch (err) {}
        var list = document.getElementById('recordList');
        list.innerHTML = '';

        var matching = [];
        RECORDS.forEach(function (record, index) {
            if (query && record.menus.join(' ').toLowerCase().indexOf(query) === -1) return;
            matching.push(index);
        });
        var visible = recordsExpanded ? matching : matching.slice(0, RECORD_PREVIEW_COUNT);

        visible.forEach(function (index) {
            var record = RECORDS[index];
            var photo = photosCache.find(function (p) { return p.meal_id === record.mealId; });
            var cost = costs[record.dateKey];
            var row = document.createElement('div');
            row.className = 'bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] flex gap-3';
            row.innerHTML =
                (photo ? '<img src="' + photo.photo_url + '" class="w-14 h-14 rounded-lg object-cover shrink-0">' : '') +
                '<div class="flex-1 min-w-0">' +
                '<div class="flex items-center justify-between mb-1">' +
                '<span class="font-body-md text-body-md text-on-surface font-medium">' + record.date + '</span>' +
                '<span class="font-label-sm text-label-sm text-on-surface-variant">참여 ' + record.count + '명</span>' +
                '</div>' +
                '<p class="font-label-sm text-label-sm text-on-surface-variant mb-1">' + record.menus.join(' · ') + '</p>' +
                (photo && photo.caption ? '<p class="font-label-sm text-label-sm text-on-surface-variant italic mb-2">"' + photo.caption + '"</p>' : '') +
                '<div class="flex items-center gap-3 mb-1">' +
                '<button type="button" class="cost-btn font-label-sm text-label-sm text-primary py-1">' + (cost ? cost.toLocaleString() + '원 · 수정' : '+ 비용 입력') + '</button>' +
                (cost ? '<button type="button" class="settle-btn font-label-sm text-label-sm text-primary py-1">정산하기 →</button>' : '') +
                '<button type="button" class="photo-btn font-label-sm text-label-sm text-primary py-1">' + (photo ? '사진 수정' : '+ 사진 남기기') + '</button>' +
                '</div>' +
                '<button type="button" class="w-full py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-sm text-label-sm mt-2">이 구성으로 새 식사 만들기</button>' +
                '</div>';
            row.querySelector('.cost-btn').addEventListener('click', function () { editCost(record.dateKey); });
            var settleBtn = row.querySelector('.settle-btn');
            if (settleBtn) { settleBtn.addEventListener('click', function () { window.location.href = '../8-4. 정산/code.html?date=' + record.dateKey; }); }
            row.querySelector('.photo-btn').addEventListener('click', function () { window.location.href = '../8-2. 식사 사진 기록/code.html?meal=' + record.mealId; });
            row.querySelector('.w-full.py-2.rounded-full').addEventListener('click', function () { reuse(index); });
            list.appendChild(row);
        });

        if (!matching.length) {
            var empty = document.createElement('p');
            empty.className = 'font-label-sm text-label-sm text-on-surface-variant text-center py-6';
            empty.textContent = '검색 결과가 없어요.';
            list.appendChild(empty);
        } else if (!recordsExpanded && matching.length > RECORD_PREVIEW_COUNT) {
            var moreBtn = document.createElement('button');
            moreBtn.type = 'button';
            moreBtn.className = 'w-full text-center font-label-sm text-label-sm text-primary py-1.5';
            moreBtn.textContent = '+ ' + (matching.length - RECORD_PREVIEW_COUNT) + '개 더보기';
            moreBtn.onclick = function () { recordsExpanded = true; renderRecords(); };
            list.appendChild(moreBtn);
        } else if (recordsExpanded && matching.length > RECORD_PREVIEW_COUNT) {
            var lessBtn = document.createElement('button');
            lessBtn.type = 'button';
            lessBtn.className = 'w-full text-center font-label-sm text-label-sm text-on-surface-variant py-1.5';
            lessBtn.textContent = '접기';
            lessBtn.onclick = function () { recordsExpanded = false; renderRecords(); };
            list.appendChild(lessBtn);
        }
    }
    (async function init() {
        await requireSession();
        myMember = await getMyMember();
        if (!myMember) { window.location.href = '../1-2. 온보딩-시작하기/code.html'; return; }
        householdId = myMember.household_id;

        await loadRecords();
        await loadPhotos();
        renderMonthStats();
        renderRecords();
    })();
</script>
</body></html>
