<script>
    var householdId = null;
    var myMember = null;
    var RECORDS = []; // meals_vc2608 + 계산된 표시용 필드(date, dateKey, menus, count)

    var KIND_COLORS = { '집밥': '#7a6300', '외식': '#4a7a63', '배달': '#b8621f' };
    var WEEKDAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function formatRecordDate(dateStr) {
        var d = new Date(dateStr + 'T00:00:00');
        var label = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + (dateStr === todayKey() ? '오늘' : WEEKDAY_NAMES[d.getDay()]) + ')';
        return label;
    }

    var photosCache = [];
    var menuImageCache = {}; // 메뉴 대표 이미지(menu name -> url) 캐시 — 실 사진 없을 때 대체용
    async function loadPhotos() { photosCache = await API.mealPhotos.listByHousehold(householdId); }

    // 실제 사진이 없는 식사의 대표 메뉴 이름으로 기본 이미지를 미리 조회(생성 API 연동 전엔 항상
    // null이라 결정론적 로컬 플레이스홀더로 대체됨 — foodPlaceholderHtml, shared/api.js).
    async function loadMenuImages() {
        var names = Array.from(new Set(RECORDS.map(function (r) { return r.menus && r.menus[0]; }).filter(Boolean)));
        for (var i = 0; i < names.length; i++) {
            if (menuImageCache[names[i]] !== undefined) continue;
            menuImageCache[names[i]] = await API.menuImages.get(names[i]);
        }
    }

    var menuCategoryCache = {}; // 대표 메뉴 이름 -> {food_group, cook_type, detail_tags} | null(카테고리 미등록)
    var CATEGORY_COLORS = ['#7a6300', '#4a7a63', '#b8621f', '#6b5aa8', '#a83a5a', '#3a7aa8', '#8a8a8a'];
    async function loadMenuCategories() {
        var names = Array.from(new Set(RECORDS.map(function (r) { return r.menus && r.menus[0]; }).filter(Boolean)));
        for (var i = 0; i < names.length; i++) {
            if (menuCategoryCache[names[i]] !== undefined) continue;
            menuCategoryCache[names[i]] = await API.menuCategories.get(names[i]);
        }
    }

    // 04_records.png 기준: 목록 사진을 훨씬 크게(w-28) — sizeClass로 다른 곳에서도 재사용 가능하게.
    // scale로 확대할 땐 반드시 overflow-hidden 틀로 감싸야 함(3-1에서 안 그래서 옆/아래로 번지던 버그 있었음).
    function recordThumbnailHtml(record, photo, sizeClass) {
        sizeClass = sizeClass || 'w-14 h-14';
        var src = photo ? photo.photo_url : null;
        if (!src) {
            var repName = record.menus && record.menus[0];
            src = repName ? menuImageCache[repName] : null;
        }
        if (src) return '<div class="' + sizeClass + ' rounded-lg overflow-hidden shrink-0"><img src="' + src + '" class="w-full h-full object-cover scale-125"></div>';
        return foodPlaceholderHtml(record.menus && record.menus[0], sizeClass + ' rounded-lg shrink-0');
    }

    async function loadRecords() {
        var meals = await API.meals.listByHousehold(householdId);
        RECORDS = [];
        for (var i = 0; i < meals.length; i++) {
            var m = meals[i];
            var roster = await API.mealParticipants.getRoster(m.id);
            var attendingRows = roster.filter(function (r) { return r.status === 'attending'; });
            RECORDS.push({
                mealId: m.id, dateKey: m.date, date: formatRecordDate(m.date),
                menus: m.menu || [], kind: m.kind, count: attendingRows.length,
                names: attendingRows.map(function (r) { return r.name; })
            });
        }
    }

    function renderMonthStats() {
        var thisMonth = todayKey().slice(0, 7); // YYYY-MM
        var monthRecords = RECORDS.filter(function (r) { return r.dateKey.slice(0, 7) === thisMonth; });

        document.getElementById('monthOverviewTitle').textContent = (parseInt(thisMonth.slice(5, 7), 10)) + '월 한눈에 보기';
        document.getElementById('statTotalCount').textContent = monthRecords.length;
        var avg = monthRecords.length ? (monthRecords.reduce(function (sum, r) { return sum + r.count; }, 0) / monthRecords.length) : 0;
        document.getElementById('statAvgCount').textContent = avg.toFixed(1);
        var menuCounts = {};
        monthRecords.forEach(function (r) { var rep = r.menus && r.menus[0]; if (rep) menuCounts[rep] = (menuCounts[rep] || 0) + 1; });
        var topMenu = Object.keys(menuCounts).sort(function (a, b) { return menuCounts[b] - menuCounts[a]; })[0];
        document.getElementById('statTopMenu').textContent = topMenu || '-';

        var countByKind = {};
        monthRecords.forEach(function (r) { countByKind[r.kind] = (countByKind[r.kind] || 0) + 1; });

        var bar = document.getElementById('monthKindBar');
        var legend = document.getElementById('monthKindLegend');
        bar.innerHTML = '';
        legend.innerHTML = '';
        var total = monthRecords.length;
        Object.keys(countByKind).forEach(function (kind) {
            var color = KIND_COLORS[kind] || '#8a8a8a';
            var seg = document.createElement('div');
            seg.className = 'h-full';
            seg.style.width = (total ? (countByKind[kind] / total * 100) : 0) + '%';
            seg.style.background = color;
            bar.appendChild(seg);

            var item = document.createElement('div');
            item.className = 'flex items-center gap-2';
            item.innerHTML = '<span class="w-2.5 h-2.5 rounded-full inline-block" style="background:' + color + ';"></span>' +
                '<span class="font-body-md text-body-md text-on-surface-variant">' + kind + ' <b class="text-on-surface">' + countByKind[kind] + '회</b></span>';
            legend.appendChild(item);
        });
        if (!total) {
            legend.innerHTML = '<p class="font-label-sm text-label-sm text-on-surface-variant">이번 달 기록이 아직 없어요</p>';
        }

        // 음식군 집계: 대표 메뉴에 카테고리가 등록된 기록만 집계(카테고리 없는 메뉴는 그냥 빠짐).
        var countByGroup = {};
        var groupTotal = 0;
        monthRecords.forEach(function (r) {
            var repName = r.menus && r.menus[0];
            var cat = repName ? menuCategoryCache[repName] : null;
            if (cat && cat.food_group) { countByGroup[cat.food_group] = (countByGroup[cat.food_group] || 0) + 1; groupTotal++; }
        });
        var catSection = document.getElementById('monthCategorySection');
        var catLegend = document.getElementById('monthCategoryLegend');
        catSection.classList.toggle('hidden', groupTotal === 0);
        if (groupTotal > 0) {
            catLegend.innerHTML = '';
            Object.keys(countByGroup).sort(function (a, b) { return countByGroup[b] - countByGroup[a]; }).forEach(function (group, i) {
                var color = CATEGORY_COLORS[i % CATEGORY_COLORS.length];
                var item = document.createElement('div');
                item.className = 'flex items-center gap-2';
                item.innerHTML = '<span class="w-2.5 h-2.5 rounded-full inline-block" style="background:' + color + ';"></span>' +
                    '<span class="font-body-md text-body-md text-on-surface-variant">' + group + ' <b class="text-on-surface">' + countByGroup[group] + '회</b></span>';
                catLegend.appendChild(item);
            });
        }
    }

    function reuse(index) {
        var record = RECORDS[index];
        try {
            localStorage.setItem('reuse_meal', JSON.stringify({ menus: record.menus }));
        } catch (err) {}
        window.location.href = '../3-2. 식사 만들기/code.html';
    }

    function editCost(dateKey) {
        var costs = {};
        try { costs = JSON.parse(localStorage.getItem('meal_costs') || '{}'); } catch (err) {}
        var input = prompt('이 식사에 쓴 금액을 입력해주세요 (원)', costs[dateKey] || '');
        if (input === null) return;
        var value = parseInt(input.replace(/[^0-9]/g, ''), 10);
        if (isNaN(value)) return;
        costs[dateKey] = value;
        try { localStorage.setItem('meal_costs', JSON.stringify(costs)); } catch (err) {}
        renderRecords();
    }

    var RECORD_PREVIEW_COUNT = 5; // 기록이 쌓일수록 무한정 길어지지 않게 — 홈의 "더보기" 패턴과 동일
    var recordsExpanded = false;

    function renderRecords() {
        var query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        var costs = {};
        try { costs = JSON.parse(localStorage.getItem('meal_costs') || '{}'); } catch (err) {}
        var list = document.getElementById('recordList');
        list.innerHTML = '';

        var matching = [];
        RECORDS.forEach(function (record, index) {
            if (query && record.menus.join(' ').toLowerCase().indexOf(query) === -1) return;
            matching.push(index);
        });
        var visible = recordsExpanded ? matching : matching.slice(0, RECORD_PREVIEW_COUNT);

        // 04_records.png 기준: 달력 아이콘+날짜 헤더, 큰 사진(좌)+메뉴/인원/참여자 이름(우),
        // "같은 구성으로 만들기" 버튼. 비용 입력/정산/사진 남기기는 참고 이미지엔 없지만 실제
        // 기능이라 지우지 않고 펼치기(토글) 뒤로 옮김 — 기본은 참고 이미지처럼 깔끔하게.
        visible.forEach(function (index) {
            var record = RECORDS[index];
            var photo = photosCache.find(function (p) { return p.meal_id === record.mealId; });
            var cost = costs[record.dateKey];
            var row = document.createElement('article');
            row.className = 'bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)]';
            var menuLine = record.menus.length ? record.menus.slice(0, 2).join(', ') : '메뉴 미정';
            var namesLine = record.names && record.names.length ? record.names.join('  ') : '';
            row.innerHTML =
                '<div class="flex items-center justify-between mb-3">' +
                    '<span class="flex items-center gap-1.5 font-body-md text-body-md text-on-surface font-medium"><span class="material-symbols-outlined text-primary text-[18px]">calendar_today</span>' + record.date + '</span>' +
                    '<button type="button" class="toggle-actions-btn w-8 h-8 flex items-center justify-center text-on-surface-variant" aria-label="더보기"><span class="material-symbols-outlined">expand_more</span></button>' +
                '</div>' +
                '<div class="flex gap-3 mb-3">' +
                    recordThumbnailHtml(record, photo, 'w-28 h-28') +
                    '<div class="flex-1 min-w-0 flex flex-col justify-center">' +
                        '<h3 class="font-headline-lg text-headline-lg text-on-surface font-bold mb-1 truncate">' + menuLine + '</h3>' +
                        '<p class="font-body-md text-body-md text-primary font-semibold mb-1">' + record.count + '명</p>' +
                        (namesLine ? '<p class="font-label-sm text-label-sm text-on-surface-variant" style="word-break:keep-all;">' + namesLine + '</p>' : '') +
                        (photo && photo.caption ? '<p class="font-label-sm text-label-sm text-on-surface-variant italic mt-1">"' + photo.caption + '"</p>' : '') +
                    '</div>' +
                '</div>' +
                '<button type="button" class="reuse-btn w-full py-2.5 rounded-full border-2 border-primary text-primary font-label-sm text-label-sm">같은 구성으로 만들기</button>' +
                '<div class="extra-actions hidden mt-3 pt-3 border-t border-outline-variant flex items-center gap-3">' +
                    '<button type="button" class="cost-btn font-label-sm text-label-sm text-primary py-1">' + (cost ? cost.toLocaleString() + '원 · 수정' : '+ 비용 입력') + '</button>' +
                    (cost ? '<button type="button" class="settle-btn font-label-sm text-label-sm text-primary py-1">정산하기 →</button>' : '') +
                    '<button type="button" class="photo-btn font-label-sm text-label-sm text-primary py-1">' + (photo ? '사진 수정' : '+ 사진 남기기') + '</button>' +
                '</div>';
            row.querySelector('.toggle-actions-btn').onclick = function () {
                var extra = row.querySelector('.extra-actions');
                var icon = row.querySelector('.toggle-actions-btn .material-symbols-outlined');
                var open = extra.classList.toggle('hidden');
                icon.textContent = open ? 'expand_more' : 'expand_less';
            };
            row.querySelector('.cost-btn').addEventListener('click', function () { editCost(record.dateKey); });
            var settleBtn = row.querySelector('.settle-btn');
            if (settleBtn) { settleBtn.addEventListener('click', function () { window.location.href = '../8-4. 정산/code.html?date=' + record.dateKey; }); }
            row.querySelector('.photo-btn').addEventListener('click', function () { window.location.href = '../8-2. 식사 사진 기록/code.html?meal=' + record.mealId; });
            row.querySelector('.reuse-btn').addEventListener('click', function () { reuse(index); });
            list.appendChild(row);
        });

        if (!matching.length) {
            var empty = document.createElement('p');
            empty.className = 'font-label-sm text-label-sm text-on-surface-variant text-center py-6';
            empty.textContent = '검색 결과가 없어요.';
            list.appendChild(empty);
        } else if (!recordsExpanded && matching.length > RECORD_PREVIEW_COUNT) {
            var moreBtn = document.createElement('button');
            moreBtn.type = 'button';
            moreBtn.className = 'w-full text-center font-label-sm text-label-sm text-primary py-1.5';
            moreBtn.textContent = '+ ' + (matching.length - RECORD_PREVIEW_COUNT) + '개 더보기';
            moreBtn.onclick = function () { recordsExpanded = true; renderRecords(); };
            list.appendChild(moreBtn);
        } else if (recordsExpanded && matching.length > RECORD_PREVIEW_COUNT) {
            var lessBtn = document.createElement('button');
            lessBtn.type = 'button';
            lessBtn.className = 'w-full text-center font-label-sm text-label-sm text-on-surface-variant py-1.5';
            lessBtn.textContent = '접기';
            lessBtn.onclick = function () { recordsExpanded = false; renderRecords(); };
            list.appendChild(lessBtn);
        }
    }
    (async function init() {
        await requireSession();
        myMember = await getMyMember();
        if (!myMember) { window.location.href = '../1-2. 온보딩-시작하기/code.html'; return; }
        householdId = myMember.household_id;

        await loadRecords();
        await loadPhotos();
        await loadMenuImages();
        await loadMenuCategories();
        renderMonthStats();
        renderRecords();
    })();
</script>
</body></html>
