<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>우리집식당 - 요일별 기본 응답</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
              "colors": {
                      "surface": "#fbf9f8", "surface-container-lowest": "#ffffff", "surface-container": "#f0eded",
                      "on-surface": "#1b1c1c", "on-surface-variant": "#45474a", "outline-variant": "#c6c6ca",
                      "primary": "#5d5e62", "on-primary": "#ffffff"
              },
              "spacing": { "section-margin": "2rem", "card-padding": "1.25rem", "safe-area-inset": "1rem", "stack-gap": "1rem" },
              "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
              "fontSize": {
                      "headline-lg": ["23px", { "lineHeight": "30px", "fontWeight": "600" }],
                      "body-md": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                      "label-sm": ["15px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }]
              }
      } } }
      </script>
<style>body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    /* 애플 디자인 원칙: 눌림 피드백은 즉시, 정지는 스프링형(임계감쇠)으로 — WWDC "Designing Fluid Interfaces" */
    .active\:scale-95:active, .active\:scale-\[0\.98\]:active, .active\:scale-\[0\.95\]:active {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 120ms !important;
    }
    .active\:scale-95, .active\:scale-\[0\.98\], .active\:scale-\[0\.95\] {
      transition-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1) !important;
      transition-duration: 180ms !important;
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<main class="w-full max-w-[600px] flex flex-col px-safe-area-inset py-section-margin">

<header class="flex items-center gap-3 mb-6">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../3-0. 홈/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface">요일별 기본 응답</h1>
</header>

<p class="font-body-md text-body-md text-on-surface-variant mb-4">구성원마다 요일별 기본 참여 여부를 미리 정해두면, 식사를 만들 때 예상 인원에 자동 반영돼요.</p>

<div class="bg-surface-container-lowest rounded-xl p-card-padding shadow-[0px_4px_12px_rgba(120,119,119,0.08)] overflow-x-auto mb-4">
<table class="w-full text-center min-w-[500px]">
<thead>
<tr class="font-label-sm text-label-sm text-on-surface-variant">
<th class="text-left pb-2">이름</th>
<th class="pb-2">월</th><th class="pb-2">화</th><th class="pb-2">수</th><th class="pb-2">목</th><th class="pb-2">금</th><th class="pb-2">토</th><th class="pb-2">일</th>
<th class="pb-2">저장</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<p class="font-label-sm text-label-sm text-on-surface-variant mb-4">각 행의 "저장" 버튼으로 사람마다 따로 저장해요 · 남의 행을 바꾸면 한 번 물어봐요</p>

<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-label-sm text-[15px] py-3 rounded-full active:scale-[0.98] transition-transform" onclick="window.location.href='../5-1. 가구 설정/code.html'">닫기</button>

</main>

<script>
    var householdId = null;
    var myMember = null;
    var DAYS = ['월', '화', '수', '목', '금', '토', '일']; // day_index 0=월 ... 6=일

    // 각자 자기 응답을 각자 저장 — 한 사람이 "저장" 누르면 전원 데이터가 통째로 덮이던 문제를 없앰(§멤버별 upsert 키라 실제로도 서로 안 겹침).
    function cycle(state) {
        if (state === 'attending') return 'absent';
        if (state === 'absent') return null; // 미정(행 삭제)
        return 'attending';
    }
    function stateLabel(state) {
        return state === 'attending' ? '참여' : state === 'absent' ? '안먹음' : '미정';
    }
    function stateColor(state) {
        return state === 'attending' ? '#8a9a7b' : state === 'absent' ? '#cabfe0' : '#ded3ef';
    }

    async function renderTable() {
        var members = await API.members.list(householdId);
        var rows = await API.weekdayDefaults.list(householdId);

        var body = document.getElementById('tableBody');
        body.innerHTML = '';

        members.filter(function (m) { return m.role !== 'guest'; }).forEach(function (member) {
            var isMine = member.id === myMember.id;
            var defaults = DAYS.map(function (_, di) {
                var row = rows.find(function (r) { return r.member_id === member.id && r.day_index === di; });
                return row ? row.status : null;
            });

            var tr = document.createElement('tr');
            if (isMine) { tr.className = 'bg-surface-container'; }
            var nameCell = document.createElement('td');
            nameCell.className = 'text-left py-2';
            nameCell.innerHTML = '<span class="inline-flex items-center gap-2"><span class="w-6 h-6 rounded-full flex items-center justify-center text-on-primary font-label-sm text-label-sm" style="background:' + (member.color || '#8a9a7b') + '">' + member.name.charAt(0) + '</span>' + member.name + (isMine ? ' (나)' : '') + '</span>';
            tr.appendChild(nameCell);

            defaults.forEach(function (state, di) {
                var cell = document.createElement('td');
                cell.className = 'py-2';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-12 h-12 rounded-full font-label-sm text-[11px] text-on-surface';
                btn.style.background = stateColor(state);
                btn.textContent = stateLabel(state);
                btn.onclick = function () {
                    // 남의 행을 바꾸는 거면 한 번 확인 — 가족이라 다 같이 수정 가능은 유지하되, 실수로 남의 응답을 건드리지 않게.
                    if (!isMine && !confirm(member.name + '님의 응답인데 수정해도 괜찮아요?')) { return; }
                    defaults[di] = cycle(defaults[di]);
                    btn.style.background = stateColor(defaults[di]);
                    btn.textContent = stateLabel(defaults[di]);
                };
                cell.appendChild(btn);
                tr.appendChild(cell);
            });

            // 사람마다 각각 저장 — 한 사람 저장이 다른 사람 행에 영향 없음.
            var saveCell = document.createElement('td');
            saveCell.className = 'py-2';
            var saveBtn = document.createElement('button');
            saveBtn.type = 'button';
            saveBtn.className = 'px-3 py-1.5 rounded-full bg-primary text-on-primary font-label-sm text-label-sm';
            saveBtn.textContent = '저장';
            saveBtn.onclick = async function () {
                saveBtn.disabled = true;
                try {
                    await Promise.all(defaults.map(function (state, di) {
                        return state ? API.weekdayDefaults.upsert(householdId, member.id, di, state) : API.weekdayDefaults.remove(member.id, di);
                    }));
                    saveBtn.textContent = '저장됨';
                } catch (err) {
                    saveBtn.textContent = '저장 실패 · 다시';
                } finally {
                    saveBtn.disabled = false;
                    setTimeout(function () { saveBtn.textContent = '저장'; }, 1200);
                }
            };
            saveCell.appendChild(saveBtn);
            tr.appendChild(saveCell);

            body.appendChild(tr);
        });
    }

    (async function init() {
        await requireSession();
        myMember = await getMyMember();
        if (!myMember) { window.location.href = '../1-2. 온보딩-시작하기/code.html'; return; }
        householdId = myMember.household_id;
        await renderTable();
    })();
</script>
</body></html>
