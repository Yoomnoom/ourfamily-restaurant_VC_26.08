<script>
    var toastTimer;
    function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        toast.classList.add('opacity-100');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 2600);
    }

    var AVATAR_COLORS = ['#8a9a7b', '#9b8ab5', '#c98a5a', '#5f8fa3', '#b57a7a', '#a3945f'];
    var menus = [];
    var participants = [];
    var mealType = 'home';
    var colorIndex = 0;

    function nextColor() { var c = AVATAR_COLORS[colorIndex % AVATAR_COLORS.length]; colorIndex++; return c; }
    function initials(name) { return (name || '?').trim().charAt(0) || '?'; }

    var DAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];
    var repeatDays = [];

    function toggleRepeatDays() {
        var on = document.getElementById('repeatToggle').checked;
        document.getElementById('repeatDaysRow').classList.toggle('hidden', !on);
        if (on && !repeatDays.length) {
            var dateVal = document.getElementById('mealDate').value;
            var d = dateVal ? new Date(dateVal + 'T00:00:00').getDay() : new Date().getDay();
            repeatDays = [d];
        }
        renderRepeatDays();
    }

    function toggleRepeatDay(day) {
        var idx = repeatDays.indexOf(day);
        if (idx === -1) repeatDays.push(day); else repeatDays.splice(idx, 1);
        renderRepeatDays();
    }

    function renderRepeatDays() {
        var row = document.getElementById('repeatDaysRow');
        row.innerHTML = '';
        DAY_LABELS.forEach(function (label, day) {
            var active = repeatDays.indexOf(day) !== -1;
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'w-9 h-9 rounded-full font-label-sm text-label-sm ' + (active ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface-variant');
            btn.textContent = label;
            btn.onclick = function () { toggleRepeatDay(day); };
            row.appendChild(btn);
        });
    }

    var recurringRulesCache = [];

    async function renderActiveRules() {
        recurringRulesCache = await API.recurringMeals.list(myMember.household_id);
        var rules = recurringRulesCache;
        var wrap = document.getElementById('activeRulesWrap');
        var list = document.getElementById('activeRulesList');
        list.innerHTML = '';
        if (!rules.length) { wrap.classList.add('hidden'); return; }
        wrap.classList.remove('hidden');
        rules.forEach(function (rule) {
            var dayText = rule.days.map(function (d) { return DAY_LABELS[d]; }).join('·');
            var row = document.createElement('div');
            row.className = 'flex items-center gap-2 bg-surface-container rounded-lg px-3 py-2';
            row.innerHTML = '<span class="font-label-sm text-label-sm text-on-surface flex-1">매주 ' + dayText + '요일 ' + (rule.time || '시간 미정') + ' · ' + (rule.menus.join(' · ') || '메뉴 미정') + '</span>';
            var delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'font-label-sm text-label-sm text-error';
            delBtn.textContent = '삭제';
            delBtn.onclick = function () { deleteRule(rule.id); };
            row.appendChild(delBtn);
            list.appendChild(row);
        });
    }

    var activePoll = null;

    // 뭐 먹을지 고민될 때, 정하는 대신 가족에게 골라달라고 물어보기(3-0 홈에서 투표).
    async function startMenuPoll() {
        if (menus.length < 2) { showToast('후보 메뉴를 2개 이상 넣어주세요'); return; }
        await API.menuPoll.start(myMember.household_id, menus.map(function (m) { return m.name; }));
        menus = [];
        renderMenus();
        await renderActivePoll();
        showToast('가족에게 물어봤어요 · 홈에서 고를 수 있어요');
    }

    async function cancelMenuPoll() {
        if (activePoll) await API.menuPoll.cancel(activePoll.id);
        await renderActivePoll();
    }

    async function finalizePoll(name) {
        addMenu(name);
        if (activePoll) await API.menuPoll.cancel(activePoll.id);
        await renderActivePoll();
        showToast(name + '(으)로 정했어요');
    }

    async function renderActivePoll() {
        activePoll = await API.menuPoll.get(myMember.household_id);
        var poll = activePoll;
        var wrap = document.getElementById('activePollWrap');
        if (!poll) { wrap.classList.add('hidden'); return; }
        wrap.classList.remove('hidden');

        var list = document.getElementById('pollTallyList');
        list.innerHTML = '';
        var voteValues = Object.keys(poll.votes || {}).map(function (voter) { return poll.votes[voter]; });
        poll.options.forEach(function (name) {
            var count = voteValues.filter(function (v) { return v === name; }).length;
            var row = document.createElement('div');
            row.className = 'flex items-center gap-2 bg-surface-container rounded-lg px-3 py-2';
            row.innerHTML = '<span class="font-body-md text-body-md text-on-surface flex-1">' + name + '</span>' +
                '<span class="font-label-sm text-label-sm text-on-surface-variant">' + count + '표</span>';
            var pickBtn = document.createElement('button');
            pickBtn.type = 'button';
            pickBtn.className = 'font-label-sm text-label-sm text-primary';
            pickBtn.textContent = '확정하기';
            pickBtn.onclick = function () { finalizePoll(name); };
            row.appendChild(pickBtn);
            list.appendChild(row);
        });
    }

    async function deleteRule(id) {
        await API.recurringMeals.remove(id);
        await renderActiveRules();
        showToast('반복 일정을 삭제했어요');
    }

    // 가족이 3-0(홈)에서 미리 답해둔 것/요일별 기본값 — 캐시해두고 날짜 바뀔 때마다 재적용.
    var advanceAnswersCache = [];
    var weekdayDefaultsCache = [];

    function onDateChanged() {
        if (document.getElementById('repeatToggle').checked && repeatDays.length === 1) {
            var dateVal = document.getElementById('mealDate').value;
            if (dateVal) repeatDays = [new Date(dateVal + 'T00:00:00').getDay()];
            renderRepeatDays();
        }
        applyAdvanceAnswers();
        renderParticipants();
    }

    // 이 날짜에 "미리 안 먹어요"라고 답해둔 사람은 물어볼 목록에서 자동으로 체크 해제.
    // member_id 기준으로 매칭(이름 substring 매칭은 동명이인·"(나)" 접미사 등으로 불안정했던 부분 수정).
    function applyAdvanceAnswers() {
        var mealDate = document.getElementById('mealDate').value;
        if (!mealDate) return;
        var advance = advanceAnswersCache.filter(function (a) { return a.date === mealDate; });
        var jsDay = new Date(mealDate + 'T00:00:00').getDay();
        var weekdayIdx = (jsDay + 6) % 7; // 0=월 ... 6=일, 5-4의 DAYS 순서와 동일

        participants.forEach(function (p) {
            if (!p.memberId) return; // 즉석 손님은 미리답변/요일기본값 대상 아님
            var exact = advance.find(function (a) { return a.member_id === p.memberId; });
            if (exact) { p.checked = exact.status === 'attending'; return; }
            var wd = weekdayDefaultsCache.find(function (w) { return w.member_id === p.memberId && w.day_index === weekdayIdx; });
            if (wd) { p.checked = wd.status === 'attending'; }
        });
    }

    function toggleTimeInput() {
        var undecided = document.getElementById('timeUndecided').checked;
        var timeInput = document.getElementById('mealTime');
        timeInput.disabled = undecided;
        timeInput.classList.toggle('opacity-40', undecided);
    }

    function addMenu(name) {
        if (!name) return;
        menus.push({ id: 'menu' + Date.now() + Math.random().toString(36).slice(2, 5), name: name });
        renderMenus();
    }
    function addMenuFromInput() {
        var input = document.getElementById('menuInput');
        var value = input.value.trim();
        if (!value) return;
        addMenu(value);
        input.value = '';
    }
    function removeMenu(id) { menus = menus.filter(function (m) { return m.id !== id; }); renderMenus(); }

    // 드래그 재정렬은 터치 화면에서 잘 안 먹으니, 탭 한 번으로 대표를 바꾸는 버튼을 기본 수단으로 둠.
    function makeRepresentative(id) {
        var index = menus.findIndex(function (m) { return m.id === id; });
        if (index <= 0) return;
        var moved = menus.splice(index, 1)[0];
        menus.unshift(moved);
        renderMenus();
        showToast(moved.name + '(을)를 대표 메뉴로 정했어요');
    }

    var dragSrcIndex = null;
    function renderMenus() {
        var list = document.getElementById('menuList');
        list.innerHTML = '';
        menus.forEach(function (menu, index) {
            var row = document.createElement('div');
            row.className = 'menu-tag flex items-center gap-2 bg-surface-container rounded-lg px-3 py-2';
            row.draggable = true;
            row.addEventListener('dragstart', function () { dragSrcIndex = index; row.classList.add('dragging'); });
            row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
            row.addEventListener('dragover', function (e) { e.preventDefault(); });
            row.addEventListener('drop', function (e) {
                e.preventDefault();
                if (dragSrcIndex === null || dragSrcIndex === index) return;
                var moved = menus.splice(dragSrcIndex, 1)[0];
                menus.splice(index, 0, moved);
                dragSrcIndex = null;
                renderMenus();
            });

            var handle = document.createElement('span');
            handle.className = 'material-symbols-outlined text-outline text-[18px]';
            handle.textContent = 'drag_indicator';
            row.appendChild(handle);

            if (index === 0) {
                var badge = document.createElement('span');
                badge.className = 'font-label-sm text-label-sm bg-tertiary-container text-on-tertiary-container px-2 py-0.5 rounded-full shrink-0';
                badge.textContent = '대표';
                row.appendChild(badge);
            }

            var nameEl = document.createElement('span');
            nameEl.className = 'font-body-md text-body-md text-on-surface flex-1';
            nameEl.textContent = menu.name;
            row.appendChild(nameEl);

            if (index !== 0) {
                var makeRepBtn = document.createElement('button');
                makeRepBtn.type = 'button';
                makeRepBtn.className = 'font-label-sm text-label-sm text-primary shrink-0';
                makeRepBtn.textContent = '대표로';
                makeRepBtn.onclick = function () { makeRepresentative(menu.id); };
                row.appendChild(makeRepBtn);
            }

            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'w-6 h-6 flex items-center justify-center text-on-surface-variant shrink-0';
            removeBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">close</span>';
            removeBtn.onclick = function () { removeMenu(menu.id); };
            row.appendChild(removeBtn);

            list.appendChild(row);
        });
    }

    var MENU_PLACEHOLDER = {
        home: '메뉴를 입력하세요 (예: 김치찌개)',
        eatout: '식당 · 메뉴를 입력하세요 (예: OO파스타집)',
        delivery: '메뉴를 입력하세요 (예: 후라이드 치킨)'
    };

    function selectMealType(type) {
        mealType = type;
        document.querySelectorAll('.meal-type-chip').forEach(function (chip) {
            var active = chip.getAttribute('data-type') === type;
            chip.classList.toggle('bg-primary', active);
            chip.classList.toggle('text-on-primary', active);
            chip.classList.toggle('bg-surface-container-lowest', !active);
            chip.classList.toggle('text-on-surface-variant', !active);
            chip.classList.toggle('shadow-[0px_4px_12px_rgba(120,119,119,0.08)]', true);
        });

        document.getElementById('homeOnlyMenuTools').classList.toggle('hidden', type !== 'home');
        document.getElementById('eatoutMenuTools').classList.toggle('hidden', type === 'home');
        document.getElementById('menuInput').placeholder = MENU_PLACEHOLDER[type] || MENU_PLACEHOLDER.home;
        if (type !== 'home') { renderFrequentPlaces(); renderRecommendedPlaces(); }
    }

    // 외식·배달일 땐 자주 가는 곳/추천 장소를 바로 고를 수 있게 — 집밥의 "저장된 메뉴" 패턴과 동일.
    var RECOMMENDED_PLACES = ['우리동네 김밥천국', '정든 순대국', '새로 생긴 딤섬집', '단골 치킨집'];

    var frequentPlacesCache = [];

    async function renderFrequentPlaces() {
        var row = document.getElementById('frequentPlacesRow');
        frequentPlacesCache = await API.savedPlaces.list(myMember.household_id);
        var places = frequentPlacesCache.map(function (p) { return p.name; });
        row.innerHTML = '';
        if (!places.length) {
            var empty = document.createElement('p');
            empty.className = 'font-label-sm text-label-sm text-on-surface-variant';
            empty.textContent = '아직 없어요 · 식당을 넣고 만들면 다음부터 여기 나와요';
            row.appendChild(empty);
            return;
        }
        places.forEach(function (name) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm';
            btn.textContent = name;
            btn.onclick = function () { addMenu(name); };
            row.appendChild(btn);
        });
    }

    function renderRecommendedPlaces() {
        var row = document.getElementById('recommendedPlacesRow');
        row.innerHTML = '';
        RECOMMENDED_PLACES.forEach(function (name) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'px-3 py-1.5 rounded-full bg-tertiary-container text-on-tertiary-container font-label-sm text-label-sm';
            btn.textContent = name;
            btn.onclick = function () { addMenu(name); };
            row.appendChild(btn);
        });
    }

    function addParticipant(name, color, checked, removable, memberId) {
        participants.push({
            id: 'p' + Date.now() + Math.random().toString(36).slice(2, 5),
            memberId: memberId || null,
            name: name,
            color: color || nextColor(),
            checked: checked !== false,
            removable: !!removable
        });
        renderParticipants();
    }
    function toggleParticipant(id) {
        var p = participants.find(function (x) { return x.id === id; });
        if (p) p.checked = !p.checked;
        renderParticipants();
    }
    function removeParticipant(id) { participants = participants.filter(function (p) { return p.id !== id; }); renderParticipants(); }
    function addGuestFromInput() {
        var input = document.getElementById('guestInput');
        var value = input.value.trim();
        if (!value) return;
        addParticipant(value, null, true, true);
        input.value = '';
    }

    function addSavedGuest(name, btn) {
        addParticipant(name, null, true, true);
        btn.remove();
    }

    async function renderSavedGuests() {
        var guests = await API.savedGuests.list(myMember.household_id);
        var row = document.getElementById('savedGuestsRow');
        if (!guests.length) { row.classList.add('hidden'); return; }
        row.classList.remove('hidden');
        row.classList.add('flex');
        row.innerHTML = '';
        var label = document.createElement('span');
        label.className = 'w-full font-label-sm text-label-sm text-on-surface-variant';
        label.textContent = '저장된 손님에서 선택';
        row.appendChild(label);
        guests.forEach(function (g) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm';
            btn.textContent = g.name;
            btn.onclick = function () { addSavedGuest(g.name, btn); };
            row.appendChild(btn);
        });
    }

    function renderParticipants() {
        var list = document.getElementById('participantList');
        list.innerHTML = '';
        var mealDate = document.getElementById('mealDate').value;
        var advance = mealDate ? advanceAnswersCache.filter(function (a) { return a.date === mealDate; }) : [];

        participants.forEach(function (p) {
            var row = document.createElement('div');
            row.className = 'flex items-center gap-2.5';

            var avatar = document.createElement('span');
            avatar.className = 'w-7 h-7 rounded-full flex items-center justify-center text-on-primary font-label-sm text-label-sm shrink-0';
            avatar.style.backgroundColor = p.color;
            avatar.textContent = initials(p.name);
            row.appendChild(avatar);

            var nameWrap = document.createElement('span');
            nameWrap.className = 'flex-1 flex flex-col';
            var nameEl = document.createElement('span');
            nameEl.className = 'font-body-md text-body-md text-on-surface';
            nameEl.textContent = p.name;
            nameWrap.appendChild(nameEl);

            var pre = p.memberId ? advance.find(function (a) { return a.member_id === p.memberId; }) : null;
            if (pre) {
                var preEl = document.createElement('span');
                preEl.className = 'font-label-sm text-label-sm ' + (pre.status === 'attending' ? 'text-primary' : 'text-on-surface-variant');
                preEl.textContent = pre.status === 'attending' ? '✓ 미리 먹는다고 했어요' : '✓ 미리 안 먹는다고 했어요 · 안 물어봐도 돼요';
                nameWrap.appendChild(preEl);
            }
            row.appendChild(nameWrap);

            var checkBtn = document.createElement('button');
            checkBtn.type = 'button';
            checkBtn.className = 'w-6 h-6 rounded-full border flex items-center justify-center shrink-0 ' + (p.checked ? 'bg-primary border-primary' : 'border-outline-variant');
            checkBtn.innerHTML = p.checked ? '<span class="material-symbols-outlined text-[16px] text-on-primary">check</span>' : '';
            checkBtn.onclick = function () { toggleParticipant(p.id); };
            row.appendChild(checkBtn);

            if (p.removable) {
                var removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'w-6 h-6 flex items-center justify-center text-on-surface-variant shrink-0';
                removeBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">close</span>';
                removeBtn.onclick = function () { removeParticipant(p.id); };
                row.appendChild(removeBtn);
            }

            list.appendChild(row);
        });
    }

    var KIND_LABELS = { home: '집밥', eatout: '외식', delivery: '배달' };
    var KIND_KEYS = { '집밥': 'home', '외식': 'eatout', '배달': 'delivery' };

    var submitBtn = document.getElementById('submitBtn');

    async function createMeal() {
        var date = document.getElementById('mealDate').value;
        if (!date) { showToast('식사 날짜를 선택해주세요.'); return; }
        var attending = participants.filter(function (p) { return p.checked; });
        if (attending.length === 0) { showToast('최소 1명 이상 물어볼 사람을 선택해주세요.'); return; }

        submitBtn.disabled = true;
        try {
            if (mealType !== 'home') {
                for (var i = 0; i < menus.length; i++) await API.savedPlaces.add(myMember.household_id, menus[i].name);
            }

            var mealFields = {
                date: date,
                time: document.getElementById('timeUndecided').checked ? null : document.getElementById('mealTime').value,
                kind: KIND_LABELS[mealType] || mealType,
                menu: menus.map(function (m) { return m.name; })
            };

            // 즉석 손님(memberId 아직 없음)은 이 시점에 무가입 구성원으로 실제 등록
            for (var j = 0; j < attending.length; j++) {
                if (!attending[j].memberId) {
                    var guestMember = await API.members.addGuestMember(myMember.household_id, attending[j].name);
                    attending[j].memberId = guestMember.id;
                }
            }
            var memberIds = attending.map(function (p) { return p.memberId; });

            if (isEditMode) {
                await API.meals.update(editMealId, mealFields);
                await API.mealParticipants.syncParticipants(editMealId, memberIds);
                window.location.href = '../3-1. 내 식탁/code.html?edited=1';
                return;
            }

            var meal = await API.meals.create(myMember.household_id, mealFields);
            var issued = await API.mealParticipants.bulkCreateWithTokens(meal.id, memberIds);
            // 토큰 원본은 DB에 해시로만 남고 지금 이 응답에만 존재 — 3-8(링크 공유)이 방금 만든
            // 식사를 열었을 때 바로 보여줄 수 있게 이 세션에서만 잠깐 들고 넘어감.
            try {
                localStorage.setItem('fresh_links_' + meal.id, JSON.stringify(
                    issued.map(function (x) { return { memberId: x.memberId, token: x.token }; })
                ));
            } catch (err) {}

            if (document.getElementById('repeatToggle').checked && repeatDays.length) {
                await API.recurringMeals.add(myMember.household_id, {
                    days: repeatDays.slice(),
                    time: mealFields.time,
                    kind: mealFields.kind,
                    menu: mealFields.menu,
                    participantMemberIds: memberIds
                });
            }

            window.location.href = '../3-8. 참여자 링크 공유/code.html?meal=' + meal.id;
        } catch (err) {
            submitBtn.disabled = false;
            showToast('저장에 실패했어요: ' + err.message);
        }
    }

    var isEditMode = false;
    var editMealId = null;
    var myMember = null;

    (async function init() {
        await requireSession();
        myMember = await getMyMember();
        if (!myMember) { window.location.href = '../1-2. 온보딩-시작하기/code.html'; return; }

        renderSavedGuests();
        advanceAnswersCache = await API.advanceAnswers.list(myMember.household_id);
        weekdayDefaultsCache = await API.weekdayDefaults.list(myMember.household_id);

        var params = new URLSearchParams(window.location.search);
        var editMealId_param = params.get('edit');

        if (editMealId_param) {
            var editMeal = await API.meals.get(editMealId_param);
            var roster = await API.mealParticipants.getRoster(editMealId_param);

            isEditMode = true;
            editMealId = editMeal.id;
            document.getElementById('pageTitle').textContent = '식사 수정하기';
            document.getElementById('submitBtn').textContent = '수정 완료';
            document.getElementById('editNotice').classList.remove('hidden');

            document.getElementById('mealDate').value = editMeal.date || '';
            if (editMeal.time) { document.getElementById('mealTime').value = editMeal.time; }
            else { document.getElementById('timeUndecided').checked = true; toggleTimeInput(); }
            selectMealType(KIND_KEYS[editMeal.kind] || 'home');
            (editMeal.menu || []).forEach(function (name) { addMenu(name); });
            roster.forEach(function (r) { addParticipant(r.name, r.color, true, true, r.memberId); });
            return;
        }

        selectMealType('home');
        await renderActiveRules();
        await renderActivePoll();

        var todayStr = new Date().toISOString().slice(0, 10);
        document.getElementById('mealDate').value = todayStr;
        repeatDays = [new Date().getDay()];

        var reuse = null;
        try { reuse = JSON.parse(localStorage.getItem('reuse_meal') || 'null'); localStorage.removeItem('reuse_meal'); } catch (err) {}

        var recipePick = null;
        try { recipePick = JSON.parse(localStorage.getItem('recipe_pick') || 'null'); localStorage.removeItem('recipe_pick'); } catch (err) {}

        if (recipePick) {
            addMenu(recipePick.name);
        } else if (reuse && reuse.menus && reuse.menus.length) {
            reuse.menus.forEach(function (name) { addMenu(name); });
        } else {
            addMenu('김치찌개');
        }

        var members = await API.members.list(myMember.household_id);
        members.filter(function (m) { return m.role !== 'guest'; }).forEach(function (m) {
            var isMe = m.id === myMember.id;
            // 온보딩(1-4)에서 "평소 안 먹음"으로 설정해둔 사람은 새 식사에서 기본 체크 해제.
            addParticipant(isMe ? (m.name || '나') + ' (나)' : m.name, m.color, m.default_response !== 'absent', false, m.id);
        });

        applyAdvanceAnswers();
        renderParticipants();
    })();
</script>
</body></html>
