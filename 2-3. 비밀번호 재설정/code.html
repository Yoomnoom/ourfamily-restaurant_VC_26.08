<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>우리집식당 - 비밀번호 재설정</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase-client.js"></script>
<script src="../shared/api.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
              "colors": {
                      "surface": "#fbf9f8", "surface-container-lowest": "#ffffff", "surface-container": "#f0eded",
                      "on-surface": "#1b1c1c", "on-surface-variant": "#45474a", "outline-variant": "#c6c6ca",
                      "primary": "#5d5e62", "on-primary": "#ffffff", "error": "#ba1a1a"
              },
              "spacing": { "section-margin": "2rem", "card-padding": "1.25rem", "safe-area-inset": "1rem" },
              "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
              "fontSize": {
                      "headline-lg": ["23px", { "lineHeight": "30px", "fontWeight": "600" }],
                      "body-md": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                      "label-sm": ["15px", { "lineHeight": "20px", "fontWeight": "500" }]
              }
      } } }
      </script>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#5d5e62">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집식당">
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center px-safe-area-inset">
<main class="w-full max-w-[420px] flex flex-col gap-4 py-section-margin">
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center mb-2">새 비밀번호 설정</h1>
<p id="statusMsg" class="font-label-sm text-label-sm text-on-surface-variant text-center"></p>
<input id="newPassword" type="password" placeholder="새 비밀번호 (6자 이상)" class="w-full border border-outline-variant rounded-lg px-3 py-2.5 font-body-md text-body-md text-on-surface bg-surface-container-lowest">
<input id="newPasswordConfirm" type="password" placeholder="새 비밀번호 확인" class="w-full border border-outline-variant rounded-lg px-3 py-2.5 font-body-md text-body-md text-on-surface bg-surface-container-lowest">
<button id="submitBtn" type="button" class="w-full py-3 rounded-full bg-primary text-on-primary font-label-sm text-label-sm" onclick="submitNewPassword()">비밀번호 바꾸기</button>
</main>
<script>
    async function submitNewPassword() {
        var p1 = document.getElementById('newPassword').value;
        var p2 = document.getElementById('newPasswordConfirm').value;
        var msg = document.getElementById('statusMsg');
        if (p1.length < 6) { msg.textContent = '비밀번호는 6자 이상이어야 해요'; msg.className = 'font-label-sm text-label-sm text-error text-center'; return; }
        if (p1 !== p2) { msg.textContent = '두 비밀번호가 서로 달라요'; msg.className = 'font-label-sm text-label-sm text-error text-center'; return; }
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '처리 중...';
        try {
            await API.auth.updatePassword(p1);
            msg.textContent = '비밀번호를 바꿨어요. 이동합니다...';
            msg.className = 'font-label-sm text-label-sm text-primary text-center';
            setTimeout(function () { window.location.href = '../3-0. 홈/code.html'; }, 1200);
        } catch (err) {
            msg.textContent = '실패했어요: ' + err.message;
            msg.className = 'font-label-sm text-label-sm text-error text-center';
            btn.disabled = false;
            btn.textContent = '비밀번호 바꾸기';
        }
    }

    (async function init() {
        // 이메일의 재설정 링크를 타고 들어오면 supabase-js가 URL의 recovery 토큰으로
        // 자동으로 임시 세션을 만들어줌 — 잠깐 기다렸다가 세션 없으면 링크가 잘못된 것으로 안내.
        await new Promise(function (r) { setTimeout(r, 300); });
        var session = await getSession();
        if (!session) {
            document.getElementById('statusMsg').textContent = '링크가 만료됐거나 잘못됐어요. 로그인 화면에서 다시 요청해주세요.';
            document.getElementById('statusMsg').className = 'font-label-sm text-label-sm text-error text-center';
            document.getElementById('newPassword').disabled = true;
            document.getElementById('newPasswordConfirm').disabled = true;
            document.getElementById('submitBtn').disabled = true;
        }
    })();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
</body></html>
