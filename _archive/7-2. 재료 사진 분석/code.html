<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>우리집식당 - 재료 사진 분석</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
              "colors": {
                      "surface": "#fbf9f8", "surface-container-lowest": "#ffffff", "surface-container": "#f0eded",
                      "on-surface": "#1b1c1c", "on-surface-variant": "#45474a", "outline-variant": "#c6c6ca",
                      "primary": "#5d5e62", "on-primary": "#ffffff", "tertiary-container": "#fef4e9", "on-tertiary-container": "#766f66"
              },
              "spacing": { "section-margin": "2rem", "card-padding": "1.25rem", "safe-area-inset": "1rem", "stack-gap": "1rem" },
              "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
              "fontSize": {
                      "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                      "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "label-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500" }]
              }
      } } }
      </script>
<style>
    body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }
    @keyframes pulse-ring { 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0; } }
    .pulse-ring { animation: pulse-ring 1.6s ease-out infinite; }
</style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<main class="w-full max-w-[480px] flex flex-col px-safe-area-inset py-section-margin">

<header class="flex items-center gap-3 mb-6">
<button class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../../7-1. 우리집 냉장고/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface">재료 사진 분석</h1>
</header>

<!-- Step 1: 업로드 선택 -->
<div id="uploadView">
<p class="font-body-md text-body-md text-on-surface-variant mb-6">냉장고 사진이나 영수증을 올리면 AI가 재료를 찾아드려요.</p>
<div class="grid grid-cols-2 gap-3">
<button class="bg-surface-container-lowest rounded-xl p-5 shadow-[0px_4px_12px_rgba(120,119,119,0.08)] flex flex-col items-center gap-2 active:scale-[0.98] transition-transform" onclick="startAnalysis()">
<span class="material-symbols-outlined text-primary" style="font-size:32px;">photo_camera</span>
<span class="font-label-sm text-label-sm text-on-surface">냉장고 사진</span>
</button>
<button class="bg-surface-container-lowest rounded-xl p-5 shadow-[0px_4px_12px_rgba(120,119,119,0.08)] flex flex-col items-center gap-2 active:scale-[0.98] transition-transform" onclick="startAnalysis()">
<span class="material-symbols-outlined text-primary" style="font-size:32px;">receipt_long</span>
<span class="font-label-sm text-label-sm text-on-surface">영수증 업로드</span>
</button>
</div>
</div>

<!-- Step 2: 분석 중 -->
<div id="analyzingView" class="hidden text-center py-8">
<div class="relative w-24 h-24 mx-auto mb-6 flex items-center justify-center">
<span class="absolute inset-0 rounded-full bg-tertiary-container pulse-ring"></span>
<span class="material-symbols-outlined text-primary relative" style="font-size:40px;">nutrition</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-1">AI가 재료를 찾고 있어요</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-6">잠시만 기다려주세요</p>
<div id="checklist" class="flex flex-col gap-2 text-left max-w-[260px] mx-auto"></div>
</div>

<!-- Step 3: 결과 -->
<div id="resultView" class="hidden">
<div class="flex items-center gap-2 bg-tertiary-container text-on-tertiary-container rounded-xl px-4 py-3 mb-4">
<span class="material-symbols-outlined">check_circle</span>
<p class="font-body-md text-body-md">총 <span id="foundCount">9</span>가지 재료를 찾았어요!</p>
</div>
<div id="resultGrid" class="grid grid-cols-3 gap-2 mb-6"></div>
<button class="w-full bg-primary text-on-primary font-label-sm text-[15px] py-4 rounded-full shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-[0.98] transition-transform" onclick="addToFridge()">냉장고에 추가</button>
</div>

</main>

<script>
    var FOUND = [
        { name: '감자', emoji: '🥔', confidence: 98, freshness: 'fresh', days: 0 },
        { name: '계란', emoji: '🥚', confidence: 99, freshness: 'fresh', days: 0 },
        { name: '양파', emoji: '🧅', confidence: 97, freshness: 'fresh', days: 0 },
        { name: '대파', emoji: '🌱', confidence: 95, freshness: 'fresh', days: 0 },
        { name: '치즈', emoji: '🧀', confidence: 94, freshness: 'fresh', days: 0 },
        { name: '당근', emoji: '🥕', confidence: 93, freshness: 'fresh', days: 0 },
        { name: '시금치', emoji: '🥬', confidence: 92, freshness: 'fresh', days: 0 },
        { name: '우유', emoji: '🥛', confidence: 91, freshness: 'fresh', days: 0 },
        { name: '버섯', emoji: '🍄', confidence: 90, freshness: 'fresh', days: 0 }
    ];
    var STEPS = ['사진 분석 중...', '식재료 인식 중...', '재료 정보 확인 중...', '신선도 분석 중...'];

    function startAnalysis() {
        document.getElementById('uploadView').classList.add('hidden');
        document.getElementById('analyzingView').classList.remove('hidden');

        var checklist = document.getElementById('checklist');
        checklist.innerHTML = '';
        STEPS.forEach(function (label) {
            var row = document.createElement('div');
            row.className = 'flex items-center gap-2 font-label-sm text-label-sm text-on-surface-variant';
            row.innerHTML = '<span class="material-symbols-outlined text-[16px] text-outline-variant step-icon">radio_button_unchecked</span><span>' + label + '</span>';
            checklist.appendChild(row);
        });

        var rows = checklist.querySelectorAll('.step-icon');
        var i = 0;
        var timer = setInterval(function () {
            if (i < rows.length) {
                rows[i].textContent = 'check_circle';
                rows[i].classList.remove('text-outline-variant');
                rows[i].style.color = '#6b7f5c';
                i++;
            } else {
                clearInterval(timer);
                showResult();
            }
        }, 500);
    }

    function showResult() {
        document.getElementById('analyzingView').classList.add('hidden');
        document.getElementById('resultView').classList.remove('hidden');
        document.getElementById('foundCount').textContent = FOUND.length;

        var grid = document.getElementById('resultGrid');
        grid.innerHTML = '';
        FOUND.forEach(function (item) {
            var cell = document.createElement('div');
            cell.className = 'bg-surface-container-lowest rounded-xl p-3 text-center shadow-[0px_4px_12px_rgba(120,119,119,0.08)]';
            cell.innerHTML = '<div class="text-2xl mb-1">' + item.emoji + '</div>' +
                '<p class="font-label-sm text-label-sm text-on-surface">' + item.name + '</p>' +
                '<p class="font-label-sm text-label-sm text-on-surface-variant">' + item.confidence + '%</p>';
            grid.appendChild(cell);
        });
    }

    function addToFridge() {
        var fridge = [];
        try { fridge = JSON.parse(localStorage.getItem('household_fridge') || '[]'); } catch (err) {}
        var existingNames = fridge.map(function (f) { return f.name; });
        FOUND.forEach(function (item) {
            if (existingNames.indexOf(item.name) === -1) { fridge.push(item); }
        });
        try { localStorage.setItem('household_fridge', JSON.stringify(fridge)); } catch (err) {}
        window.location.href = '../../7-1. 우리집 냉장고/code.html';
    }

    // 냉장고 화면의 "한 번에 등록해요"로 들어왔으면 사진/영수증 선택 화면을 또 보여주지 않고 바로 시작 —
    // 이 목업에서 두 버튼이 어차피 같은 startAnalysis()를 부르니, 고르게 하는 건 클릭 하나를 더 늘리는 일일 뿐이었음.
    (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('auto') === '1') { startAnalysis(); }
    })();
</script>
</body></html>
