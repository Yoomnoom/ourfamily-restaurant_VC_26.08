<script>
    function handleImageChange(event, target) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            var dataUrl = e.target.result;
            applyImage(target, dataUrl);
            try {
                localStorage.setItem('home_' + target + '_image', dataUrl);
            } catch (err) {}
        };
        reader.readAsDataURL(file);
    }

    function applyImage(target, dataUrl) {
        if (target === 'bg') {
            document.getElementById('bgImage').style.backgroundImage = "url('" + dataUrl + "')";
        } else if (target === 'circle') {
            document.getElementById('circleImage').src = dataUrl;
        }
    }

    (function restoreSavedImages() {
        try {
            var savedBg = localStorage.getItem('home_bg_image');
            var savedCircle = localStorage.getItem('home_circle_image');
            if (savedBg) applyImage('bg', savedBg);
            if (savedCircle) applyImage('circle', savedCircle);
        } catch (err) {}
    })();
</script>
