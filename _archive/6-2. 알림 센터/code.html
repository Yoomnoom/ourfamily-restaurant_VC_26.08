<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>우리집식당 - 알림</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
              "colors": {
                      "surface": "#fbf9f8", "surface-container-lowest": "#ffffff", "surface-container": "#f0eded",
                      "on-surface": "#1b1c1c", "on-surface-variant": "#45474a", "outline-variant": "#c6c6ca",
                      "primary": "#5d5e62", "on-primary": "#ffffff", "tertiary-container": "#fef4e9", "on-tertiary-container": "#766f66"
              },
              "spacing": { "section-margin": "2rem", "card-padding": "1.25rem", "safe-area-inset": "1rem", "stack-gap": "1rem" },
              "fontFamily": { "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"] },
              "fontSize": {
                      "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                      "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "label-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500" }]
              }
      } } }
      </script>
<style>body { min-height: max(884px, 100dvh); -webkit-tap-highlight-color: transparent; }</style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<main class="w-full max-w-[600px] flex flex-col px-safe-area-inset py-section-margin">

<header class="flex items-center gap-3 mb-6">
<button class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-[0px_4px_12px_rgba(120,119,119,0.08)] active:scale-95 transition-transform" onclick="window.location.href='../../3-1. 내 식탁/code.html'" aria-label="뒤로">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface">알림</h1>
</header>

<div id="list" class="flex flex-col gap-2"></div>

</main>

<script>
    var NOTIS = [
        { icon: 'sync_alt', color: '#9b8ab5', title: '박철수님이 응답을 바꿨어요', body: '먹어요 → 안 먹어요', time: '조금 전', unread: true, path: '../3-6. 응답 변경 알림/code.html' },
        { icon: 'schedule_send', color: '#8a9a7b', title: '이지은님이 아직 응답하지 않았어요', body: '오늘 저녁 식사 · 리마인드를 보내보세요', time: '1시간 전', unread: true, path: '../../3-4. 확정 전 요약/code.html' },
        { icon: 'check_circle', color: '#8a9a7b', title: '오늘의 식탁이 확정됐어요', body: '준비 인원 2명', time: '어제', unread: false, path: '../../3-5. 오늘의 식탁 완성/code.html' },
        { icon: 'celebration', color: '#c98a5a', title: '우리집식당에 오신 걸 환영해요!', body: '가구를 만들고 첫 식사를 열어보세요', time: '3일 전', unread: false, path: '../../3-1. 내 식탁/code.html' }
    ];

    var liveNotis = [];
    try { liveNotis = JSON.parse(localStorage.getItem('notifications') || '[]'); } catch (err) {}
    var allNotis = liveNotis.concat(NOTIS);

    var list = document.getElementById('list');
    allNotis.forEach(function (n) {
        var row = document.createElement('button');
        row.className = 'text-left w-full bg-surface-container-lowest rounded-xl p-4 shadow-[0px_4px_12px_rgba(120,119,119,0.08)] flex items-start gap-3';
        row.onclick = function () { window.location.href = n.path; };
        row.innerHTML =
            '<span class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:' + n.color + '22; color:' + n.color + ';"><span class="material-symbols-outlined text-[20px]">' + n.icon + '</span></span>' +
            '<div class="flex-1 min-w-0">' +
            '<div class="flex items-center gap-2">' +
            '<p class="font-body-md text-body-md text-on-surface font-medium">' + n.title + '</p>' +
            (n.unread ? '<span class="w-2 h-2 rounded-full bg-primary shrink-0"></span>' : '') +
            '</div>' +
            '<p class="font-label-sm text-label-sm text-on-surface-variant">' + n.body + '</p>' +
            '</div>' +
            '<span class="font-label-sm text-label-sm text-on-surface-variant shrink-0">' + n.time + '</span>';
        list.appendChild(row);
    });
</script>
</body></html>
